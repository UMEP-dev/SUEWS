name: Recorded test debt

# Detection only (Ting Sun, 2026-11-21): no issue writes or reopening.
# This independent workflow is not wired into an existing required check.
on:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: test-debt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory recorded defects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Check links and report counts
        shell: bash
        run: |
          set -o pipefail
          python scripts/lint/check_test_debt.py --strict --json test-debt.json | tee test-debt.md
      - name: Publish inventory summary
        if: always()
        run: |
          if test -f test-debt.md; then
            cat test-debt.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: recorded-test-debt
          path: |
            test-debt.json
            test-debt.md
          if-no-files-found: error
          retention-days: 14

  owners:
    name: Check recorded defect owners
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      # pull_request runs the PR's own workflow definition, so its owner check
      # is advisory for the PR, as every CI check is. The trusted audit is the
      # scheduled run on the default branch; the token only reads issues.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: recorded-test-debt
          path: inventory
      - name: Verify active and rationale owners
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('inventory/test-debt.json', 'utf8'));
            const isValidIssueList = list =>
              Array.isArray(list) &&
              list.length <= 1000 &&
              list.every(n => Number.isSafeInteger(n) && n > 0) &&
              new Set(list).size === list.length;
            if (!report || typeof report !== 'object' ||
                !isValidIssueList(report.issues) ||
                !isValidIssueList(report.active_issues) ||
                !isValidIssueList(report.rationale_issues) ||
                !report.summary || report.summary.errors !== 0 ||
                !['defect', 'coverage_gap', 'accepted_exception'].every(
                  k => Number.isSafeInteger(report.summary[k]) && report.summary[k] >= 0)) {
              throw new Error('Invalid or incomplete debt inventory');
            }
            const activeSet = new Set(report.active_issues);
            const rationaleSet = new Set(report.rationale_issues);
            const allSet = new Set(report.issues);
            const hasOverlap = [...activeSet].some(n => rationaleSet.has(n));
            const unionMatchesAll =
              activeSet.size + rationaleSet.size === allSet.size &&
              [...activeSet, ...rationaleSet].every(n => allSet.has(n));
            const activeRecordCount = report.summary.defect + report.summary.coverage_gap;
            const countsConsistent =
              (activeRecordCount > 0) === (activeSet.size > 0) &&
              activeSet.size <= activeRecordCount &&
              rationaleSet.size <= report.summary.accepted_exception &&
              (report.summary.accepted_exception === 0 || allSet.size > 0);
            if (hasOverlap || !unionMatchesAll || !countsConsistent) {
              throw new Error('Inconsistent active and rationale owner lists');
            }
            const expectedRepoSuffix =
              `/repos/${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const rows = [[
              {data: 'Issue', header: true},
              {data: 'Role', header: true},
              {data: 'Owner state', header: true}
            ]];
            const failures = [];
            for (const number of [...allSet].sort((a, b) => a - b)) {
              const role = activeSet.has(number) ? 'active' : 'rationale';
              let state;
              try {
                const {data} = await github.rest.issues.get({
                  ...context.repo, issue_number: number
                });
                const repoUrl = typeof (data && data.repository_url) === 'string'
                  ? data.repository_url.replace(/\/+$/, '').toLowerCase()
                  : null;
                if (!data || typeof data !== 'object') {
                  state = 'unexpected response';
                  failures.push(`#${number} (${role}): ${state}`);
                } else if (data.pull_request) {
                  state = 'is a pull request';
                  failures.push(`#${number} (${role}): ${state}`);
                } else if (repoUrl !== null && !repoUrl.endsWith(expectedRepoSuffix)) {
                  state = `transferred outside repository (${data.repository_url})`;
                  failures.push(`#${number} (${role}): ${state}`);
                } else if (data.number !== number) {
                  state = `redirected to #${data.number} (${data.state || 'unknown'})`;
                  failures.push(`#${number} (${role}): ${state}`);
                } else if (data.state !== 'open' && data.state !== 'closed') {
                  state = `unexpected state (${String(data.state)})`;
                  failures.push(`#${number} (${role}): ${state}`);
                } else {
                  state = data.state;
                  if (role === 'active' && state !== 'open') {
                    failures.push(`#${number} (${role}): ${state}`);
                  }
                }
              } catch (error) {
                state = `unverified (HTTP ${Number(error && error.status) || 'unknown'})`;
                failures.push(`#${number} (${role}): ${state}`);
              }
              rows.push([`#${number}`, role, state]);
            }
            const prefix = failures.length ? 'FAILED owner audit' : 'green';
            await core.summary
              .addHeading('Recorded test debt: owner audit')
              .addRaw(`${prefix} with ${report.summary.defect} recorded defects; ` +
                `${report.summary.coverage_gap} coverage gaps; ` +
                `${report.summary.accepted_exception} accepted exceptions ` +
                `(${activeSet.size} active owners; ${rationaleSet.size} rationale owners).\n\n`)
              .addRaw('Detection only: active owners (defect, coverage_gap) must exist as open issues; ' +
                'rationale owners (accepted_exception only) must exist as issues and may be closed. ' +
                'No issue is reopened. The schedule audits the default branch. ' +
                'These counts are not unique bugs or evidence that model tests pass.\n\n')
              .addTable(rows).write();
            if (failures.length) core.setFailed(failures.join('; '));
