name: Build and Publish Python wheels to PyPI and TestPyPI

# Builds and deploys SUEWS/SuPy Python wheels.
#
# Triggers:
#   schedule  -- Nightly 2 AM UTC: tag YYYY.M.D.dev -> build -> TestPyPI
#   tags      -- Any tag push: full matrix build -> PyPI (non-dev) or TestPyPI (dev)
#   PR        -- Validation only with adaptive matrix (draft=minimal, ready=reduced)
#   merge_group -- Merge queue validation (reduced matrix)
#   dispatch  -- Manual with configurable matrix, deploy target, test tier
#
# Build strategy:
#   One cp312-abi3 wheel per (OS, arch). The Rust bridge (PyO3 abi3-py312)
#   makes the binary ABI-stable, so a single wheel installs on cp312..cp3xx.
#   Covers current Windows QGIS 3 LTR, QGIS 4, and general users — the runtime
#   pin is numpy>=1.22 (Rust bridge has no NumPy C-ABI dependency; pure-Python
#   code uses only NumPy 1.22-compatible APIs).
#   UMEP/QGIS tests are integration-contract tests, not physics tests; normal
#   PR tiers exclude qgis and scheduled/release/manual `all` runs cover the
#   Windows + Python 3.12 runtime shared by current QGIS 3 LTR and QGIS 4.
#
# Nightly version: Tag YYYY.M.D.dev created BEFORE build for version consistency.
# See get_ver_git.py for version string logic, .github/path-filters.yml for categories.

on:
  push:
    tags:
      # CalVer release tags only: 2026.5, 2026.5.21.dev, etc. Excludes
      # SUEWS-agent tags (e.g. `agent/v0.3`) so those do not trigger a supy
      # wheel build + PyPI publish — they version the GitHub-distributed
      # agent (Claude Code / Codex plugin) only. Mirrors
      # `.github/workflows/docs-sync.yml`'s pattern.
      - '[0-9]*'

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No path filters -- branch protection requires this job; detect-changes handles filtering

  merge_group:
    types: [checks_requested]

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      matrix_config:
        description: 'Build matrix (custom = use toggles below)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - pr
          - minimal
          - custom

      # Platform toggles (custom only)
      plat_linux:
        description: '[custom] Linux (manylinux x86_64)'
        type: boolean
        default: true
      plat_macos_intel:
        description: '[custom] macOS Intel (x86_64)'
        type: boolean
        default: false
      plat_macos_arm:
        description: '[custom] macOS ARM (arm64)'
        type: boolean
        default: true
      plat_windows:
        description: '[custom] Windows (AMD64)'
        type: boolean
        default: true

      # Python toggles drive the cross-CPython api-test matrix (gh#1300).
      # The build is always cp312-abi3 (one wheel covers all supported CPythons),
      # so these toggles only affect which interpreters install the wheel and
      # run `-m "api and <tier>"` in each platform's api cross-CPython lane.
      py312:
        description: '[custom] Test on Python 3.12 (build is always cp312-abi3)'
        type: boolean
        default: true
      py313:
        description: '[custom] Test on Python 3.13'
        type: boolean
        default: false
      py314:
        description: '[custom] Test on Python 3.14'
        type: boolean
        default: true
      py315:
        description: '[custom] Test on Python 3.15'
        type: boolean
        default: true

      deploy_target:
        description: 'Deployment target (PyPI requires tagged release)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - testpypi
      test_tier:
        description: 'Test suite level'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - standard
          - core
          - cfg
          - smoke
      build_profile:
        description: 'Fortran build profile for this dispatch (release = optimised, no checks, the default; checked = runtime checks, what the nightly physics tier also builds)'
        required: false
        default: 'release'
        type: choice
        options:
          - checked
          - release
      tolerance_spread:
        description: 'Also record the zero-tolerance spread of the full-year sample comparison on every built platform for the two CPython bookends (what the nightly does; uploads tolerance-spread-* artefacts)'
        type: boolean
        default: false
      rss_growth:
        description: 'Run both real-physics RSS growth lanes and retention controls (requires Linux wheel)'
        type: boolean
        default: false
      api_serial_platforms:
        description: 'Comma-separated platforms (manylinux, macosx, win) whose api lane runs in one process instead of on its xdist workers; the SUEWS_API_SERIAL_PLATFORMS repository variable does the same on every event where this input is empty'
        required: false
        type: string
        default: ''
      pr_api_lane:
        description: 'Lay out the api lane as a pull request does (no macOS api cells; the Windows cp312 cell split into two shards), so the pull-request layout can be measured on a branch; pair it with test_tier standard and the custom matrix'
        type: boolean
        default: false
      cost_markers:
        description: 'Also check the medium/slow cost markers against the per-test CPU seconds of the Linux cp312 api and physics lanes (what the nightly does; needs test_tier all and Linux + py312 in the matrix)'
        type: boolean
        default: false
      python_coverage:
        description: 'Also measure Python line and branch coverage of supy and suews_mcp over the whole suite except qgis on the Linux cp312 wheel (what the nightly does; needs Linux in the matrix; uploads the python-coverage artefact)'
        type: boolean
        default: false
      lowest_direct_deps:
        description: 'Also install the Linux cp312 wheel with uv --resolution=lowest-direct and run core/smoke tests against declared dependency floors (needs Linux in the matrix)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-tag:
    name: Verify tag is on master
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      on-master: ${{ steps.check.outputs.on-master }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if git merge-base --is-ancestor $GITHUB_SHA refs/remotes/origin/master; then
            echo "on-master=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Tag ${TAG_NAME} not on master — skipping release"
            echo "on-master=false" >> $GITHUB_OUTPUT
          fi

  create_nightly_tag:
    name: Create nightly tag for scheduled builds
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create and push nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          DEV_TAG="${YEAR}.${MONTH}.${DAY}.dev"
          echo "Creating dev tag: ${DEV_TAG}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          if git ls-remote --tags origin | grep -q "refs/tags/${DEV_TAG}"; then
            echo "Tag ${DEV_TAG} already exists on remote, skipping"
          else
            git tag -a "${DEV_TAG}" -m "Nightly build ${YEAR}-${MONTH}-${DAY}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${DEV_TAG}"
            echo "Successfully created and pushed tag ${DEV_TAG}"
          fi

  detect-changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    outputs:
      needs-build: ${{ steps.decide.outputs.needs-build }}
      fortran-changed: ${{ steps.filter.outputs.fortran }}
      rust-changed: ${{ steps.filter.outputs.rust }}
      python-changed: ${{ steps.decide.outputs.python-changed }}
      util-changed: ${{ steps.filter.outputs.util }}
      build-changed: ${{ steps.decide.outputs.build-changed }}
      ci-changed: ${{ steps.filter.outputs.ci }}
      tests-changed: ${{ steps.decide.outputs.tests-changed }}
      docs-changed: ${{ steps.filter.outputs.docs }}
      site-changed: ${{ steps.filter.outputs.site }}
      rust-test-changed: ${{ steps.filter.outputs.rust_test }}
      rust-clippy-changed: ${{ steps.filter.outputs.rust_clippy }}
      encoding-audit-changed: ${{ steps.filter.outputs.encoding_audit }}
      workflow-security-changed: ${{ steps.filter.outputs.workflow_security }}
      dependency-audit-changed: ${{ steps.filter.outputs.dependency_audit }}
      fortran-uninit-changed: ${{ steps.filter.outputs.fortran_uninit }}
      rust-capi-observer-changed: ${{ steps.filter.outputs.rust_capi_observer }}
      fortran-files: ${{ steps.filter.outputs.fortran_files }}
      rust-files: ${{ steps.filter.outputs.rust_files }}
      python-files: ${{ steps.filter.outputs.python_files }}
      util-files: ${{ steps.filter.outputs.util_files }}
      build-files: ${{ steps.filter.outputs.build_files }}
      ci-files: ${{ steps.filter.outputs.ci_files }}
      tests-files: ${{ steps.filter.outputs.tests_files }}
      docs-files: ${{ steps.filter.outputs.docs_files }}
      site-files: ${{ steps.filter.outputs.site_files }}
      pyproject-files: ${{ steps.filter.outputs.pyproject_files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: .github/path-filters.yml
          list-files: 'json'

      # Content-aware: classify build-system/cibuildwheel/meson-python, package metadata/scripts/optional-deps, and pytest config
      - name: Classify pyproject.toml changes
        id: classify-pyproject
        if: steps.filter.outputs.pyproject == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Fetch just the base commit for pyproject.toml comparison
          if [ -n "$BASE_SHA" ]; then
            git fetch --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          fi
          python3 .github/scripts/classify_pyproject.py

      - name: Compute build decision
        id: decide
        env:
          FILTER_BUILD: ${{ steps.filter.outputs.build }}
          BUILD_RELEVANT: ${{ steps.classify-pyproject.outputs.build_relevant || 'false' }}
          FILTER_PYTHON: ${{ steps.filter.outputs.python }}
          PACKAGE_RELEVANT: ${{ steps.classify-pyproject.outputs.package_relevant || 'false' }}
          FILTER_FORTRAN: ${{ steps.filter.outputs.fortran }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
          FILTER_UTIL: ${{ steps.filter.outputs.util }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
          FILTER_TESTS: ${{ steps.filter.outputs.tests }}
          TEST_RELEVANT: ${{ steps.classify-pyproject.outputs.test_relevant || 'false' }}
        run: |
          BUILD_CHANGED=false
          if [[ "${FILTER_BUILD}" == "true" ]] || \
             [[ "${BUILD_RELEVANT}" == "true" ]]; then
            BUILD_CHANGED=true
          fi
          echo "build-changed=$BUILD_CHANGED" >> $GITHUB_OUTPUT

          PYTHON_CHANGED=false
          if [[ "${FILTER_PYTHON}" == "true" ]] || \
             [[ "${PACKAGE_RELEVANT}" == "true" ]]; then
            PYTHON_CHANGED=true
          fi
          echo "python-changed=$PYTHON_CHANGED" >> $GITHUB_OUTPUT

          TESTS_CHANGED=false
          if [[ "${FILTER_TESTS}" == "true" ]] || \
             [[ "${TEST_RELEVANT}" == "true" ]]; then
            TESTS_CHANGED=true
          fi
          echo "tests-changed=$TESTS_CHANGED" >> $GITHUB_OUTPUT

          FORTRAN="${FILTER_FORTRAN}"
          RUST="${FILTER_RUST}"
          UTIL="${FILTER_UTIL}"
          CI="${FILTER_CI}"

          NEEDS_BUILD=false
          if [[ "$FORTRAN" == "true" ]] || \
             [[ "$RUST" == "true" ]] || \
             [[ "$PYTHON_CHANGED" == "true" ]] || \
             [[ "$UTIL" == "true" ]] || \
             [[ "$BUILD_CHANGED" == "true" ]] || \
             [[ "$CI" == "true" ]] || \
             [[ "$TESTS_CHANGED" == "true" ]]; then
            NEEDS_BUILD=true
          fi
          echo "needs-build=$NEEDS_BUILD" >> $GITHUB_OUTPUT

  determine_matrix:
    name: Determine build matrix
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: always() && (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped')
    outputs:
      buildplat: ${{ steps.set-matrix.outputs.buildplat }}
      api_buildplat: ${{ steps.set-matrix.outputs.api_buildplat }}
      python: ${{ steps.set-matrix.outputs.python }}
      api_python: ${{ steps.set-matrix.outputs.api_python }}
      bookend_python: ${{ steps.set-matrix.outputs.bookend_python }}
      test_tier: ${{ steps.set-matrix.outputs.test_tier }}
      physics_change: ${{ steps.physics-label.outputs.found || 'false' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Data-only checkout of the BUILT ref's pyproject.toml (github.sha = the
      # PR merge commit / pushed commit / dispatched branch tip). The matrix
      # logic above stays base-trusted; only the requires-python value crosses
      # the trust boundary, so it cannot execute PR-authored code. This is what
      # lets the build floor track a PR's requires-python bump (gh#1553).
      - name: Fetch built-ref pyproject (data only; requires-python floor)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: _pr_meta

      # gh#1576: detect 0-physics:change or 0-numerics:change so the matrix runs
      # the full -m physics tier (incl. slow) before merge rather than only in the
      # nightly. Query live PR labels from the API in both pull_request and
      # single-PR merge_group contexts so determine_matrix and check_physics_label
      # see the same label state (including on full workflow reruns). On
      # merge_group, gh-readonly-queue/<base>/pr-<n>-<sha> identifies a single-PR
      # queue diff only when <sha> equals merge_group.base_sha (all ALLGREEN runs);
      # multi-PR or unparsed queue refs keep master's safe physics-full default.
      - name: Detect physics or numerics change label
        id: physics-label
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          REPO: ${{ github.repository }}
          LABELS_JSON: '["0-physics:change", "0-numerics:change"]'
        run: |
          set -euo pipefail
          found=false
          matched=""
          pr_num=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
              pr_num="$PR_NUMBER"
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            parsed_pr="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
            ref_base_sha="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-[0-9]+-([0-9a-f]+)$#\1#p')"
            if [[ "$parsed_pr" =~ ^[0-9]+$ && -n "${MERGE_BASE_SHA:-}" && "$ref_base_sha" == "$MERGE_BASE_SHA" ]]; then
              pr_num="$parsed_pr"
            fi
          fi

          if [[ -n "$pr_num" ]]; then
            matched="$(gh api --paginate "repos/${REPO}/issues/${pr_num}/labels?per_page=100" --jq '[.[].name]' \
              | jq -rs --argjson wanted "$LABELS_JSON" '[(add // [])[] | select(. as $l | any($wanted[]; . == $l))] | join(", ")')"
            if [[ -n "$matched" ]]; then
              found=true
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            # Multi-PR or unparsed queue ref: fail safe to physics-full, as on master.
            echo "::notice::merge_group queue ref does not identify a single-PR diff against base_sha; running full physics tier as a safe default"
            found=true
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "physics/numerics-change label present: $found (${matched:-none})"

      # A pull request builds and tests on Linux only unless it carries the
      # 0-ci:full-matrix label, which opts it into every PR platform (use it for
      # build-system, Fortran I/O and path-handling changes). Read live from
      # the API like the physics label, so after adding the label a re-run
      # (or the next push) picks it up; label events do not trigger a run.
      - name: Detect 0-ci:full-matrix label
        id: full-matrix-label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          found=false
          if [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            # A standalone assignment, so a failed API call stops the job
            # instead of reading as "label absent".
            labels="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/labels?per_page=100" --jq '.[].name')"
            if printf '%s\n' "$labels" | grep -qxF '0-ci:full-matrix'; then
              found=true
            fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "0-ci:full-matrix label present: $found"

      - name: Set matrix based on trigger type
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PHYSICS_CHANGE: ${{ steps.physics-label.outputs.found || 'false' }}
          FULL_MATRIX: ${{ steps.full-matrix-label.outputs.found || 'false' }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          FORTRAN_CHANGED: ${{ needs.detect-changes.outputs.fortran-changed || 'false' }}
          RUST_CHANGED: ${{ needs.detect-changes.outputs.rust-changed || 'false' }}
          PYTHON_CHANGED: ${{ needs.detect-changes.outputs.python-changed || 'false' }}
          UTIL_CHANGED: ${{ needs.detect-changes.outputs.util-changed || 'false' }}
          BUILD_CHANGED: ${{ needs.detect-changes.outputs.build-changed || 'false' }}
          CI_CHANGED: ${{ needs.detect-changes.outputs.ci-changed || 'false' }}
          TESTS_CHANGED: ${{ needs.detect-changes.outputs.tests-changed || 'false' }}
          INPUT_MATRIX_CONFIG: ${{ inputs.matrix_config }}
          INPUT_PLAT_LINUX: ${{ inputs.plat_linux }}
          INPUT_PLAT_MACOS_INTEL: ${{ inputs.plat_macos_intel }}
          INPUT_PLAT_MACOS_ARM: ${{ inputs.plat_macos_arm }}
          INPUT_PLAT_WINDOWS: ${{ inputs.plat_windows }}
          INPUT_PY312: ${{ inputs.py312 }}
          INPUT_PY313: ${{ inputs.py313 }}
          INPUT_PY314: ${{ inputs.py314 }}
          INPUT_PY315: ${{ inputs.py315 }}
          INPUT_TEST_TIER: ${{ inputs.test_tier }}
          INPUT_LOWEST_DIRECT_DEPS: ${{ inputs.lowest_direct_deps }}
          GITHUB_REF: ${{ github.ref }}
          PR_PYPROJECT: _pr_meta/pyproject.toml
        run: bash .github/scripts/determine-matrix.sh

  post-ci-summary:
    name: Post CI summary comment
    runs-on: ubuntu-latest
    needs: [detect-changes, determine_matrix]
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-changes.result == 'success' &&
      needs.determine_matrix.result == 'success'
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post or update CI summary comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FORTRAN_CHANGED: ${{ needs.detect-changes.outputs.fortran-changed }}
          RUST_CHANGED: ${{ needs.detect-changes.outputs.rust-changed }}
          PYTHON_CHANGED: ${{ needs.detect-changes.outputs.python-changed }}
          UTIL_CHANGED: ${{ needs.detect-changes.outputs.util-changed }}
          BUILD_CHANGED: ${{ needs.detect-changes.outputs.build-changed }}
          CI_CHANGED: ${{ needs.detect-changes.outputs.ci-changed }}
          TESTS_CHANGED: ${{ needs.detect-changes.outputs.tests-changed }}
          DOCS_CHANGED: ${{ needs.detect-changes.outputs.docs-changed }}
          SITE_CHANGED: ${{ needs.detect-changes.outputs.site-changed }}
          FORTRAN_FILES: ${{ needs.detect-changes.outputs.fortran-files || '[]' }}
          RUST_FILES: ${{ needs.detect-changes.outputs.rust-files || '[]' }}
          PYTHON_FILES: ${{ needs.detect-changes.outputs.python-files || '[]' }}
          UTIL_FILES: ${{ needs.detect-changes.outputs.util-files || '[]' }}
          BUILD_FILES: ${{ needs.detect-changes.outputs.build-files || '[]' }}
          CI_FILES: ${{ needs.detect-changes.outputs.ci-files || '[]' }}
          TESTS_FILES: ${{ needs.detect-changes.outputs.tests-files || '[]' }}
          DOCS_FILES: ${{ needs.detect-changes.outputs.docs-files || '[]' }}
          SITE_FILES: ${{ needs.detect-changes.outputs.site-files || '[]' }}
          PYPROJECT_FILES: ${{ needs.detect-changes.outputs.pyproject-files || '[]' }}
          NEEDS_BUILD: ${{ (needs.detect-changes.outputs.needs-build == 'true' || needs.determine_matrix.outputs.physics_change == 'true') && 'true' || 'false' }}
          TEST_TIER: ${{ needs.determine_matrix.outputs.test_tier }}
          BUILDPLAT_JSON: ${{ needs.determine_matrix.outputs.buildplat }}
          PYTHON_JSON: ${{ needs.determine_matrix.outputs.python }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const script = require('./.github/scripts/post-ci-summary.js');
            await script({ github, context });

  # One reusable-workflow call per platform, so each platform's api
  # cross-CPython lane (chained inside build-wheels-reusable.yml) starts as
  # soon as that platform's wheel exists rather than when the slowest build
  # has finished. The job id stays `build_wheels`: its result aggregates every
  # platform's wheel build and api lane, and is what pr-gate, the publish jobs
  # and the nightly report read. build_mcp is a dependency because the api
  # lane installs the suews-mcp-dist artefact and a job inside a reusable
  # workflow cannot wait on a caller job itself; the wheel build still runs
  # when build_mcp fails (run_api_tests is then false, as before).
  build_wheels:
    name: Build and test (${{ matrix.buildplat[1] }} ${{ matrix.buildplat[2] }})
    needs: [determine_matrix, create_nightly_tag, detect-changes, verify-release-tag, build_mcp]
    if: |
      always() &&
      needs.determine_matrix.result == 'success' &&
      (needs.create_nightly_tag.result == 'success' || needs.create_nightly_tag.result == 'skipped') &&
      (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.needs-build == 'true' || needs.determine_matrix.outputs.physics_change == 'true') &&
      (needs.verify-release-tag.result == 'skipped' || needs.verify-release-tag.outputs.on-master == 'true')
    strategy:
      fail-fast: false
      matrix:
        buildplat: ${{ fromJson(needs.determine_matrix.outputs.buildplat) }}
    uses: $/.github/workflows/build-wheels-reusable.yml
    with:
      buildplat_json: ${{ format('[["{0}", "{1}", "{2}"]]', matrix.buildplat[0], matrix.buildplat[1], matrix.buildplat[2]) }}
      python_json: ${{ needs.determine_matrix.outputs.python }}
      # The merge queue runs the Windows wheel at the smoke tier only (Linux
      # carries the queue's full tier); every other event and platform runs
      # the tier determine_matrix chose.
      test_tier: ${{ github.event_name == 'merge_group' && matrix.buildplat[1] == 'win' && 'smoke' || needs.determine_matrix.outputs.test_tier }}
      is_testpypi_build: ${{ (github.event_name == 'schedule' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'dev'))) && 'true' || 'false' }}
      build_profile: ${{ inputs.build_profile || 'release' }}
      # The api lane runs on this platform when it is in api_buildplat (the
      # nightly, the full dispatch and tag releases drop macos-15-intel there;
      # every other event sets it equal to buildplat) and the MCP distribution it installs was built. The quoted
      # runner label is the containment key because the script writes the
      # triples as `["<runner>", "<platform>", "<arch>"]`, and the closing
      # quote keeps "macos-15" from matching "macos-15-intel". Fall back to
      # the full buildplat when api_buildplat is empty: determine_matrix runs
      # determine-matrix.sh from the BASE branch (trusted-script design), so a
      # PR that introduces or extends the api_buildplat output would otherwise
      # skip every api lane until the script change lands on master.
      #
      # Pull requests skip the macOS api cells: macOS runners are the scarce
      # class, and those two cells queued for up to ~90 min under burst pushes
      # on 22 Nov 2026, while the macOS wheel is still built and runs its
      # physics tier on every PR labelled 0-ci:full-matrix. The merge queue runs
      # the api lane on Linux only (determine-matrix.sh sets api_buildplat;
      # the merge_group term repeats it here because determine_matrix runs the
      # base branch's script). The nightly (every bookend) keeps the macOS and
      # Windows api coverage. The pr_api_lane dispatch input applies the
      # pull-request layout to a dispatch.
      run_api_tests: ${{ needs.build_mcp.result == 'success' && contains(needs.determine_matrix.outputs.api_buildplat || needs.determine_matrix.outputs.buildplat, format('"{0}"', matrix.buildplat[0])) && !((github.event_name == 'pull_request' || inputs.pr_api_lane) && matrix.buildplat[1] == 'macosx') && !(github.event_name == 'merge_group' && matrix.buildplat[1] != 'manylinux') }}
      # Ready pull requests and the merge queue (and the pr_api_lane
      # dispatch, which measures that layout on a branch) test the Linux
      # wheel in parallel jobs instead of serially (22 Nov 2026): the wheel
      # uploads untested, then the physics tier runs as two shards (three for
      # physics-full) in the wheel's manylinux image while the api lane runs
      # the build Python as four shards. On a pull request the newer Python
      # bookend runs the core-bookend api tier (every core api test plus
      # smoke) in one job; its non-core api tests wait for the nightly, and
      # the merge queue runs the build Python only. The core-test guard
      # checks the shards add up. Draft tiers keep the wheel-job physics run
      # and are never sharded. scripts/suews/ci_test_layout.py turns these
      # inputs into the jobs.
      split_tests: >-
        ${{ matrix.buildplat[1] == 'manylinux' &&
        (needs.determine_matrix.outputs.test_tier == 'standard' || needs.determine_matrix.outputs.test_tier == 'physics-full') &&
        (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.pr_api_lane == true)) }}
      physics_shards: ${{ needs.determine_matrix.outputs.test_tier == 'physics-full' && 3 || 2 }}
      api_bookend_core: >-
        ${{ matrix.buildplat[1] == 'manylinux' &&
        (needs.determine_matrix.outputs.test_tier == 'standard' || needs.determine_matrix.outputs.test_tier == 'physics-full') &&
        (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_api_lane == true)) }}
      # Pull requests split the Windows cp312 api cell, the usual critical
      # path, into two shards (scripts/suews/pytest_shard.py); Windows
      # runners queue at about zero, so the extra runner costs no wait. The
      # Linux build-Python cell runs as four shards on pull requests and in
      # the merge queue. The nightly runs every cell whole.
      api_shard_python: >-
        ${{ (((github.event_name == 'pull_request' || inputs.pr_api_lane) && matrix.buildplat[1] == 'win') ||
        (matrix.buildplat[1] == 'manylinux' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.pr_api_lane)))
        && fromJson(needs.determine_matrix.outputs.python)[0] || '' }}
      api_shard_count: ${{ matrix.buildplat[1] == 'manylinux' && 4 || 2 }}
      # A ready PR already validates both supported Python bookends. The merge
      # queue revalidates the combined tree on the abi3 floor only, on Linux,
      # instead of repeating the full suite twice.
      # Use the build-Python output here as a compatibility bridge while the
      # trusted determine-matrix script is still read from the base branch.
      api_python_json: >-
        ${{ github.event_name == 'merge_group' && needs.determine_matrix.outputs.python || needs.determine_matrix.outputs.api_python }}
      # Escape hatch (#1786 measured the worker counts): a dispatch input for
      # one run, or the SUEWS_API_SERIAL_PLATFORMS repository variable for
      # every event, serialises the named platforms without a workflow edit.
      # The reusable workflow forwards this to the api lane it chains.
      serial_platforms: ${{ inputs.api_serial_platforms || vars.SUEWS_API_SERIAL_PLATFORMS || '' }}
      # The nightly coverage recording job runs inside the Linux call, chained
      # behind that platform's wheel only, so it no longer waits for every
      # platform's api lane (it started ~58 min into the 22 Nov 2026 nightly
      # and hit its timeout on 21 Nov). The trigger stays here because
      # inputs.python_coverage inside the reusable workflow would be the
      # workflow_call input, not the dispatch input. It needs the MCP
      # distribution as the api lane does.
      # The dependency-floor smoke tests run on the Linux cp312 wheel inside
      # this call, as soon as it exists (gh#2104 F-17a).
      run_lowest_direct_deps: >-
        ${{ matrix.buildplat[1] == 'manylinux' && matrix.buildplat[2] == 'x86_64' &&
        (github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && inputs.lowest_direct_deps == true) ||
         ((github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          needs.detect-changes.outputs.dependency-audit-changed == 'true')) }}
      run_python_coverage: >-
        ${{ matrix.buildplat[1] == 'manylinux' && matrix.buildplat[2] == 'x86_64' &&
        needs.build_mcp.result == 'success' &&
        (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.python_coverage == true)) }}

  # Nightly only: build the checked profile (-O0 -fcheck=all) on every platform
  # and run the full physics tier on it, so out-of-bounds and uninitialised
  # reads keep surfacing as Fortran runtime errors now that the published
  # wheels are release builds. Its artefacts carry the "checked-" prefix, so
  # the TestPyPI and API-test jobs, which select by the unprefixed names,
  # never see them.
  build_wheels_checked:
    name: Build checked wheels (nightly physics tier)
    needs: [determine_matrix, create_nightly_tag]
    if: |
      always() &&
      github.event_name == 'schedule' &&
      needs.determine_matrix.result == 'success' &&
      needs.create_nightly_tag.result == 'success'
    uses: $/.github/workflows/build-wheels-reusable.yml
    with:
      buildplat_json: ${{ needs.determine_matrix.outputs.buildplat }}
      python_json: ${{ needs.determine_matrix.outputs.python }}
      test_tier: all
      is_testpypi_build: 'false'
      build_profile: checked
      artifact_prefix: checked-

  # build_wheels waits for this job (its api lane installs the artefact), so
  # it sits in front of every wheel build: the checkout is blob-less, which
  # is all get_ver_git.py needs, and is what the wheel build itself does.
  build_mcp:
    name: Build MCP package
    runs-on: ubuntu-latest
    needs: [create_nightly_tag, detect-changes, verify-release-tag]
    if: |
      always() &&
      (needs.create_nightly_tag.result == 'success' || needs.create_nightly_tag.result == 'skipped') &&
      (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.needs-build == 'true') &&
      (needs.verify-release-tag.result == 'skipped' || needs.verify-release-tag.outputs.on-master == 'true')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Generate version files from git
        run: |
          python3 get_ver_git.py
          python3 -c "from pathlib import Path; ns = {}; exec(Path('mcp/src/suews_mcp/_version_scm.py').read_text(), ns); print('Generated MCP version:', ns['__version__'])"

      - name: Build MCP distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build mcp

      - name: Upload MCP distribution
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: suews-mcp-dist
          path: mcp/dist/*

  rss_growth:
    name: RSS growth (Linux cp312)
    needs: [build_wheels]
    # A requested lane still runs after a failed/skipped build and fails on
    # the missing wheel, instead of silently disappearing from the nightly.
    if: >-
      always() && (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.rss_growth == true))
    runs-on: ubuntu-latest
    # Ten workers, each bounded to four minutes, plus wheel setup and upload.
    timeout-minutes: 55
    env:
      RSS_WHEEL_DIR: wheelhouse
      RSS_WHEEL_ARTIFACT: cp312-manylinux-x86_64
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cp312-manylinux-x86_64
          path: wheelhouse/
      - name: Install this revision's wheel
        run: python -m pip install --force-reinstall wheelhouse/*.whl
      - name: Measure both lanes and prove retention detection
        run: make test-rss-growth
      - name: Preserve raw samples, diagnostics and child logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: rss-growth-linux-cp312
          path: rss-growth/
          if-no-files-found: error
          retention-days: 30

  # Nightly and on demand: record the zero-tolerance spread of the full-year
  # sample comparison (scripts/suews/tolerance_spread.py) on every built
  # platform for the two CPython bookends, one JSON artefact per cell. The
  # tolerances in test/core/test_sample_output.py are to be derived from a week
  # of these artefacts, so this job records and never gates: the script exits 0
  # however large the spread, continue-on-error on the measuring job (inside
  # the reusable workflow, where GitHub accepts it) keeps a runner or install
  # failure here from turning the nightly red, and the job feeds neither
  # report_scheduled_run nor pr-gate. It installs the release wheel the run
  # built (or the profile a dispatch chose), so it measures what ships.
  # build_wheels covers each platform's wheel build and api lane, so this job
  # starts once the api lanes have finished too; it records, so the wait is
  # harmless.
  #
  # The (platform x CPython) matrix lives in tolerance-spread-reusable.yml and
  # this job carries a static name, so the checks list shows one "Tolerance
  # spread" group with a "cpXYZ-<platform> <arch>" child per cell instead of
  # one top-level entry per cell (.claude/rules/ci/conventions.md, "Matrix
  # jobs render as one group"). On PR and merge-queue runs the false `if`
  # renders as one skipped "Tolerance spread" entry.
  tolerance_spread:
    name: Tolerance spread
    needs: [determine_matrix, build_wheels]
    if: |
      always() &&
      needs.build_wheels.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.tolerance_spread == true)
      )
    uses: $/.github/workflows/tolerance-spread-reusable.yml
    with:
      buildplat_json: ${{ needs.determine_matrix.outputs.buildplat }}
      python_json: ${{ needs.determine_matrix.outputs.bookend_python }}
      build_profile: ${{ inputs.build_profile || 'release' }}

  # Nightly and on demand: check the `medium` and `slow` cost markers against
  # the CPU seconds the metrics plugin records per test on the Linux reference
  # runner (scripts/lint/check_cost_markers.py; thresholds and reasoning in
  # .claude/rules/tests/patterns.md). Wall time on a hosted runner sits on a 2x
  # noise floor, so the markers are defined by process CPU seconds and this
  # job is where drift shows. It reports and never gates: the lint exits 1 on
  # drift so a local run is useful and this job's page marks the night, and
  # continue-on-error keeps that (and any download failure) from turning the
  # nightly red. Its outputs (status drift, clean or unavailable, and the number
  # of flagged tests) go to report_scheduled_run, which prints them in its job
  # summary and, on a night that is failing for another reason, in the
  # tracking-issue comment; drift is never counted as a failure there, so on its
  # own it neither reddens the night nor opens an issue. The job is not in
  # pr-gate. It needs the two Linux cp312 metrics artefacts, which only a
  # full-tier run with Linux and py312 in its matrix produces. Pull requests
  # run the same lint on the test files they change (cost_markers_pr below).
  cost_markers:
    name: Cost-marker drift (Linux cp312 CPU seconds)
    # build_wheels chains each platform's API lane behind its wheel, so its
    # result covers the api metrics artefact this job downloads as well.
    needs: [build_wheels]
    if: |
      always() &&
      needs.build_wheels.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.cost_markers == true)
      )
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    outputs:
      status: ${{ steps.outcome.outputs.status }}
      flagged: ${{ steps.outcome.outputs.flagged }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: scripts/lint/check_cost_markers.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Download the Linux cp312 api metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # A pattern, so a sharded lane (one artefact per shard) is read whole.
          pattern: ci-metrics-api-cp312-manylinux-x86_64*
          merge-multiple: true
          path: ci-metrics/api

      - name: Download the Linux cp312 physics metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # A pattern, so a sharded lane (one artefact per shard) is read whole.
          pattern: ci-metrics-physics-cp312-manylinux-x86_64*
          merge-multiple: true
          path: ci-metrics/physics

      - name: Check cost markers against measured CPU seconds
        shell: bash
        run: >-
          python scripts/lint/check_cost_markers.py ci-metrics
          --require-axis api
          --require-axis physics
          --histogram
          --markdown "$GITHUB_STEP_SUMMARY"
          --json cost-markers.json

      # Runs whatever the lint concluded, so report_scheduled_run learns the
      # outcome. No report (a download or schema failure) reads as
      # unavailable, never as clean.
      - name: Record the drift outcome
        id: outcome
        if: always()
        shell: bash
        run: |
          if [ -f cost-markers.json ]; then
            flagged="$(jq -r '.flagged' cost-markers.json)"
            if [ "$flagged" -gt 0 ]; then status=drift; else status=clean; fi
          else
            flagged=0
            status=unavailable
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "flagged=${flagged}" >> "$GITHUB_OUTPUT"
          echo "Cost-marker drift: ${status} (${flagged} flagged)"
          if [ "$status" = drift ]; then
            echo "::warning title=Cost-marker drift::${flagged} test(s) carry a cost marker that disagrees with their measured CPU seconds; see the Cost-marker drift job summary"
          fi

  # Pull requests: the cost_markers lint restricted to the test files the PR
  # adds or changes, with the result added to the CI summary comment that
  # post-ci-summary writes, so a heavy test without a cost marker is named
  # while its author is still on the PR (the 42 tests the nightly of
  # 14 November 2026 flagged all sat in one file #1894 had added, and the
  # nightly told nobody). It informs and never gates: every step that can fail
  # carries continue-on-error, so does the job, and pr-gate does not need it.
  # The lint and the comment script come from the base branch, as in
  # post-ci-summary, because the job holds a write token; the metrics
  # artefacts and file names it reads are data. PR tiers do not run `slow`
  # tests (smoke skips `medium` too), so the comment states how many tests it
  # measured and says nothing when none of the changed tests ran. A fork PR's
  # token is read-only, so there the comment step is skipped and a notice
  # says the result is in the job summary.
  cost_markers_pr:
    name: Cost markers of changed tests
    needs: [detect-changes, determine_matrix, post-ci-summary, build_wheels]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.tests-changed == 'true' &&
      (needs.post-ci-summary.result == 'success' || needs.post-ci-summary.result == 'failure' || needs.post-ci-summary.result == 'skipped') &&
      (needs.build_wheels.result == 'success' || needs.build_wheels.result == 'failure')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/lint/check_cost_markers.py
            .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Download the Linux cp312 api metrics
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # A pattern, so a sharded lane (one artefact per shard) is read whole.
          pattern: ci-metrics-api-cp312-manylinux-x86_64*
          merge-multiple: true
          path: ci-metrics/api

      - name: Download the Linux cp312 physics metrics
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # A pattern, so a sharded lane (one artefact per shard) is read whole.
          pattern: ci-metrics-physics-cp312-manylinux-x86_64*
          merge-multiple: true
          path: ci-metrics/physics

      - name: Check the cost markers of the changed test files
        continue-on-error: true
        shell: bash
        env:
          TESTS_FILES: ${{ needs.detect-changes.outputs.tests-files || '[]' }}
        run: |
          # File names are PR data: read them into an array through jq, never
          # into the text of a command.
          mapfile -t files < <(printf '%s' "$TESTS_FILES" | jq -r '.[] | select(test("^test/.+\\.py$"))')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files under test/ changed; nothing to check."
            exit 0
          fi
          args=()
          for f in "${files[@]}"; do args+=(--test-file "$f"); done
          python scripts/lint/check_cost_markers.py ci-metrics "${args[@]}" \
            --json cost-markers.json --markdown "$GITHUB_STEP_SUMMARY"

      - name: Add the result to the CI summary comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TEST_TIER: ${{ needs.determine_matrix.outputs.test_tier }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('cost-markers.json')) {
              core.info('No cost-marker report (no changed test file, or the check could not run); comment left as it is.');
              return;
            }
            const report = JSON.parse(fs.readFileSync('cost-markers.json', 'utf8'));
            const { postCostMarkers } = require('./.github/scripts/post-ci-summary.js');
            await postCostMarkers({ github, context, core, report, testTier: process.env.TEST_TIER });

      # A fork PR's token cannot edit comments (GitHub restricts it to read),
      # so say where the result is instead of failing the comment step.
      - name: Explain why a fork PR gets no comment
        if: github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          echo "::notice title=Cost markers::This pull request comes from a fork, whose workflow token is read-only, so the CI summary comment is not edited. The cost-marker result is in this job's summary."

  # Pull requests (standard tier only): report-only guard that checks whether
  # the PR makes the Linux cp312 API or physics test lanes slower by more than
  # 10% relative to the unchanged reference cohort in the committed baseline
  # (`scripts/lint/test_duration_baseline.json`), or leaves new/changed tests
  # over the repository's cost-marker thresholds without the matching marker.
  # It downloads both unsharded and N-sharded API and physics artefacts into
  # separate subdirectories (aggregating across shards after per-shard scaling),
  # emits warning annotations and a job summary, and adds an advisory section to
  # the CI summary comment. It never gates: continue-on-error is true on the job
  # and steps, and neither pr-gate nor report_scheduled_run depends on it.
  # Ordering post-ci-summary -> cost_markers_pr -> test_duration_guard (with
  # always()) prevents concurrent updates to the sticky PR comment.
  test_duration_guard:
    name: Test duration guard (Linux cp312)
    needs: [detect-changes, determine_matrix, post-ci-summary, build_wheels, cost_markers_pr]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.determine_matrix.result == 'success' &&
      needs.determine_matrix.outputs.test_tier == 'standard' &&
      (needs.post-ci-summary.result == 'success' || needs.post-ci-summary.result == 'failure' || needs.post-ci-summary.result == 'skipped') &&
      (needs.build_wheels.result == 'success' || needs.build_wheels.result == 'failure') &&
      (needs.cost_markers_pr.result == 'success' || needs.cost_markers_pr.result == 'failure' || needs.cost_markers_pr.result == 'skipped')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/lint/check_cost_markers.py
            scripts/lint/check_test_duration.py
            scripts/lint/test_duration_baseline.json
            .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      # Pattern matches both an unsharded Linux cp312 API artefact and any
      # sharded artefacts (`...-shard-K-of-N`) into separate subdirectories.
      - name: Download the Linux cp312 api metrics
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-metrics-api-cp312-manylinux-x86_64*
          path: ci-metrics/api

      # Pattern matches both an unsharded Linux cp312 physics artefact and any
      # sharded artefacts (`...-shard-K-of-N`) into separate subdirectories,
      # isolating unsuffixed wheel-job metadata from the pytest shard JSONs.
      - name: Download the Linux cp312 physics metrics
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-metrics-physics-cp312-manylinux-x86_64*
          path: ci-metrics/physics

      - name: Check runner-normalised test durations against baseline
        continue-on-error: true
        shell: bash
        env:
          TESTS_FILES: ${{ needs.detect-changes.outputs.tests-files || '[]' }}
        run: |
          if [ ! -f scripts/lint/check_test_duration.py ] || [ ! -f scripts/lint/test_duration_baseline.json ]; then
            echo "check_test_duration.py or its baseline is not yet on the base branch; skipping."
            exit 0
          fi
          mkdir -p ci-metrics
          # File names are PR data: read them into an array through jq, never
          # into the text of a command.
          mapfile -t files < <(printf '%s' "$TESTS_FILES" | jq -r '.[] | select(test("^test/.+\\.py$"))')
          args=()
          if [ "${#files[@]}" -eq 0 ]; then
            args+=(--no-changed-test-files)
          else
            for f in "${files[@]}"; do args+=(--test-file "$f"); done
          fi
          python scripts/lint/check_test_duration.py ci-metrics \
            --baseline scripts/lint/test_duration_baseline.json \
            "${args[@]}" \
            --annotations \
            --json duration-guard.json \
            --markdown "$GITHUB_STEP_SUMMARY"

      - name: Add the duration-guard result to the CI summary comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('duration-guard.json')) {
              core.info('No duration-guard report; comment left as it is.');
              return;
            }
            const summaryMod = require('./.github/scripts/post-ci-summary.js');
            if (typeof summaryMod.postDurationGuard !== 'function') {
              core.info('postDurationGuard not yet on base branch; comment left as it is.');
              return;
            }
            const report = JSON.parse(fs.readFileSync('duration-guard.json', 'utf8'));
            await summaryMod.postDurationGuard({ github, context, core, report });

      - name: Explain why a fork PR gets no duration-guard comment
        if: github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          echo "::notice title=Test duration guard::This pull request comes from a fork, whose workflow token is read-only, so the CI summary comment is not edited. The duration-guard result is in this job's summary."

  # Standalone static lints over the test tree. Both use AST-based scripts
  # that never import supy, so CI can run them without building — that is
  # what keeps the check cheap for test-only PRs.
  #
  #  1. Every test file must declare `physics` or `api` (gh#1300). The
  #     runtime counterpart is a pytest_collection_finish hook in
  #     test/conftest.py, which catches the same thing during normal
  #     full-tree pytest runs.
  #  2. No test may inspect an imported module through `<module>.__file__`;
  #     use `importlib.resources` for packaged data instead. See
  #     `.claude/rules/tests/patterns.md` ("Locating packaged data").
  #  3. No Fortran procedure local may carry a declaration initialiser or
  #     SAVE, which would share it between parallel grid threads (gh#1741).
  #     Also a text scan that needs no build.
  #  4. Fortran physical-constant literals (273.15, Stefan-Boltzmann, pi,
  #     degree-radian and time factors, cp and Lv) must match their
  #     committed per-file baseline. A text scan that needs no build.
  #  5. Legacy optional YAML readers in `src/suews_bridge/src/yaml_config.rs`
  #     must match their committed per-function baseline so counts can only go
  #     down as #1991/#2002 converts blocks to `require_*`. A text scan that
  #     needs no build.
  #
  # The job id and display name are unchanged so nothing that references
  # them (needs:, .github/scripts/pr-gate.sh, branch protection) breaks.
  check_test_markers:
    name: Check pytest marker axis
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'merge_group' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Lint physics/api marker coverage
        shell: bash
        run: python scripts/lint/check_test_markers.py

      # `always()` so a marker failure does not mask a packaged-data
      # failure: a contributor should see both in one run, not one per push.
      - name: Lint packaged-data path access
        if: always()
        shell: bash
        run: python scripts/lint/check_packaged_data_paths.py

      # Declaration initialisers make Fortran locals implicitly SAVEd and so
      # shared between parallel grid threads (gh#1741).
      - name: Lint implicitly saved Fortran locals
        if: always()
        shell: bash
        run: python scripts/lint/check_saved_fortran_locals.py

      # Physical-constant and unit-conversion literals in the kernel may only
      # go down: counts per file are pinned by a committed baseline, which a
      # clean-up PR lowers in the same diff.
      - name: Lint Fortran literal constants against the baseline
        if: always()
        shell: bash
        run: python scripts/lint/check_fortran_literals.py

      # Legacy optional YAML readers in the Rust bridge may only go down while
      # #1991/#2002 converts read sites block by block to require_* readers.
      - name: Lint Rust bridge optional YAML readers against the baseline
        if: always()
        shell: bash
        run: python scripts/lint/check_rust_optional_reads.py

  # A change to the stored reference outputs must declare itself as a physics
  # or numerical change (.claude/rules/physics-change-evidence.md). The exact
  # sample-output check (test/core/test_sample_output_exact.py) fails any PR
  # whose run moves a stored value, so the only way to land such a change is to
  # refresh the reference in the same PR; this job then requires exactly one of
  # 0-physics:change or 0-numerics:change on that refresh, rejects both together,
  # and verifies that determine_matrix selected test_tier=physics-full on ready
  # PRs and merge_group runs.
  #
  # Both determine_matrix and this job read live PR labels from the API (on
  # merge_group, pr-<n>-<sha> identifies a single-PR diff only when <sha> equals
  # merge_group.base_sha; multi-PR or unparsed queue refs keep master's safe
  # physics-full default). Job id and display name stay unchanged so pr-gate and
  # branch-protection references do not break.
  check_physics_label:
    name: Physics-change label
    runs-on: ubuntu-latest
    needs: [determine_matrix]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    steps:
      - name: Check reference and physics changes against the label
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          DETERMINE_MATRIX_RESULT: ${{ needs.determine_matrix.result }}
          TEST_TIER: ${{ needs.determine_matrix.outputs.test_tier }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          LABELS_JSON: '["0-physics:change", "0-numerics:change"]'
        run: |
          set -euo pipefail
          ref_regex='^test/fixtures/(data_test/(sample_output_2012-[0-9]{2}\.csv|provenance\.json|stebbs_test/sample_output_stebbs\.csv)|w16_most\.csv)$'
          phys_regex='^src/suews/src/suews_phys_[^/]+\.f9[05]$'

          if [[ "${DETERMINE_MATRIX_RESULT:-}" != "success" ]]; then
            echo "::error::determine_matrix did not succeed (result=${DETERMINE_MATRIX_RESULT:-unset}); cannot verify physics-full tier alignment."
            exit 1
          fi

          pr_num=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_num="$PR_NUMBER"
            files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
          else
            files="$(gh api "repos/${REPO}/compare/${MERGE_BASE_SHA}...${MERGE_HEAD_SHA}" --jq '.files[].filename')"
            parsed_pr="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
            ref_base_sha="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-[0-9]+-([0-9a-f]+)$#\1#p')"
            if [[ "$parsed_pr" =~ ^[0-9]+$ && -n "${MERGE_BASE_SHA:-}" && "$ref_base_sha" == "$MERGE_BASE_SHA" ]]; then
              pr_num="$parsed_pr"
            fi
          fi

          reference="$(printf '%s\n' "$files" | grep -E "$ref_regex" || true)"
          physics="$(printf '%s\n' "$files" | grep -E "$phys_regex" || true)"

          if [[ -z "$pr_num" ]]; then
            echo "::notice::merge_group queue ref does not identify a single-PR diff against base_sha; per-PR label checks ran on pull_request, and merge_group requires physics-full as a safe default"
            if [[ "${TEST_TIER:-}" != "physics-full" ]]; then
              echo "::error::Unresolved or multi-PR merge_group ref requires test_tier=physics-full, got test_tier=${TEST_TIER:-unset}."
              exit 1
            fi
            echo "[OK] Multi-PR or unparsed merge_group ref gated by physics-full"
            exit 0
          fi

          labels_json="$(gh api --paginate "repos/${REPO}/issues/${pr_num}/labels?per_page=100" --jq '[.[].name]' | jq -cs 'add // []')"
          matched="$(printf '%s' "$labels_json" | jq -r --argjson wanted "$LABELS_JSON" '[.[] | select(. as $l | any($wanted[]; . == $l))] | join(", ")')"
          count="$(printf '%s' "$labels_json" | jq -r --argjson wanted "$LABELS_JSON" '[.[] | select(. as $l | any($wanted[]; . == $l))] | length')"
          echo "PR #${pr_num} classification label(s): ${matched:-none} (count=${count})"

          status=0
          has_label=false
          if [[ "$count" -gt 1 ]]; then
            echo "::error::PR #${pr_num} carries both 0-physics:change and 0-numerics:change (${matched}). These labels are mutually exclusive (.claude/rules/physics-change-evidence.md); keep only one."
            status=1
          elif [[ "$count" -eq 1 ]]; then
            has_label=true
          else
            if [[ -n "$reference" ]]; then
              echo "::error::PR #${pr_num} changes stored reference outputs without 0-physics:change or 0-numerics:change. Add exactly one label with the matching PR-body section (.claude/rules/physics-change-evidence.md), then re-run all jobs in this workflow so determine_matrix selects physics-full."
              printf '  %s\n' $reference
              status=1
            fi
            if [[ -n "$physics" ]]; then
              echo "::warning::PR #${pr_num} touches physics source without 0-physics:change or 0-numerics:change. Fine only for a verified formulation-preserving refactor with bit-identical output (confirmed by the exact sample-output check); any formulation change or output shift must carry the appropriate label."
              printf '  %s\n' $physics
            fi
          fi

          if [[ "$has_label" == "true" ]]; then
            if [[ "$EVENT_NAME" == "merge_group" || "${IS_DRAFT:-false}" != "true" ]]; then
              if [[ "${TEST_TIER:-}" != "physics-full" ]]; then
                echo "::error::Classification label present (#${pr_num}: ${matched}), which requires test_tier=physics-full, but this workflow run used test_tier=${TEST_TIER:-unset} because the label was added after determine_matrix ran. Re-run all jobs in this workflow (not just this job), or push/reopen, so determine_matrix and build_wheels run physics-full."
                status=1
              fi
            fi
          fi

          if [[ "$status" -eq 0 ]]; then
            if [[ "$has_label" == "true" && ( -n "$reference" || -n "$physics" ) ]]; then
              echo "[OK] Reference and physics changes carry #${pr_num}: ${matched}"
            elif [[ "$has_label" == "true" ]]; then
              echo "[OK] Classification label verified (#${pr_num}: ${matched})"
            elif [[ -z "$reference" && -z "$physics" ]]; then
              echo "[OK] No reference outputs or physics source changed"
            fi
          fi
          exit $status

  # Folded Rust, Fortran, schema, and audit producers (gh#2094 Stage 2 / W1-1b,
  # gh#2095, gh#2096). Each producer invokes its reusable workflow via
  # self-repository workflow_call ($/...) with explicit base_sha/head_sha and
  # live PR label lookup so both pull_request and merge_group execute the same
  # checks without duplicating definitions. pr-gate.sh enforces all nine
  # producers fail-closed across pull_request and merge_group.
  #
  # Deferred / exit criteria:
  # - benchmark-regression.yml stays deferred because it relies on restricted
  #   Zenodo sandbox credentials unavailable to fork PRs.
  # - Standalone on.merge_group triggers are removed from folded workflows so
  #   merge_group never double-executes them. Standalone on.pull_request
  #   triggers remain isolated by github.workflow concurrency during Stage 2
  #   rollout; once PR build validation has been verified green on master
  #   across internal PRs, fork PRs, and merge_group (and no branch-protection
  #   ruleset or external check depends on the standalone PR checks), a small
  #   follow-up PR can remove the redundant on.pull_request triggers to end
  #   PR double-execution cleanly.
  rust_test:
    name: Rust test
    needs: [detect-changes]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.rust-test-changed == 'true'
    uses: $/.github/workflows/rust-test.yml
    with:
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}

  rust_clippy:
    name: Rust clippy
    needs: [detect-changes]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.rust-clippy-changed == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/rust-clippy.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}
      pr_number: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}
      merge_head_ref: ${{ github.event.merge_group.head_ref }}

  schema_version_audit:
    name: Schema version audit
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/schema-version-audit.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}
      pr_number: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}
      merge_head_ref: ${{ github.event.merge_group.head_ref }}

  data_interface_audit:
    name: Data-interface version audit
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: $/.github/workflows/data-interface-version-audit.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}

  encoding_audit:
    name: Encoding audit
    needs: [detect-changes]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.encoding-audit-changed == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/encoding-audit.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}
      pr_number: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}
      merge_head_ref: ${{ github.event.merge_group.head_ref }}

  workflow_security:
    name: Workflow security
    needs: [detect-changes]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.workflow-security-changed == 'true'
    uses: $/.github/workflows/workflow-security.yml
    with:
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}

  dependency_audit:
    name: Dependency and startup audit
    needs: [detect-changes]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.dependency-audit-changed == 'true'
    uses: $/.github/workflows/dependency-audit.yml
    with:
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}

  fortran_uninit:
    name: Fortran uninitialized lint
    needs: [detect-changes]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.fortran-uninit-changed == 'true'
    uses: $/.github/workflows/fortran-uninit.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}

  rust_capi_observer:
    name: Rust C-API field observer
    needs: [detect-changes]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.rust-capi-observer-changed == 'true'
    uses: $/.github/workflows/rust-capi-observer.yml
    with:
      head_sha: ${{ github.event.merge_group.head_sha || github.sha }}

  # Single consolidated check for branch protection (always runs for PRs/merge queue)
  # Every core test must pass on Linux before a merge (22 Nov 2026). The
  # Linux lanes' metrics record each test's node id, markers and outcome, and
  # the Linux cp312 api cell records the whole suite's inventory with no -m;
  # scripts/suews/check_core_guard.py checks that every lane ran exactly what
  # its tier selects (shards present, disjoint and complete), that every core
  # test passed (a skip passes only by exact node id in
  # scripts/suews/core_guard_allowlist.json), and names the exact sample-output
  # reproduction test. It runs on ready tiers only; draft tiers run a subset
  # by design. A run whose paths need no build (needs-build false and no
  # physics or numerics label, in practice documentation-only changes)
  # builds nothing and runs no tests: that is the single exemption, and this
  # job is skipped there. pr-gate requires it whenever the ready tier ran.
  # The pr_api_lane dispatch runs it too, so the pull-request layout can be
  # checked on a branch.
  core_guard:
    name: Core-test guard (Linux)
    needs: [determine_matrix, build_wheels]
    if: >-
      always() &&
      (needs.build_wheels.result == 'success' || needs.build_wheels.result == 'failure') &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
       (github.event_name == 'workflow_dispatch' && inputs.pr_api_lane)) &&
      (needs.determine_matrix.outputs.test_tier == 'standard' || needs.determine_matrix.outputs.test_tier == 'physics-full') &&
      contains(needs.determine_matrix.outputs.buildplat, '"manylinux"')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: scripts/suews
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      # Only the Linux lanes' artefacts: the guard needs their per-test
      # outcomes and the inventory, nothing else.
      - name: Download the Linux test metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-metrics-*-manylinux-x86_64*
          path: ci-metrics/

      # pytest supplies the -m expression evaluator; the version is the lanes' pin.
      - name: Check every core test passed on Linux
        shell: bash
        env:
          TEST_TIER: ${{ needs.determine_matrix.outputs.test_tier }}
          # The api lane's Python list, exactly as build_wheels passes it.
          API_PYTHON: ${{ github.event_name == 'merge_group' && needs.determine_matrix.outputs.python || needs.determine_matrix.outputs.api_python }}
          PHYSICS_PYTHON: ${{ fromJson(needs.determine_matrix.outputs.python)[0] }}
          # Mirrors build_wheels' api_bookend_core for the Linux call.
          BOOKEND_CORE: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_api_lane == true) }}
        run: |
          python -m pip install --quiet pytest==9.1.1
          args=(--tier "$TEST_TIER" --api-python "$API_PYTHON"
                --physics-python "$PHYSICS_PYTHON" --summary "$GITHUB_STEP_SUMMARY")
          [[ "$BOOKEND_CORE" == "true" ]] && args+=(--bookend-core)
          python scripts/suews/check_core_guard.py ci-metrics "${args[@]}"

  pr-gate:
    name: PR build validation
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - build_wheels
      - build_mcp
      - core_guard
      - check_test_markers
      - check_physics_label
      - detect-changes
      - determine_matrix
      - rust_test
      - rust_clippy
      - schema_version_audit
      - data_interface_audit
      - encoding_audit
      - workflow_security
      - dependency_audit
      - fortran_uninit
      - rust_capi_observer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download lowest-direct dependency result marker
        if: needs.build_wheels.result == 'success' && needs.detect-changes.outputs.dependency-audit-changed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lowest-direct-deps-result
          path: _lowest_direct_deps

      # Resolve lowest_direct_deps independently from build_wheels: when
      # dependency-audit paths changed and build_wheels succeeded, only an
      # explicit marker uploaded by lowest_direct_deps after pytest passes
      # counts as 'success'; a wheel-pass / floor-skip regression resolves
      # to 'skipped' and fails closed in pr-gate.sh (#2284).
      - name: Resolve independent lowest-direct dependency result
        id: lowest-direct-result
        shell: bash
        env:
          BUILD_WHEELS_RESULT: ${{ needs.build_wheels.result }}
          DEPENDENCY_AUDIT_CHANGED: ${{ needs.detect-changes.outputs.dependency-audit-changed }}
        run: |
          if [[ "$DEPENDENCY_AUDIT_CHANGED" != "true" ]]; then
            result="skipped"
          elif [[ "$BUILD_WHEELS_RESULT" != "success" ]]; then
            result="$BUILD_WHEELS_RESULT"
          elif [[ -f _lowest_direct_deps/lowest-direct-deps-result.json ]] && \
               python3 -c 'import json, sys; data = json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if data.get("result") == "success" else 1)' _lowest_direct_deps/lowest-direct-deps-result.json; then
            result="success"
          else
            result="skipped"
          fi
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      # build_wheels is one node per run whose result aggregates every
      # platform's wheel build and api lane (the lane is chained inside the
      # reusable workflow), so the same result feeds both gate inputs; the
      # run page shows which lane failed.
      - name: Check build results
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BUILD_WHEELS_RESULT: ${{ needs.build_wheels.result }}
          BUILD_MCP_RESULT: ${{ needs.build_mcp.result }}
          TEST_BRIDGE_RESULT: ${{ needs.build_wheels.result }}
          CORE_GUARD_RESULT: ${{ needs.core_guard.result }}
          TEST_TIER: ${{ needs.determine_matrix.outputs.test_tier }}
          CHECK_MARKERS_RESULT: ${{ needs.check_test_markers.result }}
          PHYSICS_LABEL_RESULT: ${{ needs.check_physics_label.result }}
          # Independently observed from the lowest_direct_deps marker artefact
          # when required, so a skipped floor job cannot hide behind a green
          # wheel build (#2284).
          LOWEST_DIRECT_DEPS_RESULT: ${{ steps.lowest-direct-result.outputs.result }}
          LOWEST_DIRECT_DEPS_REQUIRED: ${{ needs.build_wheels.result == 'success' && needs.detect-changes.outputs.dependency-audit-changed == 'true' }}
          RUST_TEST_RESULT: ${{ needs.rust_test.result }}
          RUST_TEST_CHANGED: ${{ needs.detect-changes.outputs.rust-test-changed }}
          RUST_CLIPPY_RESULT: ${{ needs.rust_clippy.result }}
          RUST_CLIPPY_CHANGED: ${{ needs.detect-changes.outputs.rust-clippy-changed }}
          SCHEMA_AUDIT_RESULT: ${{ needs.schema_version_audit.result }}
          DATA_INTERFACE_AUDIT_RESULT: ${{ needs.data_interface_audit.result }}
          ENCODING_AUDIT_RESULT: ${{ needs.encoding_audit.result }}
          ENCODING_AUDIT_CHANGED: ${{ needs.detect-changes.outputs.encoding-audit-changed }}
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow_security.result }}
          WORKFLOW_SECURITY_CHANGED: ${{ needs.detect-changes.outputs.workflow-security-changed }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency_audit.result }}
          DEPENDENCY_AUDIT_CHANGED: ${{ needs.detect-changes.outputs.dependency-audit-changed }}
          FORTRAN_UNINIT_RESULT: ${{ needs.fortran_uninit.result }}
          FORTRAN_UNINIT_CHANGED: ${{ needs.detect-changes.outputs.fortran-uninit-changed }}
          RUST_CAPI_OBSERVER_RESULT: ${{ needs.rust_capi_observer.result }}
          RUST_CAPI_OBSERVER_CHANGED: ${{ needs.detect-changes.outputs.rust-capi-observer-changed }}
          NEEDS_BUILD: ${{ needs.detect-changes.outputs.needs-build }}
          PHYSICS_CHANGE: ${{ needs.determine_matrix.outputs.physics_change || 'false' }}
        run: bash .github/scripts/pr-gate.sh

      # pr-gate.sh is read from the base branch, so a gate change only takes
      # effect after it merges. This step enforces the core-test guard from
      # the workflow under test as well, so it also holds on the run that
      # introduces it and on any branch whose base predates it. The rule
      # matches pr-gate.sh: required when build_wheels succeeded at a ready tier.
      - name: Require the core-test guard at ready tiers
        env:
          BUILD_WHEELS_RESULT: ${{ needs.build_wheels.result }}
          CORE_GUARD_RESULT: ${{ needs.core_guard.result }}
          TEST_TIER: ${{ needs.determine_matrix.outputs.test_tier }}
        run: |
          if [[ "$TEST_TIER" == "standard" || "$TEST_TIER" == "physics-full" ]] && \
             [[ "$BUILD_WHEELS_RESULT" == "success" ]] && [[ "$CORE_GUARD_RESULT" != "success" ]]; then
            echo "::error::Core-test guard required at tier ${TEST_TIER} but finished with '${CORE_GUARD_RESULT}'"
            exit 1
          fi
          if [[ "$CORE_GUARD_RESULT" == "failure" || "$CORE_GUARD_RESULT" == "cancelled" ]]; then
            echo "::error::Core-test guard finished with '${CORE_GUARD_RESULT}'"
            exit 1
          fi
          echo "Core-test guard: ${CORE_GUARD_RESULT} (tier ${TEST_TIER:-unset}, build_wheels ${BUILD_WHEELS_RESULT})"

  ci_observability:
    name: CI observability summary
    runs-on: ubuntu-latest
    needs: [pr-gate]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    permissions:
      actions: read
      contents: read
    env:
      TARGET_JOB: PR build validation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github/ci-metrics-needs.json
            scripts/suews/analyse_ci_run.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # This job starts seconds after PR build validation finishes, and the
      # Jobs REST API can still report that job as in progress then. Poll
      # (bounded: 12 x 5 s) until it reads as completed; if it never does,
      # analyse_ci_run.py reports a skip instead of failing the check.
      - name: Download workflow and Jobs REST data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ci-metrics-workflow
          for attempt in $(seq 1 12); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > ci-metrics-workflow/jobs.json
            status=$(jq -r --arg name "$TARGET_JOB" \
              '[.jobs[] | select(.name == $name)
                | if .status == "completed" and (.completed_at | not) then "settling" else .status end]
                | first // "absent"' \
              ci-metrics-workflow/jobs.json)
            if [ "$status" = completed ]; then
              break
            fi
            echo "Attempt ${attempt}: '${TARGET_JOB}' is '${status}' in the Jobs API; retrying in 5 s"
            sleep 5
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > ci-metrics-workflow/run.json

      - name: Analyse declared workflow critical path
        shell: bash
        run: >-
          python scripts/suews/analyse_ci_run.py
          --run-json ci-metrics-workflow/run.json
          --jobs-json ci-metrics-workflow/jobs.json
          --needs-json .github/ci-metrics-needs.json
          --target-job "$TARGET_JOB"
          --output ci-metrics-workflow/workflow-ci-metrics.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow CI metrics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ci-metrics-workflow-${{ github.run_id }}
          path: ci-metrics-workflow/*.json
          if-no-files-found: error
          retention-days: 14

  # Prints the cost-marker drift status of a scheduled run in its job
  # summary. Reporting a red scheduled run to a person is no longer done here:
  # scheduled-run-tracker.yml (on: workflow_run) judges the whole run after it
  # has finished, cancelled and timed-out jobs included, and opens, updates or
  # closes the tracking issue. This job keeps its needs so it still runs once
  # the scheduled jobs it summarises are done; it writes nothing and never
  # fails the night.
  report_scheduled_run:
    name: Report scheduled run outcome
    runs-on: ubuntu-latest
    needs: [create_nightly_tag, build_wheels, build_wheels_checked, build_mcp, check_test_markers, deploy_testpypi, cost_markers, rss_growth]
    if: always() && github.event_name == 'schedule'
    permissions: {}
    steps:
      - name: Summarise cost-marker drift
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const cost = (needs.cost_markers && needs.cost_markers.outputs) || {};
            const costNote = {
              drift: `${cost.flagged} test(s) carry a cost marker that disagrees with their measured CPU seconds; see the "Cost-marker drift" job summary`,
              clean: 'none; every medium and slow marker agrees with its measured CPU seconds',
              unavailable: 'not checked; the job could not read its metrics artefacts',
            }[cost.status] || 'not checked; the job did not run';
            try {
              await core.summary.addHeading('Cost-marker drift', 3)
                .addRaw(`Cost-marker drift (information, not a failure): ${costNote}.`, true).write();
            } catch (err) {
              core.warning(`Could not write the cost-marker summary: ${err.message}`);
            }

  deploy_testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs:
      - determine_matrix
      - build_wheels
      - build_mcp
      - create_nightly_tag
      - verify-release-tag
    # Publish only when every platform wheel built AND the cross-CPython
    # api tests passed on every matrix cell. build_wheels fails when any
    # platform's wheel build or chained api lane fails. Its api lane is
    # skipped (and the node still succeeds) only when build_mcp failed,
    # which the explicit build_mcp check below catches, or on the nightly
    # macOS Intel trim, where skipping is intended.
    if: |
      always() &&
      needs.build_wheels.result == 'success' &&
      needs.build_mcp.result == 'success' &&
      (needs.create_nightly_tag.result == 'success' || needs.create_nightly_tag.result == 'skipped') &&
      (needs.verify-release-tag.result == 'skipped' || needs.verify-release-tag.outputs.on-master == 'true') &&
      (
        github.event_name == 'schedule' ||
        (startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'dev')) ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'testpypi')
      )

    permissions:
      id-token: write

    steps:
      - name: Download all wheels for TestPyPI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: 'cp[0-9][0-9][0-9]-*'
          path: dist/
          merge-multiple: true

      - name: Exclude suews-mcp (shipped via the agent plugin from git, not PyPI)
        run: rm -f dist/suews_mcp-* dist/suews-mcp-*

      - name: Publish wheels to Test PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1.14 (v1.14.0 tag commit lacks a published ghcr image)
        with:
          packages-dir: dist/
          verbose: true
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/

  deploy_pypi:
    name: Publish all wheels to PyPI
    runs-on: ubuntu-latest
    needs:
      - determine_matrix
      - build_wheels
      - build_mcp
      - create_nightly_tag
      - verify-release-tag
    # Production tags only: all platform wheels must succeed AND the
    # cross-CPython api tests must pass (the only signal the cp312-abi3
    # wheel imports on cp312..cp315 after the build matrix collapse); both
    # are carried by build_wheels, whose per-platform chain runs the api
    # lane after the wheel.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags') &&
      !contains(github.ref, 'dev') &&
      needs.build_wheels.result == 'success' &&
      needs.build_mcp.result == 'success' &&
      (needs.create_nightly_tag.result == 'success' || needs.create_nightly_tag.result == 'skipped') &&
      (needs.verify-release-tag.result == 'skipped' || needs.verify-release-tag.outputs.on-master == 'true')

    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: 'cp[0-9][0-9][0-9]-*'
          path: dist/
          merge-multiple: true

      - name: Exclude suews-mcp (shipped via the agent plugin from git, not PyPI)
        run: rm -f dist/suews_mcp-* dist/suews-mcp-*

      - name: Publish all wheels to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1.14 (v1.14.0 tag commit lacks a published ghcr image)
        with:
          packages-dir: dist/
          verbose: true
          skip-existing: true

  create_github_release:
    name: Create GitHub Release (triggers Zenodo)
    runs-on: ubuntu-latest
    needs:
      - deploy_pypi
    if: always() && needs.deploy_pypi.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare release notes
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          RELEASE_FILE=".github/releases/${VERSION}.md"

          if [ -f "$RELEASE_FILE" ]; then
            echo "Using pre-prepared release notes: $RELEASE_FILE"
            cp "$RELEASE_FILE" release_notes.md
          else
            echo "No pre-prepared release notes found, extracting from CHANGELOG"
            YEAR=$(echo $VERSION | cut -d. -f1)
            MONTH=$(echo $VERSION | cut -d. -f2)
            DAY=$(echo $VERSION | cut -d. -f3)

            MONTH_NAME=$(date -d "$YEAR-$MONTH-$DAY" +"%b" 2>/dev/null || date -j -f "%Y-%m-%d" "$YEAR-$MONTH-$DAY" +"%b" 2>/dev/null || echo "")

            CHANGELOG_SECTION=""
            if [ -n "$MONTH_NAME" ]; then
              CHANGELOG_SECTION=$(awk "/^### $DAY $MONTH_NAME $YEAR/,/^### [0-9]/" CHANGELOG.md | sed '$d' || echo "")
              if [ -z "$CHANGELOG_SECTION" ]; then
                DAY_PADDED=$(printf "%02d" $DAY)
                CHANGELOG_SECTION=$(awk "/^### $DAY_PADDED $MONTH_NAME $YEAR/,/^### [0-9]/" CHANGELOG.md | sed '$d' || echo "")
              fi
            fi

            if [ -z "$CHANGELOG_SECTION" ]; then
              CHANGELOG_SECTION="See [CHANGELOG.md](https://github.com/UMEP-dev/SUEWS/blob/master/CHANGELOG.md) for details."
            fi

            cat << EOF > release_notes.md
          ## Installation

          \`\`\`bash
          pip install --upgrade supy
          \`\`\`

          ## Changes

          $CHANGELOG_SECTION

          ## Citation

          This release is automatically archived on Zenodo and assigned a DOI for academic citation. The DOI will appear here once Zenodo processing is complete (usually within a few minutes).

          ## Documentation

          - [User Guide](https://docs.suews.io)
          - [CHANGELOG](https://github.com/UMEP-dev/SUEWS/blob/master/CHANGELOG.md)
          - [GitHub Repository](https://github.com/UMEP-dev/SUEWS)
          EOF
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          TITLE=$(git tag -l --format='%(contents:subject)' "$VERSION" || echo "SUEWS Release")
          gh release create "$VERSION" \
            --title "SUEWS v$VERSION: $TITLE" \
            --notes-file release_notes.md \
            --verify-tag
