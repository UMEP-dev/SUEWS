# Example: YAML configuration with single forcing file
# This example shows how to specify a single forcing file

model:
  control:
    tstep: 3600
    forcing:
      file: "forcing_2020.txt"  # Single forcing file
  physics:
    netradiationmethod: 3
    emissionsmethod: 2

sites:
  - name: "London_KCL"
    properties:
      lat: {value: 51.5115}
      lng: {value: -0.1160}
      alt: {value: 31.0}
      # ... other site parameters (land cover, etc.)