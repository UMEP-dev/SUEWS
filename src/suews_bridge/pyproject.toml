[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "suews-bridge"
version = "0.1.0"
description = "Rust bridge between SuPy and the SUEWS Fortran physics"
requires-python = ">=3.12"

[tool.maturin]
features = ["python-extension", "physics"]
module-name = "suews_bridge"
