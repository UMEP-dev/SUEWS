name: Schema version audit

# Enforce that PRs changing the YAML-owned Pydantic models or the shipped
# sample_config also bump `CURRENT_SCHEMA_VERSION` in
# `src/supy/data_model/configuration/version.py`. Maintainers can label a PR
# with `0-ci:schema-audit-ok` to bypass the check when the diff is genuinely
# cosmetic. Forcing and output contracts have an independent audit.

on:
  # Run unconditionally so a required check succeeds for unrelated PRs and so
  # path-filter edge cases (especially renames) still reach the audit script.
  # Include labeled/unlabeled so adding or removing 0-ci:schema-audit-ok after
  # PR creation re-evaluates cleanly without needing a close+reopen (gh#2094).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:
    inputs:
      base_sha:
        description: 'Base commit SHA to compare against'
        required: false
        type: string
        default: ''
      head_sha:
        description: 'Commit SHA to check out (defaults to github.sha)'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'Pull request number for live bypass-label lookup'
        required: false
        type: string
        default: ''
      merge_head_ref:
        description: 'merge_group head_ref for single-PR bypass-label lookup'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

jobs:
  check-schema-bump:
    name: Require schema version bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide whether to skip (PR has bypass label)
        id: bypass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MERGE_HEAD_REF: ${{ inputs.merge_head_ref || github.event.merge_group.head_ref }}
          MERGE_BASE_SHA: ${{ inputs.base_sha || github.event.merge_group.base_sha }}
          BYPASS_LABEL: '0-ci:schema-audit-ok'
        run: |
          set -euo pipefail
          pr_num=""
          if [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            pr_num="$PR_NUMBER"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            parsed_pr="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
            ref_base_sha="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-[0-9]+-([0-9a-f]+)$#\1#p')"
            if [[ "$parsed_pr" =~ ^[0-9]+$ && -n "${MERGE_BASE_SHA:-}" && "$ref_base_sha" == "$MERGE_BASE_SHA" ]]; then
              pr_num="$parsed_pr"
            fi
          fi

          if [[ -z "$pr_num" ]]; then
            echo "No single-PR context for bypass label lookup; running schema bump check."
            echo "bypass=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matched="$(gh api --paginate "repos/${REPO}/issues/${pr_num}/labels?per_page=100" --jq '[.[].name]' \
            | jq -rs --arg wanted "$BYPASS_LABEL" '[(add // [])[] | select(. == $wanted)] | length')"
          if [[ "$matched" -gt 0 ]]; then
            echo "bypass=true" >> "$GITHUB_OUTPUT"
            echo "PR #${pr_num} carries label '${BYPASS_LABEL}'; skipping schema bump check."
          else
            echo "bypass=false" >> "$GITHUB_OUTPUT"
            echo "PR #${pr_num} does not carry label '${BYPASS_LABEL}'; running schema bump check."
          fi

      - name: Checkout full history
        if: steps.bypass.outputs.bypass != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: steps.bypass.outputs.bypass != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Resolve comparison base
        id: base
        if: steps.bypass.outputs.bypass != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA:-}" ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA"
            fi
            echo "ref=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${BASE_REF:-}" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            echo "ref=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cannot determine comparison base SHA or ref."
            exit 1
          fi

      - name: Run schema-bump audit
        if: steps.bypass.outputs.bypass != 'true'
        shell: bash
        env:
          COMPARE_BASE: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          python scripts/lint/check_schema_version_bump.py \
            --base "$COMPARE_BASE"
