name: Tutorial smoke check

# Unprivileged pull-request smoke check for Sphinx-Gallery tutorial scripts
# (gh#2104 F-18).
#
# pages-deploy.yml deliberately skips documentation builds on pull_request
# events (gh#1431) because it holds pages:write, id-token:write, and
# pull-requests:write permissions. This standalone workflow stays strictly
# read-only (contents: read) so untrusted/PR code executes safely without any
# deployment tokens or write permissions while catching broken tutorial API
# calls before merge.

on:
  pull_request:
    paths:
      - 'docs/source/tutorials/**'
      - 'docs/source/conf.py'
      - 'src/supy/**'
      - 'src/suews/src/**'
      - 'src/suews/ext_lib/**'
      - 'src/suews_bridge/**'
      - 'scripts/suews/run_tutorial_smoke.py'
      - '.github/workflows/tutorial-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tutorial_smoke:
    name: Run Sphinx-Gallery tutorial smoke subset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - name: Install Fortran compiler
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
          rustc --version
          cargo --version

      - name: Build and install supy in isolated environment
        run: |
          set -eu
          uv venv --python 3.12 .tutorial-venv
          uv pip install --python .tutorial-venv/bin/python .
          .tutorial-venv/bin/python scripts/security/remove_legacy_namespace_pth.py

      - name: Execute curated and changed tutorial smoke checks
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          export PATH="$PWD/.tutorial-venv/bin:$PATH"
          ARGS=(
            --workers 2
            --require-prefix "$PWD/.tutorial-venv"
          )
          if [[ -n "${PR_BASE_SHA}" ]]; then
            ARGS+=(--changed-from-git-base "${PR_BASE_SHA}")
          fi
          .tutorial-venv/bin/python scripts/suews/run_tutorial_smoke.py "${ARGS[@]}"
