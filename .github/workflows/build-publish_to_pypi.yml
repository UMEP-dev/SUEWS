name: Build and Publish Python wheels to PyPI and TestPyPI

# Builds and deploys SUEWS/SuPy Python wheels.
#
# Triggers:
#   schedule  -- Nightly 2 AM UTC: tag YYYY.M.D.dev -> build -> TestPyPI
#   tags      -- Any tag push: full matrix build -> PyPI (non-dev) or TestPyPI (dev)
#   PR        -- Validation only with adaptive matrix (draft=minimal, ready=reduced)
#   merge_group -- Merge queue validation (reduced matrix)
#   dispatch  -- Manual with configurable matrix, deploy target, test tier
#
# Build strategy:
#   One cp312-abi3 wheel per (OS, arch). The Rust bridge (PyO3 abi3-py312)
#   makes the binary ABI-stable, so a single wheel installs on cp312..cp3xx.
#   Covers current Windows QGIS 3 LTR, QGIS 4, and general users — the runtime
#   pin is numpy>=1.22 (Rust bridge has no NumPy C-ABI dependency; pure-Python
#   code uses only NumPy 1.22-compatible APIs).
#   UMEP/QGIS tests are integration-contract tests, not physics tests; normal
#   PR tiers exclude qgis and scheduled/release/manual `all` runs cover the
#   Windows + Python 3.12 runtime shared by current QGIS 3 LTR and QGIS 4.
#
# Nightly version: Tag YYYY.M.D.dev created BEFORE build for version consistency.
# See get_ver_git.py for version string logic, .github/path-filters.yml for categories.

on:
  push:
    tags:
      # CalVer release tags only: 2026.5, 2026.5.21.dev, etc. Excludes
      # SUEWS-agent tags (e.g. `agent/v0.3`) so those do not trigger a supy
      # wheel build + PyPI publish — they version the GitHub-distributed
      # agent (Claude Code / Codex plugin) only. Mirrors
      # `.github/workflows/docs-sync.yml`'s pattern.
      - '[0-9]*'

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No path filters -- branch protection requires this job; detect-changes handles filtering

  merge_group:
    types: [checks_requested]

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      matrix_config:
        description: 'Build matrix (custom = use toggles below)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - pr
          - minimal
          - custom

      # Platform toggles (custom only)
      plat_linux:
        description: '[custom] Linux (manylinux x86_64)'
        type: boolean
        default: true
      plat_macos_intel:
        description: '[custom] macOS Intel (x86_64)'
        type: boolean
        default: false
      plat_macos_arm:
        description: '[custom] macOS ARM (arm64)'
        type: boolean
        default: true
      plat_windows:
        description: '[custom] Windows (AMD64)'
        type: boolean
        default: true

      # Python toggles drive the cross-CPython api-test matrix (gh#1300).
      # The build is always cp312-abi3 (one wheel covers all supported CPythons),
      # so these toggles only affect which interpreters install the wheel and
      # run `-m "api and <tier>"` in each platform's api cross-CPython lane.
      py312:
        description: '[custom] Test on Python 3.12 (build is always cp312-abi3)'
        type: boolean
        default: true
      py313:
        description: '[custom] Test on Python 3.13'
        type: boolean
        default: false
      py314:
        description: '[custom] Test on Python 3.14'
        type: boolean
        default: true

      deploy_target:
        description: 'Deployment target (PyPI requires tagged release)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - testpypi
      test_tier:
        description: 'Test suite level'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - standard
          - core
          - cfg
          - smoke
      build_profile:
        description: 'Fortran build profile for this dispatch (release = optimised, no checks, the default; checked = runtime checks, what the nightly physics tier also builds)'
        required: false
        default: 'release'
        type: choice
        options:
          - checked
          - release
      tolerance_spread:
        description: 'Also record the zero-tolerance spread of the full-year sample comparison on every built platform for the two CPython bookends (what the nightly does; uploads tolerance-spread-* artefacts)'
        type: boolean
        default: false
      api_serial_platforms:
        description: 'Comma-separated platforms (manylinux, macosx, win) whose api lane runs in one process instead of on its xdist workers; the SUEWS_API_SERIAL_PLATFORMS repository variable does the same on every event where this input is empty'
        required: false
        type: string
        default: ''
      cost_markers:
        description: 'Also check the medium/slow cost markers against the per-test CPU seconds of the Linux cp312 api and physics lanes (what the nightly does; needs test_tier all and Linux + py312 in the matrix)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-tag:
    name: Verify tag is on master
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      on-master: ${{ steps.check.outputs.on-master }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if git merge-base --is-ancestor $GITHUB_SHA refs/remotes/origin/master; then
            echo "on-master=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Tag ${TAG_NAME} not on master — skipping release"
            echo "on-master=false" >> $GITHUB_OUTPUT
          fi

  create_nightly_tag:
    name: Create nightly tag for scheduled builds
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create and push nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          DEV_TAG="${YEAR}.${MONTH}.${DAY}.dev"
          echo "Creating dev tag: ${DEV_TAG}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          if git ls-remote --tags origin | grep -q "refs/tags/${DEV_TAG}"; then
            echo "Tag ${DEV_TAG} already exists on remote, skipping"
          else
            git tag -a "${DEV_TAG}" -m "Nightly build ${YEAR}-${MONTH}-${DAY}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${DEV_TAG}"
            echo "Successfully created and pushed tag ${DEV_TAG}"
          fi

  detect-changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    outputs:
      needs-build: ${{ steps.decide.outputs.needs-build }}
      fortran-changed: ${{ steps.filter.outputs.fortran }}
      rust-changed: ${{ steps.filter.outputs.rust }}
      python-changed: ${{ steps.decide.outputs.python-changed }}
      util-changed: ${{ steps.filter.outputs.util }}
      build-changed: ${{ steps.decide.outputs.build-changed }}
      ci-changed: ${{ steps.filter.outputs.ci }}
      tests-changed: ${{ steps.filter.outputs.tests }}
      docs-changed: ${{ steps.filter.outputs.docs }}
      site-changed: ${{ steps.filter.outputs.site }}
      fortran-files: ${{ steps.filter.outputs.fortran_files }}
      rust-files: ${{ steps.filter.outputs.rust_files }}
      python-files: ${{ steps.filter.outputs.python_files }}
      util-files: ${{ steps.filter.outputs.util_files }}
      build-files: ${{ steps.filter.outputs.build_files }}
      ci-files: ${{ steps.filter.outputs.ci_files }}
      tests-files: ${{ steps.filter.outputs.tests_files }}
      docs-files: ${{ steps.filter.outputs.docs_files }}
      site-files: ${{ steps.filter.outputs.site_files }}
      pyproject-files: ${{ steps.filter.outputs.pyproject_files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: .github/path-filters.yml
          list-files: 'json'

      # Content-aware: only [build-system] / [tool.cibuildwheel] need multiplatform builds
      - name: Classify pyproject.toml changes
        id: classify-pyproject
        if: steps.filter.outputs.pyproject == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Fetch just the base commit for pyproject.toml comparison
          if [ -n "$BASE_SHA" ]; then
            git fetch --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          fi
          python3 .github/scripts/classify_pyproject.py

      - name: Compute build decision
        id: decide
        env:
          FILTER_BUILD: ${{ steps.filter.outputs.build }}
          BUILD_RELEVANT: ${{ steps.classify-pyproject.outputs.build_relevant || 'false' }}
          FILTER_PYTHON: ${{ steps.filter.outputs.python }}
          PACKAGE_RELEVANT: ${{ steps.classify-pyproject.outputs.package_relevant || 'false' }}
          FILTER_FORTRAN: ${{ steps.filter.outputs.fortran }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
          FILTER_UTIL: ${{ steps.filter.outputs.util }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
          FILTER_TESTS: ${{ steps.filter.outputs.tests }}
        run: |
          BUILD_CHANGED=false
          if [[ "${FILTER_BUILD}" == "true" ]] || \
             [[ "${BUILD_RELEVANT}" == "true" ]]; then
            BUILD_CHANGED=true
          fi
          echo "build-changed=$BUILD_CHANGED" >> $GITHUB_OUTPUT

          PYTHON_CHANGED=false
          if [[ "${FILTER_PYTHON}" == "true" ]] || \
             [[ "${PACKAGE_RELEVANT}" == "true" ]]; then
            PYTHON_CHANGED=true
          fi
          echo "python-changed=$PYTHON_CHANGED" >> $GITHUB_OUTPUT

          FORTRAN="${FILTER_FORTRAN}"
          RUST="${FILTER_RUST}"
          UTIL="${FILTER_UTIL}"
          CI="${FILTER_CI}"
          TESTS="${FILTER_TESTS}"

          NEEDS_BUILD=false
          if [[ "$FORTRAN" == "true" ]] || \
             [[ "$RUST" == "true" ]] || \
             [[ "$PYTHON_CHANGED" == "true" ]] || \
             [[ "$UTIL" == "true" ]] || \
             [[ "$BUILD_CHANGED" == "true" ]] || \
             [[ "$CI" == "true" ]] || \
             [[ "$TESTS" == "true" ]]; then
            NEEDS_BUILD=true
          fi
          echo "needs-build=$NEEDS_BUILD" >> $GITHUB_OUTPUT

  determine_matrix:
    name: Determine build matrix
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: always() && (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped')
    outputs:
      buildplat: ${{ steps.set-matrix.outputs.buildplat }}
      api_buildplat: ${{ steps.set-matrix.outputs.api_buildplat }}
      python: ${{ steps.set-matrix.outputs.python }}
      api_python: ${{ steps.set-matrix.outputs.api_python }}
      bookend_python: ${{ steps.set-matrix.outputs.bookend_python }}
      test_tier: ${{ steps.set-matrix.outputs.test_tier }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Data-only checkout of the BUILT ref's pyproject.toml (github.sha = the
      # PR merge commit / pushed commit / dispatched branch tip). The matrix
      # logic above stays base-trusted; only the requires-python value crosses
      # the trust boundary, so it cannot execute PR-authored code. This is what
      # lets the build floor track a PR's requires-python bump (gh#1553).
      - name: Fetch built-ref pyproject (data only; requires-python floor)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: _pr_meta

      # gh#1576: detect the 0-physics:change label so the matrix can run the
      # full -m physics tier (incl. slow) before merge rather than only in the
      # nightly. On a PR the labels are in the event payload; in the merge queue
      # the queue ref (gh-readonly-queue/<base>/pr-<n>-<sha>) carries the PR
      # number, which we validate before querying the API.
      - name: Detect physics-change label
        id: physics-label
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS_JSON: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          LABEL: '0-physics:change'
        run: |
          set -euo pipefail
          found=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Labels arrive as a JSON array; match exactly via jq (label names
            # may contain spaces or colons, so avoid newline/word splitting).
            if printf '%s' "$PR_LABELS_JSON" | jq -e --arg l "$LABEL" 'any(.[]; . == $l)' >/dev/null; then
              found=true
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            pr_num="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
            if [[ "$pr_num" =~ ^[0-9]+$ ]]; then
              if gh api "repos/${REPO}/issues/${pr_num}/labels" --jq '[.[].name]' \
                   | jq -e --arg l "$LABEL" 'any(.[]; . == $l)' >/dev/null; then
                found=true
              fi
            else
              # Could not identify the queued PR (e.g. a batched group). Fail
              # safe: run the full physics tier rather than risk missing a shift.
              echo "::notice::merge_group PR number not parsed from queue ref; running full physics tier as a safe default"
              found=true
            fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "physics-change label present: $found"

      - name: Set matrix based on trigger type
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PHYSICS_CHANGE: ${{ steps.physics-label.outputs.found || 'false' }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          FORTRAN_CHANGED: ${{ needs.detect-changes.outputs.fortran-changed || 'false' }}
          RUST_CHANGED: ${{ needs.detect-changes.outputs.rust-changed || 'false' }}
          PYTHON_CHANGED: ${{ needs.detect-changes.outputs.python-changed || 'false' }}
          UTIL_CHANGED: ${{ needs.detect-changes.outputs.util-changed || 'false' }}
          BUILD_CHANGED: ${{ needs.detect-changes.outputs.build-changed || 'false' }}
          INPUT_MATRIX_CONFIG: ${{ inputs.matrix_config }}
          INPUT_PLAT_LINUX: ${{ inputs.plat_linux }}
          INPUT_PLAT_MACOS_INTEL: ${{ inputs.plat_macos_intel }}
          INPUT_PLAT_MACOS_ARM: ${{ inputs.plat_macos_arm }}
          INPUT_PLAT_WINDOWS: ${{ inputs.plat_windows }}
          INPUT_PY312: ${{ inputs.py312 }}
          INPUT_PY313: ${{ inputs.py313 }}
          INPUT_PY314: ${{ inputs.py314 }}
          INPUT_TEST_TIER: ${{ inputs.test_tier }}
          GITHUB_REF: ${{ github.ref }}
          PR_PYPROJECT: _pr_meta/pyproject.toml
        run: bash .github/scripts/determine-matrix.sh

  post-ci-summary:
    name: Post CI summary comment
    runs-on: ubuntu-latest
    needs: [detect-changes, determine_matrix]
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-changes.result == 'success' &&
      needs.determine_matrix.result == 'success'
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post or update CI summary comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FORTRAN_CHANGED: ${{ needs.detect-changes.outputs.fortran-changed }}
          RUST_CHANGED: ${{ needs.detect-changes.outputs.rust-changed }}
          PYTHON_CHANGED: ${{ needs.detect-changes.outputs.python-changed }}
          UTIL_CHANGED: ${{ needs.detect-changes.outputs.util-changed }}
          BUILD_CHANGED: ${{ needs.detect-changes.outputs.build-changed }}
          CI_CHANGED: ${{ needs.detect-changes.outputs.ci-changed }}
          TESTS_CHANGED: ${{ needs.detect-changes.outputs.tests-changed }}
          DOCS_CHANGED: ${{ needs.detect-changes.outputs.docs-changed }}
          SITE_CHANGED: ${{ needs.detect-changes.outputs.site-changed }}
          FORTRAN_FILES: ${{ needs.detect-changes.outputs.fortran-files || '[]' }}
          RUST_FILES: ${{ needs.detect-changes.outputs.rust-files || '[]' }}
          PYTHON_FILES: ${{ needs.detect-changes.outputs.python-files || '[]' }}
          UTIL_FILES: ${{ needs.detect-changes.outputs.util-files || '[]' }}
          BUILD_FILES: ${{ needs.detect-changes.outputs.build-files || '[]' }}
          CI_FILES: ${{ needs.detect-changes.outputs.ci-files || '[]' }}
          TESTS_FILES: ${{ needs.detect-changes.outputs.tests-files || '[]' }}
          DOCS_FILES: ${{ needs.detect-changes.outputs.docs-files || '[]' }}
          SITE_FILES: ${{ needs.detect-changes.outputs.site-files || '[]' }}
          PYPROJECT_FILES: ${{ needs.detect-changes.outputs.pyproject-files || '[]' }}
          NEEDS_BUILD: ${{ needs.detect-changes.outputs.needs-build }}
          TEST_TIER: ${{ needs.determine_matrix.outputs.test_tier }}
          BUILDPLAT_JSON: ${{ needs.determine_matrix.outputs.buildplat }}
          PYTHON_JSON: ${{ needs.determine_matrix.outputs.python }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const script = require('./.github/scripts/post-ci-summary.js');
            await script({ github, context });

  # One reusable-workflow call per platform, so each platform's api
  # cross-CPython lane (chained inside build-wheels-reusable.yml) starts as
  # soon as that platform's wheel exists rather than when the slowest build
  # has finished. The job id stays `build_wheels`: its result aggregates every
  # platform's wheel build and api lane, and is what pr-gate, the publish jobs
  # and the nightly report read. build_mcp is a dependency because the api
  # lane installs the suews-mcp-dist artefact and a job inside a reusable
  # workflow cannot wait on a caller job itself; the wheel build still runs
  # when build_mcp fails (run_api_tests is then false, as before).
  build_wheels:
    name: Build and test (${{ matrix.buildplat[1] }} ${{ matrix.buildplat[2] }})
    needs: [determine_matrix, create_nightly_tag, detect-changes, verify-release-tag, build_mcp]
    if: |
      always() &&
      needs.determine_matrix.result == 'success' &&
      (needs.create_nightly_tag.result == 'success' || needs.create_nightly_tag.result == 'skipped') &&
      (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.needs-build == 'true') &&
      (needs.verify-release-tag.result == 'skipped' || needs.verify-release-tag.outputs.on-master == 'true')
    strategy:
      fail-fast: false
      matrix:
        buildplat: ${{ fromJson(needs.determine_matrix.outputs.buildplat) }}
    uses: $/.github/workflows/build-wheels-reusable.yml
    with:
      buildplat_json: ${{ format('[["{0}", "{1}", "{2}"]]', matrix.buildplat[0], matrix.buildplat[1], matrix.buildplat[2]) }}
      python_json: ${{ needs.determine_matrix.outputs.python }}
      test_tier: ${{ needs.determine_matrix.outputs.test_tier }}
      is_testpypi_build: ${{ (github.event_name == 'schedule' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'dev'))) && 'true' || 'false' }}
      build_profile: ${{ inputs.build_profile || 'release' }}
      # The api lane runs on this platform when it is in api_buildplat (the
      # nightly drops macos-15-intel there; every other event sets it equal to
      # buildplat) and the MCP distribution it installs was built. The quoted
      # runner label is the containment key because the script writes the
      # triples as `["<runner>", "<platform>", "<arch>"]`, and the closing
      # quote keeps "macos-15" from matching "macos-15-intel". Fall back to
      # the full buildplat when api_buildplat is empty: determine_matrix runs
      # determine-matrix.sh from the BASE branch (trusted-script design), so a
      # PR that introduces or extends the api_buildplat output would otherwise
      # skip every api lane until the script change lands on master.
      run_api_tests: ${{ needs.build_mcp.result == 'success' && contains(needs.determine_matrix.outputs.api_buildplat || needs.determine_matrix.outputs.buildplat, format('"{0}"', matrix.buildplat[0])) }}
      # A ready PR already validates both supported Python bookends. The merge
      # queue revalidates the combined tree on the abi3 floor only, across all
      # three supported OS families, instead of repeating the full suite twice.
      # Use the build-Python output here as a compatibility bridge while the
      # trusted determine-matrix script is still read from the base branch.
      api_python_json: >-
        ${{ github.event_name == 'merge_group' && needs.determine_matrix.outputs.python || needs.determine_matrix.outputs.api_python }}
      # Escape hatch (#1786 measured the worker counts): a dispatch input for
      # one run, or the SUEWS_API_SERIAL_PLATFORMS repository variable for
      # every event, serialises the named platforms without a workflow edit.
      # The reusable workflow forwards this to the api lane it chains.
      serial_platforms: ${{ inputs.api_serial_platforms || vars.SUEWS_API_SERIAL_PLATFORMS || '' }}

  # Nightly only: build the checked profile (-O0 -fcheck=all) on every platform
  # and run the full physics tier on it, so out-of-bounds and uninitialised
  # reads keep surfacing as Fortran runtime errors now that the published
  # wheels are release builds. Its artefacts carry the "checked-" prefix, so
  # the TestPyPI and API-test jobs, which select by the unprefixed names,
  # never see them.
  build_wheels_checked:
    name: Build checked wheels (nightly physics tier)
    needs: [determine_matrix, create_nightly_tag]
    if: |
      always() &&
      github.event_name == 'schedule' &&
      needs.determine_matrix.result == 'success' &&
      needs.create_nightly_tag.result == 'success'
    uses: $/.github/workflows/build-wheels-reusable.yml
    with:
      buildplat_json: ${{ needs.determine_matrix.outputs.buildplat }}
      python_json: ${{ needs.determine_matrix.outputs.python }}
      test_tier: all
      is_testpypi_build: 'false'
      build_profile: checked
      artifact_prefix: checked-

  # build_wheels waits for this job (its api lane installs the artefact), so
  # it sits in front of every wheel build: the checkout is blob-less, which
  # is all get_ver_git.py needs, and is what the wheel build itself does.
  build_mcp:
    name: Build MCP package
    runs-on: ubuntu-latest
    needs: [create_nightly_tag, detect-changes, verify-release-tag]
    if: |
      always() &&
      (needs.create_nightly_tag.result == 'success' || needs.create_nightly_tag.result == 'skipped') &&
      (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.needs-build == 'true') &&
      (needs.verify-release-tag.result == 'skipped' || needs.verify-release-tag.outputs.on-master == 'true')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Generate version files from git
        run: |
          python3 get_ver_git.py
          python3 -c "from pathlib import Path; ns = {}; exec(Path('mcp/src/suews_mcp/_version_scm.py').read_text(), ns); print('Generated MCP version:', ns['__version__'])"

      - name: Build MCP distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build mcp

      - name: Upload MCP distribution
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: suews-mcp-dist
          path: mcp/dist/*

  # Nightly and on demand: record the zero-tolerance spread of the full-year
  # sample comparison (scripts/suews/tolerance_spread.py) on every built
  # platform for the two CPython bookends, one JSON artefact per cell. The
  # tolerances in test/core/test_sample_output.py are to be derived from a week
  # of these artefacts, so this job records and never gates: the script exits 0
  # however large the spread, continue-on-error on the measuring job (inside
  # the reusable workflow, where GitHub accepts it) keeps a runner or install
  # failure here from turning the nightly red, and the job feeds neither
  # report_scheduled_run nor pr-gate. It installs the release wheel the run
  # built (or the profile a dispatch chose), so it measures what ships.
  # build_wheels covers each platform's wheel build and api lane, so this job
  # starts once the api lanes have finished too; it records, so the wait is
  # harmless.
  #
  # The (platform x CPython) matrix lives in tolerance-spread-reusable.yml and
  # this job carries a static name, so the checks list shows one "Tolerance
  # spread" group with a "cpXYZ-<platform> <arch>" child per cell instead of
  # one top-level entry per cell (.claude/rules/ci/conventions.md, "Matrix
  # jobs render as one group"). On PR and merge-queue runs the false `if`
  # renders as one skipped "Tolerance spread" entry.
  tolerance_spread:
    name: Tolerance spread
    needs: [determine_matrix, build_wheels]
    if: |
      always() &&
      needs.build_wheels.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.tolerance_spread == true)
      )
    uses: $/.github/workflows/tolerance-spread-reusable.yml
    with:
      buildplat_json: ${{ needs.determine_matrix.outputs.buildplat }}
      python_json: ${{ needs.determine_matrix.outputs.bookend_python }}
      build_profile: ${{ inputs.build_profile || 'release' }}

  # Nightly and on demand: check the `medium` and `slow` cost markers against
  # the CPU seconds the metrics plugin records per test on the Linux reference
  # runner (scripts/lint/check_cost_markers.py; thresholds and reasoning in
  # .claude/rules/tests/patterns.md). Wall time on a hosted runner sits on a 2x
  # noise floor, so the markers are defined by process CPU seconds and this
  # job is where drift shows. It reports and never gates: the lint exits 1 on
  # drift so a local run is useful, continue-on-error keeps that (and any
  # download failure) from turning the nightly red, and the job feeds neither
  # report_scheduled_run nor pr-gate. It needs the two Linux cp312 metrics
  # artefacts, which only a full-tier run with Linux and py312 in its matrix
  # produces.
  cost_markers:
    name: Cost-marker drift (Linux cp312 CPU seconds)
    # build_wheels chains each platform's API lane behind its wheel, so its
    # result covers the api metrics artefact this job downloads as well.
    needs: [build_wheels]
    if: |
      always() &&
      needs.build_wheels.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.cost_markers == true)
      )
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: scripts/lint/check_cost_markers.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Download the Linux cp312 api metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-metrics-api-cp312-manylinux-x86_64
          path: ci-metrics/api

      - name: Download the Linux cp312 physics metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-metrics-physics-cp312-manylinux-x86_64
          path: ci-metrics/physics

      - name: Check cost markers against measured CPU seconds
        shell: bash
        run: >-
          python scripts/lint/check_cost_markers.py ci-metrics
          --histogram
          --markdown "$GITHUB_STEP_SUMMARY"

  # Standalone static lints over the test tree. Both use AST-based scripts
  # that never import supy, so CI can run them without building — that is
  # what keeps the check cheap for test-only PRs.
  #
  #  1. Every test file must declare `physics` or `api` (gh#1300). The
  #     runtime counterpart is a pytest_collection_finish hook in
  #     test/conftest.py, which catches the same thing during normal
  #     full-tree pytest runs.
  #  2. No test may inspect an imported module through `<module>.__file__`;
  #     use `importlib.resources` for packaged data instead. See
  #     `.claude/rules/tests/patterns.md` ("Locating packaged data").
  #
  # The job id and display name are unchanged so nothing that references
  # them (needs:, .github/scripts/pr-gate.sh, branch protection) breaks.
  check_test_markers:
    name: Check pytest marker axis
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'merge_group' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Lint physics/api marker coverage
        shell: bash
        run: python scripts/lint/check_test_markers.py

      # `always()` so a marker failure does not mask a packaged-data
      # failure: a contributor should see both in one run, not one per push.
      - name: Lint packaged-data path access
        if: always()
        shell: bash
        run: python scripts/lint/check_packaged_data_paths.py

  # Single consolidated check for branch protection (always runs for PRs/merge queue)
  pr-gate:
    name: PR build validation
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [build_wheels, build_mcp, check_test_markers, detect-changes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # build_wheels is one node per run whose result aggregates every
      # platform's wheel build and api lane (the lane is chained inside the
      # reusable workflow), so the same result feeds both gate inputs; the
      # run page shows which lane failed. The script runs from the base
      # branch and its inputs are unchanged.
      - name: Check build results
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BUILD_WHEELS_RESULT: ${{ needs.build_wheels.result }}
          BUILD_MCP_RESULT: ${{ needs.build_mcp.result }}
          TEST_BRIDGE_RESULT: ${{ needs.build_wheels.result }}
          CHECK_MARKERS_RESULT: ${{ needs.check_test_markers.result }}
          NEEDS_BUILD: ${{ needs.detect-changes.outputs.needs-build }}
        run: bash .github/scripts/pr-gate.sh

  ci_observability:
    name: CI observability summary
    runs-on: ubuntu-latest
    needs: [pr-gate]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github/ci-metrics-needs.json
            scripts/suews/analyse_ci_run.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download workflow and Jobs REST data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ci-metrics-workflow
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > ci-metrics-workflow/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > ci-metrics-workflow/jobs.json

      - name: Analyse declared workflow critical path
        shell: bash
        run: >-
          python scripts/suews/analyse_ci_run.py
          --run-json ci-metrics-workflow/run.json
          --jobs-json ci-metrics-workflow/jobs.json
          --needs-json .github/ci-metrics-needs.json
          --target-job "PR build validation"
          --output ci-metrics-workflow/workflow-ci-metrics.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow CI metrics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ci-metrics-workflow-${{ github.run_id }}
          path: ci-metrics-workflow/*.json
          if-no-files-found: error
          retention-days: 14

  # A scheduled run that fails or is cancelled must reach a person. The
  # nightly full-tier run was cancelled every night from 20 August to
  # 7 September 2026 (Windows API jobs at the 45-minute cap) and nothing
  # reported it: ci_observability runs only on pull_request and merge_group,
  # and a cancelled run never reaches deploy_testpypi. This job runs on every
  # scheduled run, opens or updates one tracking issue while the nightly is
  # red, and closes it on the next green run.
  #
  # Its needs are exactly the jobs that must run and pass on a schedule; the
  # recording jobs (tolerance_spread, cost_markers) are deliberately absent, so
  # a wide spread or a drifted cost marker never opens an issue. Anything other
  # than success counts as bad, skipped included: on a schedule every one of
  # these jobs is expected to run, so a skip means an upstream job
  # (determine_matrix, create_nightly_tag) failed and the run built nothing.
  # Counting only failure and cancelled would report that night as green and
  # close the tracking issue.
  report_scheduled_run:
    name: Report scheduled run outcome
    runs-on: ubuntu-latest
    needs: [create_nightly_tag, build_wheels, build_wheels_checked, build_mcp, check_test_markers, deploy_testpypi]
    if: always() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const bad = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success')
              .map(([k, v]) => `${k}: ${v.result || 'no result'}`);
            const title = 'Nightly scheduled run is failing';
            const marker = '<!-- nightly-run-tracker -->';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: '2-infra:ci', per_page: 100,
            });
            const tracker = open.find(i => i.title === title && (i.body || '').includes(marker));
            const today = new Date().toISOString().slice(0, 10);
            if (bad.length === 0) {
              if (tracker) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: tracker.number,
                  body: `Green again on ${today}: ${process.env.RUN_URL}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: tracker.number, state: 'closed',
                });
              }
              return;
            }
            const line = `${today}: ${process.env.RUN_URL} (${bad.join(', ')})`;
            if (tracker) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: tracker.number,
                body: `Still failing. ${line}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['2-infra:ci'],
              body: [
                marker,
                'Opened automatically by the `report_scheduled_run` job in `build-publish_to_pypi.yml`.',
                'The scheduled full-tier run did not complete successfully. Each further failing night adds a comment; the first green night closes this issue.',
                '',
                `First failure: ${line}`,
              ].join('\n'),
            });

  deploy_testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs:
      - determine_matrix
      - build_wheels
      - build_mcp
      - create_nightly_tag
      - verify-release-tag
    # Publish only when every platform wheel built AND the cross-CPython
    # api tests passed on every matrix cell. build_wheels fails when any
    # platform's wheel build or chained api lane fails. Its api lane is
    # skipped (and the node still succeeds) only when build_mcp failed,
    # which the explicit build_mcp check below catches, or on the nightly
    # macOS Intel trim, where skipping is intended.
    if: |
      always() &&
      needs.build_wheels.result == 'success' &&
      needs.build_mcp.result == 'success' &&
      (needs.create_nightly_tag.result == 'success' || needs.create_nightly_tag.result == 'skipped') &&
      (needs.verify-release-tag.result == 'skipped' || needs.verify-release-tag.outputs.on-master == 'true') &&
      (
        github.event_name == 'schedule' ||
        (startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'dev')) ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'testpypi')
      )

    permissions:
      id-token: write

    steps:
      - name: Download all wheels for TestPyPI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: 'cp[0-9][0-9][0-9]-*'
          path: dist/
          merge-multiple: true

      - name: Exclude suews-mcp (shipped via the agent plugin from git, not PyPI)
        run: rm -f dist/suews_mcp-* dist/suews-mcp-*

      - name: Publish wheels to Test PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1.14 (v1.14.0 tag commit lacks a published ghcr image)
        with:
          packages-dir: dist/
          verbose: true
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/

  deploy_pypi:
    name: Publish all wheels to PyPI
    runs-on: ubuntu-latest
    needs:
      - determine_matrix
      - build_wheels
      - build_mcp
      - create_nightly_tag
      - verify-release-tag
    # Production tags only: all platform wheels must succeed AND the
    # cross-CPython api tests must pass (the only signal the cp312-abi3
    # wheel imports on cp312..cp314 after the build matrix collapse); both
    # are carried by build_wheels, whose per-platform chain runs the api
    # lane after the wheel.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags') &&
      !contains(github.ref, 'dev') &&
      needs.build_wheels.result == 'success' &&
      needs.build_mcp.result == 'success' &&
      (needs.create_nightly_tag.result == 'success' || needs.create_nightly_tag.result == 'skipped') &&
      (needs.verify-release-tag.result == 'skipped' || needs.verify-release-tag.outputs.on-master == 'true')

    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: 'cp[0-9][0-9][0-9]-*'
          path: dist/
          merge-multiple: true

      - name: Exclude suews-mcp (shipped via the agent plugin from git, not PyPI)
        run: rm -f dist/suews_mcp-* dist/suews-mcp-*

      - name: Publish all wheels to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1.14 (v1.14.0 tag commit lacks a published ghcr image)
        with:
          packages-dir: dist/
          verbose: true
          skip-existing: true

  create_github_release:
    name: Create GitHub Release (triggers Zenodo)
    runs-on: ubuntu-latest
    needs:
      - deploy_pypi
    if: always() && needs.deploy_pypi.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare release notes
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          RELEASE_FILE=".github/releases/${VERSION}.md"

          if [ -f "$RELEASE_FILE" ]; then
            echo "Using pre-prepared release notes: $RELEASE_FILE"
            cp "$RELEASE_FILE" release_notes.md
          else
            echo "No pre-prepared release notes found, extracting from CHANGELOG"
            YEAR=$(echo $VERSION | cut -d. -f1)
            MONTH=$(echo $VERSION | cut -d. -f2)
            DAY=$(echo $VERSION | cut -d. -f3)

            MONTH_NAME=$(date -d "$YEAR-$MONTH-$DAY" +"%b" 2>/dev/null || date -j -f "%Y-%m-%d" "$YEAR-$MONTH-$DAY" +"%b" 2>/dev/null || echo "")

            CHANGELOG_SECTION=""
            if [ -n "$MONTH_NAME" ]; then
              CHANGELOG_SECTION=$(awk "/^### $DAY $MONTH_NAME $YEAR/,/^### [0-9]/" CHANGELOG.md | sed '$d' || echo "")
              if [ -z "$CHANGELOG_SECTION" ]; then
                DAY_PADDED=$(printf "%02d" $DAY)
                CHANGELOG_SECTION=$(awk "/^### $DAY_PADDED $MONTH_NAME $YEAR/,/^### [0-9]/" CHANGELOG.md | sed '$d' || echo "")
              fi
            fi

            if [ -z "$CHANGELOG_SECTION" ]; then
              CHANGELOG_SECTION="See [CHANGELOG.md](https://github.com/UMEP-dev/SUEWS/blob/master/CHANGELOG.md) for details."
            fi

            cat << EOF > release_notes.md
          ## Installation

          \`\`\`bash
          pip install --upgrade supy
          \`\`\`

          ## Changes

          $CHANGELOG_SECTION

          ## Citation

          This release is automatically archived on Zenodo and assigned a DOI for academic citation. The DOI will appear here once Zenodo processing is complete (usually within a few minutes).

          ## Documentation

          - [User Guide](https://docs.suews.io)
          - [CHANGELOG](https://github.com/UMEP-dev/SUEWS/blob/master/CHANGELOG.md)
          - [GitHub Repository](https://github.com/UMEP-dev/SUEWS)
          EOF
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          TITLE=$(git tag -l --format='%(contents:subject)' "$VERSION" || echo "SUEWS Release")
          gh release create "$VERSION" \
            --title "SUEWS v$VERSION: $TITLE" \
            --notes-file release_notes.md \
            --verify-tag
