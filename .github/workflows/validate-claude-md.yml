name: Validate shared agent instructions

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/scripts/validate-claude-md.py'
      - '.claude/scripts/test_validate_agents_md.py'
      - '.github/workflows/validate-claude-md.yml'
      - '.claude/rules/**'
  push:
    branches:
      - master
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/scripts/validate-claude-md.py'
      - '.claude/scripts/test_validate_agents_md.py'
      - '.github/workflows/validate-claude-md.yml'
      - '.claude/rules/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 2  # Need previous commit for comparison
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.x'

    - name: Check shared instruction integrity
      run: |
        echo "Validating AGENTS.md and the compatibility import..."
        python -m unittest discover -s .claude/scripts -p test_validate_agents_md.py
        python .claude/scripts/validate-claude-md.py

    - name: Check for content reduction
      run: |
        echo "Checking for content reduction..."

        # Get line counts
        CURRENT_LINES=$(wc -l < AGENTS.md)
        git show HEAD~1:AGENTS.md > AGENTS.md.previous 2>/dev/null || git show HEAD~1:CLAUDE.md > AGENTS.md.previous 2>/dev/null || echo "First commit" > AGENTS.md.previous
        PREVIOUS_LINES=$(wc -l < AGENTS.md.previous)

        echo "Previous version: $PREVIOUS_LINES lines"
        echo "Current version: $CURRENT_LINES lines"

        # Check if this is an intentional restructuring (rule files present)
        REQUIRED_REFS=(
          ".claude/rules/00-project-essentials.md"
          ".claude/rules/fortran/conventions.md"
          ".claude/rules/python/conventions.md"
          ".claude/rules/docs/conventions.md"
          ".claude/rules/tests/patterns.md"
          ".claude/rules/changelog/format.md"
        )

        ALL_REFS_EXIST=true
        for ref in "${REQUIRED_REFS[@]}"; do
          if [ ! -f "$ref" ]; then
            ALL_REFS_EXIST=false
            break
          fi
        done

        # Calculate reduction percentage
        if [ "$PREVIOUS_LINES" -gt 0 ]; then
          REDUCTION=$((PREVIOUS_LINES - CURRENT_LINES))
          PERCENT=$((REDUCTION * 100 / PREVIOUS_LINES))

          if [ "$PERCENT" -gt 20 ]; then
            if [ "$ALL_REFS_EXIST" = true ]; then
              echo "Large reduction detected ($PERCENT%), but required rule files exist"
              echo "   This appears to be an intentional restructuring (rules-based organisation)"
              echo "   Content moved to .claude/rules/:"
              for ref in "${REQUIRED_REFS[@]}"; do
                echo "   - $ref"
              done
            else
              echo "WARNING: AGENTS.md reduced by $PERCENT% ($REDUCTION lines)"
              echo "This might indicate content loss!"
              exit 1
            fi
          elif [ "$PERCENT" -gt 10 ]; then
            echo "Notice: AGENTS.md reduced by $PERCENT% ($REDUCTION lines)"
          fi
        fi

        echo "Content size check passed"

    - name: Create snapshot on failure
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: agent-instructions-snapshot-${{ github.sha }}
        path: |
          AGENTS.md
          CLAUDE.md
          AGENTS.md.previous
          .claude/snapshots/
