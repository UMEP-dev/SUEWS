name: Discourse → GitHub Issue

on:
  repository_dispatch:
    types: [discourse-topic]
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Discourse topic ID"
        required: true
        type: number
      target_repo:
        description: "Target repo (owner/name)"
        required: false
        default: "UMEP-dev/SUEWS"
        type: string

# Fixed across triggers, refs, topic spellings and repository aliases.
# queue:max retains up to 100 pending runs; excess runs are cancelled by GitHub.
concurrency:
  group: discourse-issue-sync
  cancel-in-progress: false
  queue: max

env:
  DISCOURSE_HOST: https://community.suews.io
  DISCOURSE_USERNAME: sunt05
  DEFAULT_REPO: UMEP-dev/SUEWS

jobs:
  create-issue:
    runs-on: ubuntu-latest
    environment: discourse-sync
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_TOPIC_ID: ${{ github.event.client_payload.topic_id || '' }}
          INPUT_TOPIC_ID: ${{ github.event.inputs.topic_id || '' }}
          INPUT_TARGET_REPO: ${{ github.event.inputs.target_repo || '' }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TOPIC_ID="$CLIENT_TOPIC_ID"
            TARGET_REPO="$DEFAULT_REPO"
          else
            TOPIC_ID="$INPUT_TOPIC_ID"
            TARGET_REPO="${INPUT_TARGET_REPO:-$DEFAULT_REPO}"
          fi
          if [[ ! "$TOPIC_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Topic ID must contain only digits"
            exit 1
          fi
          TOPIC_ID=$(python3 -c 'import sys; sys.path.insert(0, ".github/scripts"); from discourse_issue import topic_id; print(topic_id(sys.argv[1]))' "$TOPIC_ID")
          echo "topic_id=${TOPIC_ID}" >> "$GITHUB_OUTPUT"
          DELIMITER="EOF_$(openssl rand -hex 16)"
          printf 'target_repo<<%s\n%s\n%s\n' "$DELIMITER" "$TARGET_REPO" "$DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Fetch Discourse topic
        id: discourse
        env:
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_SUEWS_ADMIN_KEY }}
          TOPIC_ID: ${{ steps.inputs.outputs.topic_id }}
        run: |
          RESPONSE=$(curl -s -f \
            -H "Api-Key: ${DISCOURSE_API_KEY}" \
            -H "Api-Username: ${DISCOURSE_USERNAME}" \
            "${DISCOURSE_HOST}/t/${TOPIC_ID}.json")

          TITLE=$(echo "$RESPONSE" | jq -r '.title')
          SLUG=$(echo "$RESPONSE" | jq -r '.slug')
          TOPIC_URL="${DISCOURSE_HOST}/t/${SLUG}/${TOPIC_ID}"

          # Get the first post (OP)
          FIRST_POST_RAW=$(echo "$RESPONSE" | jq -r '.post_stream.posts[0].cooked')
          AUTHOR=$(echo "$RESPONSE" | jq -r '.post_stream.posts[0].username')

          # Convert HTML to plain-ish markdown (basic cleanup)
          FIRST_POST=$(echo "$FIRST_POST_RAW" \
            | sed 's/<br>/\n/g' \
            | sed 's/<\/p>/\n\n/g' \
            | sed 's/<[^>]*>//g' \
            | sed 's/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g; s/&#39;/'"'"'/g')

          # Treat all forum text as multiline data, never output-file syntax.
          write_output() {
            local delimiter
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >> "$GITHUB_OUTPUT"
          }
          write_output title "$TITLE"
          write_output topic_url "$TOPIC_URL"
          write_output author "$AUTHOR"
          write_output topic_id "$TOPIC_ID"
          write_output body "$FIRST_POST"

      - name: Build issue body
        id: body
        shell: bash
        env:
          TOPIC_URL: ${{ steps.discourse.outputs.topic_url }}
          AUTHOR: ${{ steps.discourse.outputs.author }}
          TOPIC_ID: ${{ steps.discourse.outputs.topic_id }}
          DISCOURSE_BODY: ${{ steps.discourse.outputs.body }}
        run: |
          {
            echo "**Reported on**: [SUEWS Community Forum](${TOPIC_URL})"
            echo "**Reporter**: @${AUTHOR} (Discourse)"
            echo ""
            echo "---"
            echo ""
            echo "${DISCOURSE_BODY}"
            echo ""
            echo "---"
            echo ""
            echo "*Created from [Discourse topic #${TOPIC_ID}](${TOPIC_URL})*"
          } > "$RUNNER_TEMP/issue-body.md"

      - name: Create GitHub issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ steps.inputs.outputs.target_repo }}
          ISSUE_TITLE: ${{ steps.discourse.outputs.title }}
          TOPIC_ID: ${{ steps.inputs.outputs.topic_id }}
        run: |
          python3 .github/scripts/discourse_issue.py issue

      - name: Reply on Discourse
        env:
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_SUEWS_ADMIN_KEY }}
          TOPIC_ID: ${{ steps.discourse.outputs.topic_id }}
          ISSUE_URL: ${{ steps.issue.outputs.issue_url }}
        run: |
          python3 .github/scripts/discourse_issue.py reply

      - name: Update Discourse topic tags
        continue-on-error: true
        env:
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_SUEWS_ADMIN_KEY }}
          TOPIC_ID: ${{ steps.discourse.outputs.topic_id }}
        run: |
          # Fetch current tags, remove github-issue, add github-issue-created
          UPDATED_TAGS=$(curl -s -f \
            -H "Api-Key: ${DISCOURSE_API_KEY}" \
            -H "Api-Username: ${DISCOURSE_USERNAME}" \
            "${DISCOURSE_HOST}/t/${TOPIC_ID}.json" \
            | jq '[.tags[]? | select(. != "github-issue")] + ["github-issue-created"] | unique')

          HTTP_CODE=$(curl -s -o "${RUNNER_TEMP}/tag-response.json" -w '%{http_code}' -X PUT \
            -H "Api-Key: ${DISCOURSE_API_KEY}" \
            -H "Api-Username: ${DISCOURSE_USERNAME}" \
            -H "Content-Type: application/json" \
            -d "{\"tags\": ${UPDATED_TAGS}}" \
            "${DISCOURSE_HOST}/t/-/${TOPIC_ID}.json")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Updated topic ${TOPIC_ID}: removed github-issue, added github-issue-created"
          else
            echo "::warning::Failed to update Discourse tags (HTTP ${HTTP_CODE})"
            cat "${RUNNER_TEMP}/tag-response.json"
          fi
