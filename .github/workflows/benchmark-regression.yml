# SUEWS regression benchmark - see benchmark/README.md.
#
# What a green run of this workflow certifies today:
#   * supply-proof  - the secret -> restricted Zenodo -> benchmark-input path works,
#                     exercised against a SANDBOX record holding SYNTHETIC data.
#   * pinned-results-gate - the harness's unit tests pass, and the regression
#                     decision (benchmark/check_regression.py with
#                     benchmark/regression_thresholds.json) holds across every
#                     consecutive release pair in the COMMITTED results index
#                     (derived statistics already recorded under benchmark/results/).
# What it does NOT do yet: run the current model against the real restricted
#   observations. That is the full-benchmark job below, disabled pending
#   data-governance sign-off; until it is enabled the live comparison of a
#   release candidate is the manual pre-deposit gate in the prep-release skill,
#   which applies the same check_regression.py decision.
name: Benchmark regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC (off-minute, per CI conventions)
  # Run on PRs that touch the benchmark itself, so changes here are validated.
  # (Same-repo branch -> has secrets access; fork PRs do not and will skip cleanly.)
  pull_request:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-regression.yml"

permissions:
  contents: read

concurrency:
  group: benchmark-regression
  cancel-in-progress: false

jobs:
  # Stage 1 — data-supply proof (restricted Zenodo via a GitHub secret).
  supply-proof:
    runs-on: ubuntu-latest
    # Fork PRs cannot read secrets; skip rather than fail.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: python -m pip install --no-input pandas

      - name: Fetch restricted evaluation dataset from Zenodo and validate schema
        working-directory: benchmark
        env:
          # Map the SANDBOX secret to the generic var the resolver reads.
          ZENODO_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
          ZENODO_BASE: https://sandbox.zenodo.org
          OBS_SOURCE: zenodo:${{ vars.BENCHMARK_SANDBOX_RECID || '508290' }}/synthetic_eb_obs.csv
          BENCHMARK_OUT: ${{ github.workspace }}/benchmark_supply_out
        run: python check_supply.py

      - name: Upload supply summary (non-sensitive)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-supply-summary
          path: benchmark_supply_out/

  # Regression decision on the committed, pinned results. Needs no secrets and no
  # model build, so it runs on every trigger (fork PRs included) and turns a
  # daily green into a statement about the harness and the recorded history,
  # not only about the data-supply path.
  pinned-results-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install harness test deps (no supy build)
        run: python -m pip install --no-input pandas packaging pyyaml pytest

      - name: Harness unit tests
        # test_legacy_yaml_roundtrip.py imports supy and is covered by the main
        # test suite's build; everything else under benchmark/tests is pure.
        run: python -m pytest benchmark/tests --ignore=benchmark/tests/test_legacy_yaml_roundtrip.py -q

      - name: Regression decision across the recorded release history
        working-directory: benchmark
        run: python check_regression.py --sweep --report "${RUNNER_TEMP}/regression_report.json"

      - name: Upload regression report (derived statistics only)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-regression-report
          path: ${{ runner.temp }}/regression_report.json

  # Stage 2 — full regression of the CURRENT model against the REAL restricted
  # observations, using the vendored multi-version harness (benchmark/run_benchmark.py).
  # DISABLED until: (a) data-governance sign-off to host the KCL observations on a
  # restricted PRODUCTION Zenodo record with a ZENODO_TOKEN secret and
  # vars.BENCHMARK_PROD_RECID, and (b) the per-release config + page-wiring are
  # finalised. Shown here so the target shape is reviewable; do not enable it by
  # flipping the condition alone.
  full-benchmark:
    if: false
    runs-on: ubuntu-latest
    needs: [supply-proof, pinned-results-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Build current SUEWS (Fortran + Rust) + install supy
        uses: $/.github/actions/build-suews
        with:
          metrics_host_dir: ${{ runner.temp }}/suews-ci-metrics
      - name: Install benchmark requirements
        # The benchmark stats are vendored under benchmark/ (bench_stats.py); only
        # stdlib + numpy/pandas are needed at run time.
        run: uv pip install --system numpy pandas
      - name: Fetch real obs + forcing (restricted production Zenodo)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_BASE: https://zenodo.org
          PROD_RECID: ${{ vars.BENCHMARK_PROD_RECID }}
        run: |
          for F in Kc1_Obs.csv Kc1_forcing_canonical.txt; do
            python benchmark/data_supply.py fetch "zenodo:${PROD_RECID}/$F" "$RUNNER_TEMP/obs"
          done
      - name: Run the benchmark for the current release (reproducibility check)
        # run_benchmark.py runs the pinned model twice and asserts a byte-identical
        # fingerprint. It does NOT compare releases; that is the next step.
        run: |
          V="$(python -c 'import supy; print(supy.__version__)')"
          python benchmark/run_benchmark.py \
            --version "$V" \
            --config benchmark/inputs/UK-LO-KCL_Ward.yaml \
            --forcing "$RUNNER_TEMP/obs/Kc1_forcing_canonical.txt" \
            --obs "$RUNNER_TEMP/obs/Kc1_Obs.csv" \
            --freeze "$RUNNER_TEMP/freeze.txt" \
            --outdir "benchmark/results/$V"
          python benchmark/assemble_index.py
      - name: Regression decision vs the previous release
        # Same decision as the pinned-results gate and the release skill: fails on
        # a material increase beyond benchmark/regression_thresholds.json.
        working-directory: benchmark
        run: |
          V="$(python -c 'import supy; print(supy.__version__)')"
          python check_regression.py --candidate "$V" --report "${RUNNER_TEMP}/regression_report.json"
      - name: Publish derived statistics to the benchmark page
        # Only derived stats are published (no raw data, so no page-level password);
        # wires results/index.json into site/benchmark and hands off to the Pages deploy.
        # NOTE at enablement: also run `python benchmark/assemble_drift.py` and stage
        # benchmark/results/{drift_report.json,drift_table.csv} into
        # site/benchmark/results/ so the cross-version drift page
        # (site/benchmark/drift/index.html, which fetches ../results/drift_table.csv)
        # has data once deployed.
        run: |
          echo "TODO at enablement - render results/index.json into site/benchmark and deploy"
          echo "TODO at enablement - assemble_drift.py and stage drift_table.csv into site/benchmark/results"
