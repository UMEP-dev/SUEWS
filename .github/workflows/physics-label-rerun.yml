name: Re-trigger wheel CI on classification label change

# When 0-physics:change or 0-numerics:change is added or removed on an open PR
# after determine_matrix has already started or completed, re-run the main wheel
# workflow (build-publish_to_pypi.yml) for the PR's current head SHA so
# determine_matrix re-evaluates live PR labels and runs physics-full (or
# restores the non-physics tier) on a fresh full run.
#
# Kept separate from build-publish_to_pypi.yml because PR build validation is a
# required branch-protection status check: adding labeled/unlabeled directly to
# build-publish_to_pypi.yml would either rebuild wheels on every 1-*/2-*/0-pr:*
# label edit or create skipped PR build validation check-runs on unrelated label
# events that overwrite prior check results.

on:
  pull_request:
    types: [labeled, unlabeled]

permissions: {}

concurrency:
  group: physics-label-rerun-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retrigger-wheel-ci:
    name: Re-run wheel CI for classification label change
    if: >-
      github.event.label.name == '0-physics:change' ||
      github.event.label.name == '0-numerics:change'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-run latest wheel workflow for PR head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          echo "Classification label event: ${ACTION} '${LABEL_NAME}' on ${HEAD_SHA}"

          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::notice::PR is from a fork (read-only GITHUB_TOKEN on pull_request events); click 'Re-run all jobs' on 'Build and Publish Python wheels to PyPI and TestPyPI' so determine_matrix picks up '${LABEL_NAME}'."
            exit 0
          fi

          run_json="$(gh api "repos/${REPO}/actions/workflows/build-publish_to_pypi.yml/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=5")"
          run_id="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].id // empty')"
          run_status="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].status // empty')"

          if [[ -z "$run_id" ]]; then
            echo "No existing pull_request run of build-publish_to_pypi.yml found for ${HEAD_SHA}; nothing to re-run."
            exit 0
          fi

          jobs_json="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100")"
          matrix_status="$(printf '%s' "$jobs_json" | jq -r '[.jobs[] | select(.name == "Determine build matrix") | .status] | first // "absent"')"

          if [[ "$run_status" != "completed" && ( "$matrix_status" == "queued" || "$matrix_status" == "waiting" || "$matrix_status" == "absent" ) ]]; then
            echo "Run ${run_id} has not started 'Determine build matrix' yet (status=${matrix_status}); it will query live labels directly."
            exit 0
          fi

          if [[ "$run_status" != "completed" ]]; then
            echo "Cancelling in-progress run ${run_id} (status=${run_status}, matrix_status=${matrix_status}) before full re-run..."
            gh api -X POST "repos/${REPO}/actions/runs/${run_id}/cancel" || true
            for attempt in $(seq 1 24); do
              sleep 5
              cur="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '.status')"
              if [[ "$cur" == "completed" ]]; then
                break
              fi
              echo "Attempt ${attempt}: waiting for run ${run_id} to settle (status=${cur})"
            done
          fi

          echo "Triggering full workflow re-run of build-publish_to_pypi.yml run ${run_id}..."
          gh api -X POST "repos/${REPO}/actions/runs/${run_id}/rerun"
          echo "[OK] Re-triggered run ${run_id} for ${HEAD_SHA}"
