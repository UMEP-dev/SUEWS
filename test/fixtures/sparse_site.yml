name: example_sparse_site
description: |
  Minimal user-assembled config. Deliberately omits physics-required blocks
  (conductance, LAI, tree FAI/heights, bldgh/faibldg) so that gh#1333's
  validator escalation is exercised. Must raise on load.
model:
  control:
    tstep: 300
    start_time: '2012-07-01'
    end_time: '2012-07-10'
    forcing:
      file:
        value: ./forcing.txt
    output:
      format: parquet
      freq: 3600
      dir: ./out
  physics:
    net_radiation:
      value: 3
    emissions:
      value: 2
    storage_heat:
      value: 1
    ohm_inc_qf:
      value: 0
    roughness_length_momentum:
      value: 1
    roughness_length_heat:
      value: 2
    stability:
      value: 3
    soil_moisture_deficit:
      value: 0
    water_use:
      value: 0
    roughness_sublayer:
      value: 1
    frontal_area_index:
      value: 0
    roughness_sublayer_level:
      value: 1
    surface_conductance:
      value: 2
    snow_use:
      value: 0
    stebbs:
      enabled:
        value: false
      parameters:
        value: 1
      capacitance:
        value: 0
      setpoint:
        value: 0
      same_albedo_wall:
        value: 0
      same_albedo_roof:
        value: 0
      same_emissivity_wall:
        value: 0
      same_emissivity_roof:
        value: 0
sites:
- name: example_sparse_site
  gridiv: 7
  properties:
    lat:
      value: 51.5
    lng:
      value: -0.1
    alt:
      value: 50.0
    surfacearea:
      value: 100000.0
    z:
      value: 100.0
    land_cover:
      paved:
        sfr:
          value: 0.22
        soil_depth:
          value: 350.0
        soil_store_capacity:
          value: 150.0
        state_limit:
          value: 0.48
        alb:
          value: 0.08
      bldgs:
        sfr:
          value: 0.50
        soil_depth:
          value: 350.0
        soil_store_capacity:
          value: 150.0
        state_limit:
          value: 0.25
        alb:
          value: 0.15
        bldgh:
          value: 3.5
      dectr:
        sfr:
          value: 0.27
        beta_bio_co2:
          value: 1
        alpha_bio_co2:
          value: 1
        resp_a:
          value: 1
        resp_b:
          value: 1
      evetr:
        sfr:
          value: 0.01
        beta_bio_co2:
          value: 1
        alpha_bio_co2:
          value: 1
        resp_a:
          value: 1
        resp_b:
          value: 1
      grass:
        sfr:
          value: 0.0
        beta_bio_co2:
          value: 1
        alpha_bio_co2:
          value: 1
        resp_a:
          value: 1
        resp_b:
          value: 1
      bsoil:
        sfr:
          value: 0.0
      water:
        sfr:
          value: 0.0
