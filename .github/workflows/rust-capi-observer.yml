name: Rust C-API field observer

# Keep generated observers current with the Fortran TYPE declarations. Run the
# field-binding, manifest, codec, bounds and reverse-checkpoint checks (gh#2096).
#
# Kept separate from rust-test.yml so the observer compiles and links ONLY under
# the opt-in `capi-observer` Cargo feature and never enters shipped wheel or
# default CLI builds.

on:
  pull_request:
    paths:
      - 'src/suews_bridge/**'
      - 'src/suews/src/**'
      - 'src/suews/ext_lib/**'
      - 'src/suews/Makefile'
      - 'src/suews/Makefile.deps'
      - 'src/suews/Makefile.gfortran'
      - 'test/fixtures/bridge/sample_resolved.yml'
      - 'test/fixtures/bridge/stebbs_resolved.yml'
      - 'src/supy/data_model/output/version.py'
      - 'src/supy/data_model/output/artefacts/*/catalogue.json'
      - 'scripts/suews/gen_capi_field_observer.py'
      - '.github/workflows/rust-capi-observer.yml'
  workflow_call:
    inputs:
      head_sha:
        description: 'Commit SHA to check out (defaults to github.sha)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Include github.workflow so standalone pull_request runs and folded
  # workflow_call runs from build-publish_to_pypi.yml never cancel each other.
  group: rust-capi-observer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capi-observer:
    name: C-API field-binding observer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Check generated observer artefacts
        run: |
          set -eu
          python3 scripts/suews/gen_capi_field_observer.py --check

      - name: Install gfortran
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version
          rustc --version
          cargo --version

      - name: Build SUEWS Fortran libraries
        run: make -C src/suews all -j"$(nproc)"

      - name: Run C-API field and snapshot observer tests
        run: |
          set -eu
          if ! cargo test \
                --manifest-path src/suews_bridge/Cargo.toml \
                --features physics,capi-observer \
                --test capi_field_observer --test snapshot_native; then
            echo "::error::C-API field or snapshot observer tests failed in src/suews_bridge/."
            echo "Reproduce locally:"
            echo "    python3 scripts/suews/gen_capi_field_observer.py --check"
            echo "    make -C src/suews all"
            echo "    cargo test --manifest-path src/suews_bridge/Cargo.toml --features physics,capi-observer --test capi_field_observer --test snapshot_native"
            exit 1
          fi
