name: 'Build SUEWS Wheels'
description: 'Build SUEWS wheels with cibuildwheel and cached Rust dependencies'

inputs:
  buildplat:
    description: 'Build platform (e.g., ubuntu-latest, macos-15-intel, windows-2025)'
    required: true
  buildplat_name:
    description: 'Platform name for wheel (e.g., manylinux, macosx, win)'
    required: true
  buildplat_arch:
    description: 'Architecture (e.g., x86_64, arm64, AMD64)'
    required: true
  python:
    description: 'Python version to build for (always cp312 — emits cp312-abi3 wheel)'
    required: true
  test_tier:
    description: 'Test tier: smoke, core, cfg, standard, physics-full, or all'
    required: false
    default: 'standard'
  build_profile:
    description: 'Fortran build profile: release (optimised, no checks, the default) or checked (runtime checks; the nightly physics tier). Read by src/supy/run_make.py and src/suews_bridge/build.rs.'
    required: false
    default: 'release'
  artifact_prefix:
    description: 'Prefix for the wheel and metrics artefact names, so a second build of the same platform (the checked nightly build) does not collide with the release wheels that publish.'
    required: false
    default: ''
  is_testpypi_build:
    description: 'Whether this is a TestPyPI build (adds notice to README)'
    required: false
    default: 'false'
  metrics_host_dir:
    description: 'Host directory persisted across cibuildwheel containers for CI metrics'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Inject TestPyPI notice into README
      if: inputs.is_testpypi_build == 'true'
      shell: bash
      run: |
        # Add TestPyPI notice after the --- separator in README.md
        # This notice only appears in TestPyPI releases, not production PyPI
        # Find the first --- line and insert the notice after it
        SEPARATOR_LINE=$(grep -n '^---$' README.md | head -1 | cut -d: -f1)
        head -n "$SEPARATOR_LINE" README.md > README.tmp
        printf '\n' >> README.tmp
        printf '> **TestPyPI Release**: This is a development version published to [test.pypi.org](https://test.pypi.org/project/supy/).\n' >> README.tmp
        printf '> For installation instructions, see [Testing Development Versions](https://docs.suews.io/latest/installation.html#testing-development-versions) in the documentation.\n' >> README.tmp
        printf '\n' >> README.tmp
        tail -n +"$((SEPARATOR_LINE + 1))" README.md >> README.tmp
        mv README.tmp README.md
        echo "Added TestPyPI notice to README.md"
        head -25 README.md

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: 3.12

    - name: Generate version file from git
      shell: bash
      run: |
        # Generate version file on host (where git is available).
        # This file is copied into the cibuildwheel container.
        python3 get_ver_git.py
        echo "Generated version: $(cat src/supy/_version_scm.py | grep __version__)"

    - name: Prepare cache directories
      shell: bash
      env:
        METRICS_HOST_DIR: ${{ inputs.metrics_host_dir }}
      run: mkdir -p .cargo-cache .rust-target-cache .pip-cache "$METRICS_HOST_DIR"

    - name: Resolve the Rust toolchain version
      id: rust-toolchain
      shell: bash
      run: |
        # The host rustc builds the macOS and Windows wheels directly, and the
        # Linux container installs this same version (CIBW_BEFORE_ALL_LINUX),
        # so the cache key below names the compiler that produced the cached
        # objects. Cargo fingerprints every artefact with the compiler that
        # built it, so a cache from another rustc is restored but never reused.
        version=$(rustc -V | awk '{print $2}')
        echo "rustc $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Compute the Rust build cache key
      id: rust-cache-key
      shell: bash
      env:
        KEY_PREFIX: rust-target-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-${{ inputs.build_profile }}
        RUSTC_VERSION: ${{ steps.rust-toolchain.outputs.version }}
        SOURCE_HASH: ${{ hashFiles('src/suews_bridge/Cargo.lock', 'src/suews_bridge/Cargo.toml', 'src/suews_bridge/build.rs', 'src/suews_bridge/src/**', 'src/suews_bridge/c_api/**') }}
      run: |
        # Content-addressed key (see .claude/rules/ci/conventions.md, "Build
        # caches"): platform, build profile, compiler version and a hash of the
        # bridge inputs. Never a branch name, a date or a manual epoch. A
        # primary-key hit is never re-saved, so everything that can change the
        # cached objects has to be in the key.
        echo "prefix=$KEY_PREFIX" >> "$GITHUB_OUTPUT"
        echo "toolchain-prefix=$KEY_PREFIX-rustc$RUSTC_VERSION-" >> "$GITHUB_OUTPUT"
        echo "key=$KEY_PREFIX-rustc$RUSTC_VERSION-$SOURCE_HASH" >> "$GITHUB_OUTPUT"

    - name: Restore the Rust build cache
      # Not on the scheduled nightly: it always builds cold, so one
      # from-scratch build per day exists on every platform. It still saves
      # (below), because the nightly is the only event that writes the
      # master-scope entries pull requests and the merge queue read.
      if: github.event_name != 'schedule'
      id: rust-cache
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: |
          .cargo-cache
          .rust-target-cache
        key: ${{ steps.rust-cache-key.outputs.key }}
        # The only fallback stays within the same platform, profile and
        # compiler (bridge inputs changed). No any-compiler fallback: cargo
        # ignores objects from another compiler rather than deleting them, so
        # such a fallback would be saved back and grow the entry every time.
        restore-keys: |
          ${{ steps.rust-cache-key.outputs.toolchain-prefix }}

    - name: Report the Rust build cache lookup
      shell: bash
      env:
        PRIMARY_KEY: ${{ steps.rust-cache-key.outputs.key }}
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.rust-cache.outputs.cache-matched-key }}
        RESTORE_SKIPPED: ${{ github.event_name == 'schedule' }}
      run: |
        {
          echo "Rust build cache primary key: $PRIMARY_KEY"
          if [ "$RESTORE_SKIPPED" = "true" ]; then
            echo "Rust build cache restore: skipped (scheduled run builds cold)"
          elif [ "$CACHE_HIT" = "true" ]; then
            echo "Rust build cache restore: exact hit"
          elif [ -n "$MATCHED_KEY" ]; then
            echo "Rust build cache restore: fallback to $MATCHED_KEY"
          else
            echo "Rust build cache restore: miss (no fallback found)"
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Cache pip downloads
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: .pip-cache
        key: pip-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          pip-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-

    - name: Cache MSYS2 pacman packages (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: C:\msys64\var\cache\pacman\pkg
        # No hashFiles source exists for pacman package state, so the key
        # uses a coarse manual epoch instead of a content hash. Bump the
        # `msys2-cache-v1` literal below to force-invalidate this cache
        # (e.g. if it becomes stale or corrupt).
        key: msys2-pkg-${{ runner.os }}-msys2-cache-v1
        restore-keys: |
          msys2-pkg-${{ runner.os }}-

    - name: Build wheels
      uses: pypa/cibuildwheel@9c00cb4f6b517705a3794b22395aedc36257242c # v3.2
      env:
        IS_32_BIT: ${{ inputs.buildplat_arch == 'x86' }}
        # Passed into the Linux container so rustup installs the host's rustc
        # version, the one named in the Rust build cache key above.
        SUEWS_RUST_TOOLCHAIN: ${{ steps.rust-toolchain.outputs.version }}
        CIBW_BUILD: ${{ inputs.python }}-${{ inputs.buildplat_name }}*
        CIBW_ARCHS: ${{ inputs.buildplat_arch }}
        # Mount host cache directories into the Linux Docker container so that
        # cargo artifacts and pip downloads survive container teardown and can
        # be saved by actions/cache.
        # cibuildwheel uses `docker cp` (not bind mount) for the project, so without
        # explicit volume mounts the compiled deps are lost when the container exits.
        CIBW_CONTAINER_ENGINE: >-
          docker; create_args:
          --volume ${{ github.workspace }}/.cargo-cache:/cargo-cache
          --volume ${{ github.workspace }}/.rust-target-cache:/rust-target-cache
          --volume ${{ github.workspace }}/.pip-cache:/pip-cache
          --volume ${{ inputs.metrics_host_dir }}:/ci-metrics
        # CIBW_ENABLE: ${{ inputs.python == 'cp314' && 'cp314' || '' }}
        CIBW_ENVIRONMENT_PASS_LINUX: RUNNER_OS RUNNER_ARCH GITHUB_JOB SUEWS_RUST_TOOLCHAIN
        # Use manylinux_2_28 for Python 3.13+ (newer dependencies require it), manylinux2014 for 3.12 (older Linux compatibility)
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ (inputs.python == 'cp313' || inputs.python == 'cp314') && 'manylinux_2_28' || 'manylinux2014' }}
        CIBW_MANYLINUX_AARCH64_IMAGE: ${{ (inputs.python == 'cp313' || inputs.python == 'cp314') && 'manylinux_2_28' || 'manylinux2014' }}
        # Configure pip and Rust cache — defaults for platforms without
        # a CIBW_ENVIRONMENT_{PLATFORM} override (currently macOS only).
        # NOTE: CIBW_ENVIRONMENT_{PLATFORM} replaces this block entirely,
        # so any vars needed on Linux/Windows must be repeated there.
        CIBW_ENVIRONMENT: >
          PIP_ONLY_BINARY=:all:
          PIP_PREFER_BINARY=1
          PIP_CACHE_DIR=${{ github.workspace }}/.pip-cache
          CARGO_HOME=${{ github.workspace }}/.cargo-cache
          CARGO_TARGET_DIR=${{ github.workspace }}/.rust-target-cache
          SUEWS_BUILD_PROFILE=${{ inputs.build_profile }}
          SUEWS_KNOWLEDGE_GIT_SHA=${{ github.sha }}
          SUEWS_CI_PHASES='${{ inputs.metrics_host_dir }}/physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-phases.json'
          SUEWS_CI_METRICS_DIR='${{ inputs.metrics_host_dir }}'
          SUEWS_CI_METRICS_NAME=physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}
        # Platform-specific: Linux Fortran compiler and Rust toolchain settings
        # NOTE: CIBW_ENVIRONMENT_{PLATFORM} replaces (not merges with) CIBW_ENVIRONMENT,
        # so PIP_PREFER_BINARY and PIP_CACHE_DIR must be repeated here.
        CIBW_ENVIRONMENT_LINUX: >
          FCFLAGS="-fno-optimize-sibling-calls -ffree-line-length-none"
          F90=gfortran
          PIP_ONLY_BINARY=:all:
          PIP_PREFER_BINARY=1
          PIP_CACHE_DIR=/pip-cache
          CARGO_HOME=/cargo-cache
          CARGO_TARGET_DIR=/rust-target-cache
          SUEWS_BUILD_PROFILE=${{ inputs.build_profile }}
          SUEWS_KNOWLEDGE_GIT_SHA=${{ github.sha }}
          SUEWS_CI_PHASES=/ci-metrics/physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-phases.json
          SUEWS_CI_METRICS_DIR=/ci-metrics
          SUEWS_CI_METRICS_NAME=physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}
          PATH="/cargo-cache/bin:$PATH"
        CIBW_BEFORE_ALL_LINUX: >
          python "{package}/scripts/suews/ci_phase_metrics.py" start toolchain_setup &&
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$SUEWS_RUST_TOOLCHAIN" &&
          pip install --upgrade pip setuptools wheel &&
          python "{package}/scripts/suews/ci_phase_metrics.py" stop toolchain_setup
        CIBW_BEFORE_ALL_MACOS: >
          python "{package}/scripts/suews/ci_phase_metrics.py" start toolchain_setup &&
          brew install gfortran &&
          brew unlink gfortran &&
          brew link gfortran &&
          python "{package}/scripts/suews/ci_phase_metrics.py" stop toolchain_setup
        # Windows MSYS2/pacman setup with two workarounds:
        # 1. Core package updates (pacman, msys2-runtime) terminate bash.exe via taskkill - use Windows-level
        #    error suppression (|| ver >nul) since bash can't execute || true when forcibly killed
        # 2. Mirror timeouts cause "Operation too slow" errors - use --disable-download-timeout + retry
        CIBW_BEFORE_ALL_WINDOWS: >
          python "{package}/scripts/suews/ci_phase_metrics.py" start toolchain_setup &&
          (C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm --disable-download-timeout" || ver >nul) &&
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm --disable-download-timeout" &&
          C:\msys64\usr\bin\bash.exe -lc "for i in 1 2 3; do pacman -S --needed --noconfirm --disable-download-timeout mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-openblas && break || { echo Retry $i/3 && sleep 15; }; done" &&
          python "{package}/scripts/suews/ci_phase_metrics.py" stop toolchain_setup
        # Platform-specific: Windows compiler and toolchain settings
        # NOTE: CIBW_ENVIRONMENT_{PLATFORM} replaces (not merges with) CIBW_ENVIRONMENT,
        # so CARGO_HOME/CARGO_TARGET_DIR, PIP_PREFER_BINARY, and PIP_CACHE_DIR
        # must be repeated here.
        CIBW_ENVIRONMENT_WINDOWS: >
          PATH="C:\\msys64\\ucrt64\\bin;$PATH"
          CC=gcc
          CXX=g++
          FC=gfortran
          CFLAGS="-D__USE_MINGW_ANSI_STDIO=1 -mlong-double-64"
          CXXFLAGS="-D__USE_MINGW_ANSI_STDIO=1 -mlong-double-64"
          FCFLAGS="-fno-optimize-sibling-calls -ffree-line-length-none"
          LDFLAGS="-lucrt -static-libgcc -static-libgfortran -LC:/msys64/ucrt64/lib -lsetjmp_compat"
          PIP_ONLY_BINARY=:all:
          PIP_PREFER_BINARY=1
          PIP_CACHE_DIR='${{ github.workspace }}/.pip-cache'
          CARGO_HOME='${{ github.workspace }}/.cargo-cache'
          CARGO_TARGET_DIR='${{ github.workspace }}/.rust-target-cache'
          SUEWS_BUILD_PROFILE='${{ inputs.build_profile }}'
          SUEWS_KNOWLEDGE_GIT_SHA='${{ github.sha }}'
          SUEWS_CI_PHASES='${{ inputs.metrics_host_dir }}\physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-phases.json'
          SUEWS_CI_METRICS_DIR='${{ inputs.metrics_host_dir }}'
          SUEWS_CI_METRICS_NAME=physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}
        CIBW_BEFORE_BUILD: >
          python "{package}/scripts/suews/ci_phase_metrics.py" start build
        CIBW_BEFORE_BUILD_WINDOWS: >
          python "{package}/scripts/suews/ci_phase_metrics.py" start build &&
          echo Creating setjmp compatibility library... &&
          echo int _setjmpex(void* buf) { extern int __intrinsic_setjmpex(void*); return __intrinsic_setjmpex(buf); } > setjmp_compat.c &&
          C:\msys64\ucrt64\bin\gcc.exe -c setjmp_compat.c -o setjmp_compat.o &&
          C:\msys64\ucrt64\bin\ar.exe rcs libsetjmp_compat.a setjmp_compat.o &&
          echo Library created, checking contents: &&
          C:\msys64\ucrt64\bin\nm.exe libsetjmp_compat.a &&
          echo Copying to standard locations: &&
          copy libsetjmp_compat.a C:\msys64\ucrt64\lib\ &&
          copy libsetjmp_compat.a C:\msys64\ucrt64\x86_64-w64-mingw32\lib\ &&
          echo Verifying library locations: &&
          dir C:\msys64\ucrt64\lib\libsetjmp_compat.a &&
          dir C:\msys64\ucrt64\x86_64-w64-mingw32\lib\libsetjmp_compat.a &&
          where python &&
          where gcc &&
          gcc --version &&
          pip install delvewheel
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
          python scripts/suews/ci_phase_metrics.py transition build repair &&
          auditwheel repair -w {dest_dir} {wheel} &&
          python scripts/suews/ci_phase_metrics.py stop repair
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
          python scripts/suews/ci_phase_metrics.py transition build repair &&
          delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} &&
          python scripts/suews/ci_phase_metrics.py stop repair
        CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
          python scripts/suews/ci_phase_metrics.py transition build repair &&
          delvewheel repair -w {dest_dir} {wheel} &&
          python scripts/suews/ci_phase_metrics.py stop repair
        CIBW_BEFORE_TEST: >-
          python "{package}/scripts/suews/ci_phase_metrics.py" start install
        # Pin the scheduler stack so distribution behaviour cannot drift between
        # CI runs. Re-benchmark the fixed-worker candidates before updating.
        CIBW_TEST_REQUIRES: pytest==9.1.1 pytest-xdist==3.8.0 pytest-timeout==2.4.0
        # Test tiers: choose subset based on path detection and trigger.
        # gh#1300: physics tests are binary-determined, so one run per
        # (OS, arch) on the build Python is sufficient. API tests (Python
        # wrapper surface) run separately per (platform x Python) via
        # test-api-cross-python-reusable.yml.
        # Always include --durations=10 to show slowest tests in output.
        # Keep the runner-detected worker budget: GitHub-hosted CPU capacity is
        # the constraint, so adding workers can increase contention. Work
        # stealing balances long simulation tests across the existing workers.
        # After pytest, enforce bridge-manifest coverage of public Fortran types.
        # Uses run_ci_tests.py wrapper to avoid shell-level && chaining,
        # which breaks on Windows cmd.exe with quoted marker expressions.
        CIBW_TEST_COMMAND: >-
          python {project}/scripts/suews/run_ci_tests.py {project}
          -v --tb=short --durations=10 -n auto --maxprocesses=4 --dist worksteal
          ${{ inputs.test_tier == 'smoke' && '-m "physics and smoke and not (medium or slow)"' ||
              inputs.test_tier == 'core' && '-m "physics and (smoke or core) and not slow"' ||
              inputs.test_tier == 'cfg' && '-m "physics and (smoke or cfg) and not slow"' ||
              inputs.test_tier == 'standard' && '-m "physics and (core or not slow)"' ||
              inputs.test_tier == 'physics-full' && '-m physics' ||
              inputs.test_tier == 'all' && '-m physics' ||
              '-m physics' }}
        MACOSX_DEPLOYMENT_TARGET: '15.0'

    - name: Save the Rust build cache
      # Only a miss is worth saving: an existing primary-key entry cannot be
      # overwritten. A merge-queue ref is deleted with its queue entry and a
      # tag ref is never restored from, so nothing could read a cache saved
      # there. Only the release profile is saved: the checked profile is built
      # by the nightly alone, whose restore is skipped, so its entries would
      # never be read. On the scheduled nightly the restore step is skipped
      # and this step saves the cold release build under the master scope.
      if: github.event_name != 'merge_group' && github.ref_type != 'tag' && inputs.build_profile != 'checked' && steps.rust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: |
          .cargo-cache
          .rust-target-cache
        key: ${{ steps.rust-cache-key.outputs.key }}

    - name: Finalise wheel CI metrics
      if: always()
      shell: bash
      env:
        SUEWS_CI_PHASES: ${{ inputs.metrics_host_dir }}/physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-phases.json
        PYTEST_METRICS: ${{ inputs.metrics_host_dir }}/physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-pytest.json
        WHEEL_METRICS: ${{ inputs.metrics_host_dir }}/physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}-wheel-job.json
        PHYSICS_JOB_NAME: physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}
      run: >-
        python scripts/suews/ci_phase_metrics.py
        --state "$SUEWS_CI_PHASES" finalise
        --pytest "$PYTEST_METRICS"
        --output "$WHEEL_METRICS"
        --job-name "$PHYSICS_JOB_NAME"

    - name: Upload wheel CI metrics
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: ${{ inputs.artifact_prefix }}ci-metrics-physics-${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}
        path: ${{ inputs.metrics_host_dir }}/*.json
        if-no-files-found: error
        retention-days: 14

    - name: Verify wheel licence metadata
      shell: bash
      run: python scripts/suews/check_dist_license.py wheelhouse/*.whl

    - name: Upload wheels
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: ${{ inputs.artifact_prefix }}${{ inputs.python }}-${{ inputs.buildplat_name }}-${{ inputs.buildplat_arch }}
        path: ./wheelhouse/*.whl
