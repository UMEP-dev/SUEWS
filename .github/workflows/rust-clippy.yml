name: Rust clippy

# Lint the Rust bridge (src/suews_bridge/) with cargo clippy.
#
# Motivation: .claude/rules/rust/conventions.md noted that clippy was run only
# locally and "nothing in CI or the Makefile currently runs clippy, so it is
# not an automated gate." Python (ruff) and Fortran (fprettify) both have one;
# the ~34k-line Rust bridge did not. This workflow closes that gap.
#
# Lint-only mode (no Fortran build needed):
#   The bridge's build.rs normally compiles the Fortran C API via gfortran and
#   depends on prebuilt SUEWS .mod / static-lib artefacts. clippy only
#   type-checks (it never links), so none of that is required: build.rs honours
#   SUEWS_BRIDGE_LINT_ONLY=1 by generating the one Rust file the sources need
#   (output_cols.rs, produced by parsing Fortran *source* text) and returning
#   before any compilation. This lets the gate lint the whole bridge --
#   including the `physics`-gated FFI under --all-features -- with no gfortran,
#   no SUEWS Fortran build, and no .mod files. It uses the runner's preinstalled
#   rustup, so the only third-party action is the SHA-pinned actions/checkout
#   (satisfies workflow-security.yml).
#
# Maintainers can label a PR `0-ci:clippy-ok` to bypass when a flagged lint is a
# genuine false positive better suppressed with a scoped `#[allow]` in a
# follow-up. Justified, codebase-wide allowances live at the top of
# src/suews_bridge/src/lib.rs.

on:
  pull_request:
    # labeled/unlabeled so adding the bypass label after a failed run re-triggers
    # the gate (same rationale as encoding-audit.yml).
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/suews_bridge/**'
      - 'src/suews/src/suews_ctrl_const.f95'
      - '.github/workflows/rust-clippy.yml'
  workflow_call:
    inputs:
      base_sha:
        description: 'Base commit SHA for single-PR merge_group verification'
        required: false
        type: string
        default: ''
      head_sha:
        description: 'Commit SHA to check out (defaults to github.sha)'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'Pull request number for live bypass-label lookup'
        required: false
        type: string
        default: ''
      merge_head_ref:
        description: 'merge_group head_ref for single-PR bypass-label lookup'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Include github.workflow so standalone pull_request runs and folded
  # workflow_call runs from build-publish_to_pypi.yml never cancel each other.
  group: rust-clippy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: cargo clippy (suews_bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decide whether to skip (PR has bypass label)
        id: bypass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MERGE_HEAD_REF: ${{ inputs.merge_head_ref || github.event.merge_group.head_ref }}
          MERGE_BASE_SHA: ${{ inputs.base_sha || github.event.merge_group.base_sha }}
          BYPASS_LABEL: '0-ci:clippy-ok'
        run: |
          set -euo pipefail
          pr_num=""
          if [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            pr_num="$PR_NUMBER"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            parsed_pr="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
            ref_base_sha="$(printf '%s' "$MERGE_HEAD_REF" | sed -nE 's#.*/pr-[0-9]+-([0-9a-f]+)$#\1#p')"
            if [[ "$parsed_pr" =~ ^[0-9]+$ && -n "${MERGE_BASE_SHA:-}" && "$ref_base_sha" == "$MERGE_BASE_SHA" ]]; then
              pr_num="$parsed_pr"
            fi
          fi

          if [[ -z "$pr_num" ]]; then
            echo "No single-PR context for bypass label lookup; running clippy gate."
            echo "bypass=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matched="$(gh api --paginate "repos/${REPO}/issues/${pr_num}/labels?per_page=100" --jq '[.[].name]' \
            | jq -rs --arg wanted "$BYPASS_LABEL" '[(add // [])[] | select(. == $wanted)] | length')"
          if [[ "$matched" -gt 0 ]]; then
            echo "bypass=true" >> "$GITHUB_OUTPUT"
            echo "PR #${pr_num} carries label '${BYPASS_LABEL}'; skipping clippy gate."
          else
            echo "bypass=false" >> "$GITHUB_OUTPUT"
            echo "PR #${pr_num} does not carry label '${BYPASS_LABEL}'; running clippy gate."
          fi

      - name: Checkout
        if: steps.bypass.outputs.bypass != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Add clippy component
        if: steps.bypass.outputs.bypass != 'true'
        run: |
          set -eu
          rustup component add clippy
          rustc --version
          cargo clippy --version

      - name: Run clippy (deny warnings)
        if: steps.bypass.outputs.bypass != 'true'
        env:
          # Skip native Fortran compilation/linking in build.rs (see header).
          SUEWS_BRIDGE_LINT_ONLY: '1'
        run: |
          set -eu
          if ! cargo clippy \
                --manifest-path src/suews_bridge/Cargo.toml \
                --all-features --all-targets \
                -- -D warnings; then
            echo "::error::cargo clippy reported warnings/errors in src/suews_bridge/."
            echo "Reproduce locally:"
            echo "    SUEWS_BRIDGE_LINT_ONLY=1 cargo clippy --manifest-path src/suews_bridge/Cargo.toml --all-features --all-targets -- -D warnings"
            echo "See .claude/rules/rust/conventions.md. For a genuine false positive, add a scoped"
            echo "#[allow] (justified allowances live at the top of src/suews_bridge/src/lib.rs),"
            echo "or a maintainer may bypass with the '0-ci:clippy-ok' label."
            exit 1
          fi
