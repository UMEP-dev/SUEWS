# Reusable workflow: install the cp312-abi3 wheel into each supported CPython
# version and run `pytest -m "api and <tier>"`. Normal tiers exclude the
# QGIS/UMEP integration lane; `all` keeps it for scheduled/release/manual
# validation where the Windows + Python 3.12 cell matches current QGIS 3 LTR
# and QGIS 4 Windows runtimes.
#
# Called by build-publish_to_pypi.yml. The `api` marker (gh#1300) covers the
# Python wrapper surface — pandas/numpy/pydantic, CLI, SUEWSSimulation —
# which varies per interpreter, so it needs full (platform x Python)
# coverage. Physics tests are binary-determined and run once per platform
# during the build step instead. By isolating the matrix here, the caller
# job shows a single static name that groups cleanly in the Actions UI
# (mirroring the build-wheels-reusable pattern).

name: API cross-CPython tests (reusable)

on:
  workflow_call:
    inputs:
      buildplat_json:
        description: 'JSON array of [runner, platform_name, arch] triples'
        required: true
        type: string
      cells_json:
        description: >-
          JSON array of api jobs per platform, each {"python_version", "shard",
          "tier"}, from scripts/suews/ci_test_layout.py: shard is "" or K-of-N
          (each shard runs the selected tests whose node id hashes to it,
          scripts/suews/pytest_shard.py) and tier is the api tier that cell
          runs (the newer bookend of a ready PR runs core-bookend).
        required: true
        type: string
      test_tier:
        description: 'Test tier of the calling run (smoke|core|cfg|standard|physics-full|all); each cell runs its own tier from cells_json'
        required: true
        type: string
      serial_platforms:
        description: >-
          Comma-separated platform names (manylinux, macosx, win) whose api
          lane runs in one process instead of on xdist workers. The escape
          hatch for a platform that starts swapping or failing only in
          parallel; empty runs every platform on its measured worker count.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  api_cross_python:
    # "api | ..." keeps this leaf distinct from the wheel build's "wheel | ..."
    # leaf under the same caller group in the checks list.
    name: api | ${{ matrix.cell.python_version }} | ${{ matrix.buildplat[1] }} ${{ matrix.buildplat[2] }}${{ matrix.cell.shard && format(' shard {0}', matrix.cell.shard) || '' }}
    runs-on: ${{ matrix.buildplat[0] }}
    # Guardrail: a healthy api-test cell finishes well within this (the `all`
    # tier is ~15-30 min). The cap exists so a hung test fails fast instead of
    # running to GitHub's 6h default and serialising the scarce macOS runner
    # pool into a ~12h zombie run (gh#1522 legacy-table round-trip hang).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        buildplat: ${{ fromJson(inputs.buildplat_json) }}
        # One job per cell; the layout (which Python is sharded and how
        # many ways, which runs the core-bookend tier) comes from the caller's
        # layout job, so this file holds no layout rules.
        cell: ${{ fromJson(inputs.cells_json) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Resolve Python version (cp312 -> 3.12)
        id: pyver
        shell: bash
        env:
          PV: ${{ matrix.cell.python_version }}
        run: |
          echo "spec=3.${PV#cp3}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ steps.pyver.outputs.spec }}

      # uv with a cache keyed on pyproject.toml: the install was 33-41 s per
      # job with pip and no cache, paid once per shard.
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: api-${{ matrix.cell.python_version }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}

      - name: Download wheel for this platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cp312-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}
          path: wheelhouse/

      - name: Download MCP distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: suews-mcp-dist
          path: mcp-dist/

      - name: Compose pytest marker expression for api tier
        id: marker
        shell: bash
        env:
          TIER: ${{ matrix.cell.tier || inputs.test_tier }}
        run: |
          case "$TIER" in
            smoke)    EXPR='api and smoke and not (medium or slow) and not qgis' ;;
            core)     EXPR='api and (smoke or core) and not slow and not qgis' ;;
            cfg)      EXPR='api and (smoke or cfg) and not slow and not qgis' ;;
            standard) EXPR='api and (core or not slow) and not qgis' ;;
            # physics-full (gh#1576): expand only the physics axis to include
            # slow; the api axis stays identical to standard.
            physics-full) EXPR='api and (core or not slow) and not qgis' ;;
            all)      EXPR='api' ;;
            # The newer Python bookend on a ready PR: every core api test
            # (slow included) plus smoke; non-core api tests on it wait for
            # the nightly. scripts/suews/ci_test_layout.py assigns it.
            core-bookend) EXPR='api and (smoke or core) and not qgis' ;;
            *)        echo "::error::Unknown test_tier: $TIER"; exit 1 ;;
          esac
          echo "expr=$EXPR" >> "$GITHUB_OUTPUT"

      - name: Choose the xdist worker count for this platform
        id: workers
        shell: bash
        env:
          PLATFORM: ${{ matrix.buildplat[1] }}
          SERIAL_PLATFORMS: ${{ inputs.serial_platforms }}
        run: |
          # Worker counts measured in ABBA order against the serial lane on
          # the hosted runners (#1786): Linux -n 4 gives 2.04x with a
          # process-tree peak of 2.5 GB on a 16 GB runner, Windows -n 4 gives
          # 2.34x with worker peaks of 0.6 GB, macOS -n 2 gives 1.81x with
          # worker peaks of 1.1 GB on a 7 GB runner. Four workers on macOS
          # swap-crawled this lane (gh#1608), so its count stays at two.
          case "$PLATFORM" in
            manylinux) WORKERS=4 ;;
            win)       WORKERS=4 ;;
            macosx)    WORKERS=2 ;;
            *)         WORKERS=1 ;;
          esac
          SERIAL_LIST=",${SERIAL_PLATFORMS// /},"
          if [[ "$SERIAL_LIST" == *",${PLATFORM},"* ]]; then
            echo "::notice::api lane on ${PLATFORM} serialised through serial_platforms"
            WORKERS=1
          fi
          if [[ "$WORKERS" -gt 1 ]]; then
            echo "xdist_args=-n ${WORKERS} --dist worksteal" >> "$GITHUB_OUTPUT"
          else
            echo "xdist_args=" >> "$GITHUB_OUTPUT"
          fi
          echo "count=${WORKERS}" >> "$GITHUB_OUTPUT"

      - name: Install wheel and run api tests
        shell: bash
        env:
          MARKER_EXPR: ${{ steps.marker.outputs.expr }}
          XDIST_ARGS: ${{ steps.workers.outputs.xdist_args }}
          SHARD: ${{ matrix.cell.shard }}
          SUEWS_CI_METRICS: ci-metrics/api-${{ matrix.cell.python_version }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}${{ matrix.cell.shard && format('-shard-{0}', matrix.cell.shard) || '' }}.json
        run: |
          # Into the setup-python interpreter itself, as pip did, so the
          # interpreter-local suews-mcp check below still holds.
          uv pip install --python "$(python -c 'import sys; print(sys.executable)')" \
            pytest==9.1.1 pytest-xdist==3.8.0 pytest-timeout==2.4.0 hypothesis==6.168.0 \
            wheelhouse/*.whl mcp-dist/*.whl
          # These imports and the interpreter-local executable are the two
          # conditions that otherwise skip the protocol test at collection or
          # setup time. Make either packaging regression fail this lane first.
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import sysconfig

          from mcp.client.session import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          active_bin_dir = Path(sysconfig.get_path("scripts"))
          command = shutil.which("suews-mcp", path=str(active_bin_dir))
          if command is None:
              raise SystemExit(
                  f"suews-mcp is not installed in {active_bin_dir} "
                  f"for {sys.executable}"
              )
          print(f"Protocol dependencies available; suews-mcp={command}")
          PY
          # A focused collection pass makes marker drift or deletion of the
          # protocol file fail with pytest's no-tests-collected exit code.
          python -m pytest --collect-only test/mcp/test_protocol_handshake.py \
            -m "$MARKER_EXPR" -q
          # xdist duplicates every session fixture per worker, so the worker
          # count is per platform and measured, never taken from the CPU count
          # (see the step above); XDIST_ARGS is empty for a serialised
          # platform. The metrics plugin records worker timings and each
          # worker's peak RSS beside them (#1786). A sharded cell (SHARD is
          # K-of-N) keeps only its share of the selected tests; the
          # collection pass above stays unsharded because the protocol test
          # lands in one shard only.
          SHARD_ARGS=""
          if [[ -n "$SHARD" ]]; then
            SHARD_ARGS="-p scripts.suews.pytest_shard --suews-shard ${SHARD/-of-//}"
          fi
          # shellcheck disable=SC2086
          python -m pytest -p scripts.suews.pytest_ci_metrics test \
            -m "$MARKER_EXPR" -v --tb=short --durations=25 $XDIST_ARGS $SHARD_ARGS

      # The core-test guard (scripts/suews/check_core_guard.py) compares what
      # every Linux lane ran against the whole suite, so one Linux cp312 cell
      # (the unsharded one, or shard 1) records every collected node id and its
      # markers with no -m and no shard split. It runs after the tests so a
      # test failure is reported first; it uploads with the metrics below.
      - name: Record the test inventory for the core-test guard
        if: >-
          (success() || failure()) && matrix.buildplat[1] == 'manylinux' &&
          matrix.cell.python_version == 'cp312' && (matrix.cell.shard == '' || startsWith(matrix.cell.shard, '1-of-'))
        shell: bash
        run: |
          python -m pytest -p scripts.suews.pytest_inventory --collect-only -q \
            -p no:cacheprovider test \
            --suews-inventory "ci-metrics/inventory-cp312-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}.json" \
            > /dev/null

      - name: Upload API test metrics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ci-metrics-api-${{ matrix.cell.python_version }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}${{ matrix.cell.shard && format('-shard-{0}', matrix.cell.shard) || '' }}
          path: ci-metrics/*.json
          if-no-files-found: error
          retention-days: 14
