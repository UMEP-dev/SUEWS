# Reusable workflow: build SUEWS abi3 wheels with a matrix strategy, and
# optionally run the api cross-CPython lane on the wheel as soon as it exists.
#
# Called by build-publish_to_pypi.yml. One cp312-abi3 wheel per (OS, arch)
# covers cp312..cp3xx. The caller passes one platform per call (a matrix over
# its platform list), so the api lane below waits for its own platform's
# wheel only: Linux and macOS api tests start when their wheel is built
# instead of when the slowest build (Windows) has finished. A caller that
# passes several platforms in one call still works; its api lane then waits
# for all of them.

name: Build wheels (reusable)

on:
  workflow_call:
    inputs:
      buildplat_json:
        description: 'JSON array of [runner, platform_name, arch] triples'
        required: true
        type: string
      python_json:
        description: 'JSON array of CPython tags used by cibuildwheel (always ["cp312"] — abi3)'
        required: true
        type: string
      test_tier:
        description: 'Test tier: smoke, core, cfg, standard, physics-full, or all'
        required: true
        type: string
      is_testpypi_build:
        description: 'Whether this is a TestPyPI build'
        required: false
        type: string
        default: 'false'
      build_profile:
        description: 'Fortran build profile: release (optimised, no checks, the default) or checked (runtime checks; the nightly physics tier)'
        required: false
        type: string
        default: 'release'
      artifact_prefix:
        description: 'Prefix for the wheel and metrics artefact names (the checked nightly build uses "checked-" so it never collides with the release wheels)'
        required: false
        type: string
        default: ''
      run_api_tests:
        description: 'Run the api cross-CPython lane (test-api-cross-python-reusable.yml) on this call''s platforms once their wheels exist; the lane also needs the suews-mcp-dist artefact, so the caller must depend on the job that uploads it'
        required: false
        type: boolean
        default: false
      api_python_json:
        description: 'JSON array of test-time CPython tags for the api lane (e.g. ["cp312","cp314"]); only read when run_api_tests is true'
        required: false
        type: string
        default: '[]'
      serial_platforms:
        description: 'Comma-separated platform names (manylinux, macosx, win) whose api lane runs in one process instead of on its xdist workers; forwarded to the api lane, and only read when run_api_tests is true'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.python }}-${{ matrix.buildplat[1] }} ${{ matrix.buildplat[2] }}
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      matrix:
        buildplat: ${{ fromJson(inputs.buildplat_json) }}
        python: ${{ fromJson(inputs.python_json) }}
      fail-fast: false

    steps:
      - name: Start checkout phase timing
        shell: bash
        env:
          SUEWS_CI_PHASES: ${{ runner.temp }}/suews-ci-metrics/physics-${{ matrix.python }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}-phases.json
        run: >-
          python -c "import json, os, time; from pathlib import Path;
          path = Path(os.environ['SUEWS_CI_PHASES']);
          path.parent.mkdir(parents=True, exist_ok=True);
          payload = {'schema_version': 1, 'phases': {'checkout':
          {'source': 'runner-step-wall-clock', 'started_at_epoch_seconds': time.time(),
          'status': 'running'}}};
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Stop checkout phase timing
        shell: bash
        env:
          SUEWS_CI_PHASES: ${{ runner.temp }}/suews-ci-metrics/physics-${{ matrix.python }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}-phases.json
        run: python scripts/suews/ci_phase_metrics.py stop checkout

      - name: Build SUEWS wheels
        uses: $/.github/actions/build-suews
        with:
          buildplat: ${{ matrix.buildplat[0] }}
          buildplat_name: ${{ matrix.buildplat[1] }}
          buildplat_arch: ${{ matrix.buildplat[2] }}
          python: ${{ matrix.python }}
          test_tier: ${{ inputs.test_tier }}
          is_testpypi_build: ${{ inputs.is_testpypi_build }}
          build_profile: ${{ inputs.build_profile }}
          artifact_prefix: ${{ inputs.artifact_prefix }}
          metrics_host_dir: ${{ runner.temp }}/suews-ci-metrics

  # The api lane for the platforms built above. It needs the wheel artefact
  # this call uploaded (cp312-<platform>-<arch>) and the suews-mcp-dist
  # artefact from the caller's MCP build, which the caller guarantees by
  # depending on that job and passing run_api_tests only when it succeeded.
  api_cross_python:
    name: API cross-CPython tests
    needs: build
    if: inputs.run_api_tests
    uses: $/.github/workflows/test-api-cross-python-reusable.yml
    with:
      buildplat_json: ${{ inputs.buildplat_json }}
      api_python_json: ${{ inputs.api_python_json }}
      test_tier: ${{ inputs.test_tier }}
      serial_platforms: ${{ inputs.serial_platforms }}
