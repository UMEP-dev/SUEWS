# Reusable workflow: install the cp312-abi3 wheel into each supported CPython
# version and run `pytest -m "api and <tier>"`. Normal tiers exclude the
# QGIS/UMEP integration lane; `all` keeps it for scheduled/release/manual
# validation where the Windows + Python 3.12 cell matches current QGIS 3 LTR
# and QGIS 4 Windows runtimes.
#
# Called by build-publish_to_pypi.yml. The `api` marker (gh#1300) covers the
# Python wrapper surface — pandas/numpy/pydantic, CLI, SUEWSSimulation —
# which varies per interpreter, so it needs full (platform x Python)
# coverage. Physics tests are binary-determined and run once per platform
# during the build step instead. By isolating the matrix here, the caller
# job shows a single static name that groups cleanly in the Actions UI
# (mirroring the build-wheels-reusable pattern).

name: API cross-CPython tests (reusable)

on:
  workflow_call:
    inputs:
      buildplat_json:
        description: 'JSON array of [runner, platform_name, arch] triples'
        required: true
        type: string
      api_python_json:
        description: 'JSON array of test-time CPython tags (e.g. ["cp312","cp314"])'
        required: true
        type: string
      test_tier:
        description: 'Test tier (smoke|core|cfg|standard|all); composed with the `api` marker'
        required: true
        type: string

permissions:
  contents: read

jobs:
  api_cross_python:
    name: ${{ matrix.python_version }}-${{ matrix.buildplat[1] }} ${{ matrix.buildplat[2] }}
    runs-on: ${{ matrix.buildplat[0] }}
    # Guardrail: a healthy api-test cell finishes well within this (the `all`
    # tier is ~15-30 min). The cap exists so a hung test fails fast instead of
    # running to GitHub's 6h default and serialising the scarce macOS runner
    # pool into a ~12h zombie run (gh#1522 legacy-table round-trip hang).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        buildplat: ${{ fromJson(inputs.buildplat_json) }}
        python_version: ${{ fromJson(inputs.api_python_json) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Resolve Python version (cp312 -> 3.12)
        id: pyver
        shell: bash
        env:
          PV: ${{ matrix.python_version }}
        run: |
          echo "spec=3.${PV#cp3}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ steps.pyver.outputs.spec }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Download wheel for this platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cp312-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}
          path: wheelhouse/

      - name: Download MCP distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: suews-mcp-dist
          path: mcp-dist/

      - name: Compose pytest marker expression for api tier
        id: marker
        shell: bash
        env:
          TIER: ${{ inputs.test_tier }}
        run: |
          case "$TIER" in
            smoke)    EXPR='api and smoke and not (medium or slow) and not qgis' ;;
            core)     EXPR='api and (smoke or core) and not slow and not qgis' ;;
            cfg)      EXPR='api and (smoke or cfg) and not slow and not qgis' ;;
            standard) EXPR='api and (core or not slow) and not qgis' ;;
            # physics-full (gh#1576): expand only the physics axis to include
            # slow; the api axis stays identical to standard.
            physics-full) EXPR='api and (core or not slow) and not qgis' ;;
            all)      EXPR='api' ;;
            *)        echo "::error::Unknown test_tier: $TIER"; exit 1 ;;
          esac
          echo "expr=$EXPR" >> "$GITHUB_OUTPUT"

      - name: Install wheel and run api tests
        shell: bash
        env:
          MARKER_EXPR: ${{ steps.marker.outputs.expr }}
          SUEWS_CI_METRICS: ci-metrics/api-${{ matrix.python_version }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}.json
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 pytest-xdist==3.8.0
          python -m pip install wheelhouse/*.whl mcp-dist/*.whl
          # These imports and the interpreter-local executable are the two
          # conditions that otherwise skip the protocol test at collection or
          # setup time. Make either packaging regression fail this lane first.
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import sysconfig

          from mcp.client.session import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          active_bin_dir = Path(sysconfig.get_path("scripts"))
          command = shutil.which("suews-mcp", path=str(active_bin_dir))
          if command is None:
              raise SystemExit(
                  f"suews-mcp is not installed in {active_bin_dir} "
                  f"for {sys.executable}"
              )
          print(f"Protocol dependencies available; suews-mcp={command}")
          PY
          # A focused collection pass makes marker drift or deletion of the
          # protocol file fail with pytest's no-tests-collected exit code.
          python -m pytest --collect-only test/mcp/test_protocol_handshake.py \
            -m "$MARKER_EXPR" -q
          # Run in one process. xdist duplicates every session fixture per
          # worker; the API lane contains simulation outputs large enough to
          # exhaust hosted-runner memory even with two workers.
          python -m pytest -p scripts.suews.pytest_ci_metrics test \
            -m "$MARKER_EXPR" -v --tb=short --durations=25

      - name: Upload API test metrics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ci-metrics-api-${{ matrix.python_version }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}
          path: ci-metrics/*.json
          if-no-files-found: error
          retention-days: 14
