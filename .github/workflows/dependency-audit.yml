name: Dependency and startup audit

on:
  pull_request:
    paths:
      - pyproject.toml
      - Makefile
      - scripts/security/**
      - .github/workflows/dependency-audit.yml
      - .github/workflows/build-publish_to_pypi.yml
      - .github/actions/build-suews/action.yml
  schedule:
    # Nightly audit of dependency intake, startup hooks, and lowest-direct resolution
    - cron: '30 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      head_sha:
        description: 'Commit SHA to check out (defaults to github.sha)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  audit:
    name: Audit Python dependency intake (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requirement markers select different pins per interpreter (pyarrow has
    # separate floors for 3.14 and 3.15), so audit the set an existing
    # interpreter resolves and the one the newest supported CPython resolves.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.15']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Export dependency set
        run: |
          python scripts/security/export_pyproject_requirements.py --extra dev --extra docs > requirements-audit.txt
          echo "Exported $(wc -l < requirements-audit.txt) requirement lines"

      - name: Create isolated audit environment
        run: |
          uv venv .audit-venv
          uv pip install --python .audit-venv/bin/python -r requirements-audit.txt
          uv pip install --python .audit-venv/bin/python pip-audit

      - name: Audit Python startup hooks
        run: .audit-venv/bin/python scripts/security/audit_python_startup.py

      - name: Remove legacy namespace-package pth files
        run: .audit-venv/bin/python scripts/security/remove_legacy_namespace_pth.py

      - name: Audit declared dependencies (advisory)
        continue-on-error: true
        run: |
          set -o pipefail
          .audit-venv/bin/python -m pip_audit | tee pip-audit.txt

      - name: Add advisory scan summary
        if: always()
        run: |
          {
            echo "## pip-audit";
            echo;
            if [ -f pip-audit.txt ]; then
              cat pip-audit.txt;
            else
              echo "pip-audit did not produce output.";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lowest-direct-resolution:
    name: Verify lowest-direct resolution (Python 3.12-3.15)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - name: Check binary-wheel lowest-direct resolution (Python 3.12-3.14 across OSes)
        run: >-
          python scripts/security/check_lowest_direct_resolution.py
          --python-version 3.12
          --python-version 3.13
          --python-version 3.14
          --only-binary-all

      - name: Check sdist-permitted lowest-direct resolution (Python 3.15 across OSes)
        run: >-
          python scripts/security/check_lowest_direct_resolution.py
          --python-version 3.15

      - name: Install lowest-direct core binary wheels (Python 3.12) and audit imports and startup hooks
        run: |
          python scripts/security/export_pyproject_requirements.py > requirements-core.txt
          uv venv --python 3.12 .lowest-venv
          uv pip install --python .lowest-venv/bin/python --resolution=lowest-direct --only-binary :all: -r requirements-core.txt
          .lowest-venv/bin/python scripts/security/audit_python_startup.py
          .lowest-venv/bin/python - <<'PY'
          import importlib
          import importlib.metadata as md

          modules = [
              ("pandas", "pandas"),
              ("numpy", "numpy"),
              ("scipy", "scipy"),
              ("pydantic", "pydantic"),
              ("pyyaml", "yaml"),
              ("f90nml", "f90nml"),
              ("matplotlib", "matplotlib"),
              ("seaborn", "seaborn"),
              ("chardet", "chardet"),
              ("click", "click"),
              ("pyarrow", "pyarrow"),
              ("atmosp", "atmosp"),
              ("scikit-learn", "sklearn"),
              ("lmfit", "lmfit"),
              ("cdsapi", "cdsapi"),
              ("tzfpy", "tzfpy"),
              ("pytz", "pytz"),
              ("jsonschema", "jsonschema"),
              ("rich", "rich"),
              ("packaging", "packaging"),
          ]
          for dist, mod in modules:
              importlib.import_module(mod)
              print(f"  [OK] {dist:14s} == {md.version(dist)}")
          PY
