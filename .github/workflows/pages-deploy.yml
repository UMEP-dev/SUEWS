name: GitHub Pages Deploy

# RELIABLE GITHUB PAGES DEPLOYMENT
# =================================
# Deploys static content from site/ and versioned + latest forcing/output data
# contracts under /contracts/ to GitHub Pages, preserving previously published
# contract versions across deployments.
# - Push to master: Build docs, assemble site/ + contracts/, validate, deploy
# - Pull request: Validate static site/ packaging only (preserves the
#   gh#1431/gh#1432 privilege boundary: no PR docs build, no PR Python
#   execution in this privileged workflow, and no Pages deployment; PR contract
#   publication validation runs unprivileged in data-interface-version-audit.yml)
# - Manual dispatch: Force redeploy
#
# NOTE: YAML config validation is handled by Pydantic at runtime; versioned
# forcing and output data contracts are published under /contracts/.
# NOTE: Fork PRs cannot deploy (no OIDC tokens)

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'src/supy/data_model/**'
      - 'scripts/suews/publish_contracts.py'
      - '.github/workflows/pages-deploy.yml'

  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages-deploy.yml'

  workflow_dispatch:
    inputs:
      allow_contracts_bootstrap:
        description: 'Authorise fresh /contracts/ publication when all contract index URLs return HTTP 404 (initial bootstrap or explicit recovery only)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: write

    # Use 'preview' environment for PRs (no branch restrictions)
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0  # Required for sphinx-last-updated-by-git
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          # Runtime and documentation tooling both require Python 3.12+.
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build documentation
        if: github.event_name != 'pull_request'
        env:
          CI: "true"  # Enable reduced computation in sphinx-gallery examples
        run: |
          uv venv
          source .venv/bin/activate
          # Use non-editable install for CI to avoid meson-python cache path issues
          uv pip install ".[docs]"
          python scripts/security/remove_legacy_namespace_pth.py
          make docs

      - name: Build site
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUM: ${{ github.event.pull_request.number || '' }}
        run: |
          mkdir -p _site

          # Copy production content
          cp -r site/* _site/

          # Add PR preview if applicable
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            PR_DIR="preview/pr-${PR_NUM}"
            mkdir -p "_site/${PR_DIR}"
            cp -r site/* "_site/${PR_DIR}/"
            echo "Preview created at /${PR_DIR}/"

            # Copy Sphinx docs to preview when available (push/manual builds)
            if [ -d docs/build/html ]; then
              mkdir -p "_site/${PR_DIR}/docs"
              cp -r docs/build/html/* "_site/${PR_DIR}/docs/"
              echo "Docs preview created at /${PR_DIR}/docs/"
            fi

            # Rewrite absolute paths for preview context
            # /brand/ -> /preview/pr-N/brand/ so links work within preview
            # https://docs.suews.io -> /preview/pr-N/docs/ so docs links use preview
            echo "Rewriting absolute paths for preview..."
            find "_site/${PR_DIR}" -name "*.html" -type f -not -path "*/${PR_DIR}/docs/*" | while read -r f; do
              sed -i "s|href=\"/brand/|href=\"/${PR_DIR}/brand/|g" "$f"
              sed -i "s|href=\"/\"|href=\"/${PR_DIR}/\"|g" "$f"
              sed -i "s|href=\"https://docs.suews.io[/]*\"|href=\"/${PR_DIR}/docs/\"|g" "$f"
            done

            # Inject preview banner into site pages
            PREVIEW_BANNER='<div id="preview-banner" style="background:linear-gradient(90deg,#0077B6,#F7B538);color:#fff;padding:10px 20px;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-size:13px;position:fixed;top:0;left:0;right:0;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.15);"><strong>Preview - PR #'"${PR_NUM}"'</strong> \&nbsp;\| <a href="https://suews.io/" style="color:#fff;text-decoration:underline;">Production</a> \&nbsp;\| <a href="https://github.com/UMEP-dev/SUEWS/pull/'"${PR_NUM}"'" style="color:#fff;text-decoration:underline;">View PR</a></div><style>body{padding-top:40px !important;}</style>'

            for page in index.html brand/index.html brand/brand-workshop.html brand/suews-logo-source.html; do
              target="_site/${PR_DIR}/${page}"
              if [ -f "$target" ]; then
                sed -i "s|<body>|<body>${PREVIEW_BANNER}|g" "$target"
                sed -i "s|<body |<body>${PREVIEW_BANNER}<body-placeholder |g" "$target"
                sed -i "s|<body-placeholder |<div |g" "$target"
                echo "Injected preview banner into ${page}"
              fi
            done

            # Inject preview banner into docs pages (Sphinx theme structure)
            DOCS_BANNER='<div id="preview-banner" style="background:linear-gradient(90deg,#0077B6,#F7B538);color:#fff;padding:8px 16px;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-size:12px;position:fixed;top:0;left:0;right:0;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.15);"><strong>Docs Preview - PR #'"${PR_NUM}"'</strong> \&nbsp;\| <a href="https://docs.suews.io/" style="color:#fff;text-decoration:underline;">Production Docs</a> \&nbsp;\| <a href="https://github.com/UMEP-dev/SUEWS/pull/'"${PR_NUM}"'" style="color:#fff;text-decoration:underline;">View PR</a></div><style>.bd-header{top:36px !important;}.bd-sidebar-primary{top:calc(var(--pst-header-height) + 36px) !important;}</style>'

            if [ -d "_site/${PR_DIR}/docs" ]; then
              find "_site/${PR_DIR}/docs" -name "*.html" -type f | while read -r f; do
                # Inject banner after <body> tag
                sed -i "s|<body |<body>${DOCS_BANNER}<body-placeholder |g" "$f"
                sed -i "s|<body-placeholder |<div |g" "$f"
              done
              echo "Injected preview banner into docs pages"
            fi
          fi

          touch _site/.nojekyll
          echo "Site ready: $(find _site -type f | wc -l) files"

      - name: Fetch previous published contracts
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CONTRACTS_BASE_URL: https://suews.io
          PREV_CONTRACTS_DIR: _prev_contracts
          ALLOW_CONTRACTS_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_contracts_bootstrap && 'true' || 'false' }}
          CONTRACTS_FETCH_RETRIES: "3"
          CONTRACTS_FETCH_RETRY_DELAY: "2"
          CONTRACTS_FETCH_TIMEOUT: "30"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          INTERFACES = ("forcing", "output")
          BUNDLE_FILES = ("catalogue.json", "catalogue.schema.json", "manifest.json")
          SEMVER_RE = re.compile(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\Z",
              re.ASCII,
          )
          MAX_BYTES = 50 * 1024 * 1024

          base_url = os.environ["CONTRACTS_BASE_URL"].strip().rstrip("/")
          dest = Path(os.environ["PREV_CONTRACTS_DIR"])
          allow_bootstrap = os.environ.get("ALLOW_CONTRACTS_BOOTSTRAP", "false").strip().lower() == "true"
          max_retries = max(1, int(os.environ.get("CONTRACTS_FETCH_RETRIES", "3")))
          retry_delay = max(0.0, float(os.environ.get("CONTRACTS_FETCH_RETRY_DELAY", "2")))
          timeout_s = max(1.0, float(os.environ.get("CONTRACTS_FETCH_TIMEOUT", "30")))

          origin = urllib.parse.urlsplit(base_url)
          if (
              origin.scheme not in ("https", "http")
              or not origin.netloc
              or origin.query
              or origin.fragment
              or origin.username is not None
              or origin.password is not None
          ):
              print(f"[contracts] FAILED: invalid CONTRACTS_BASE_URL: {base_url!r}", file=sys.stderr)
              raise SystemExit(1)

          if dest.is_symlink():
              print(f"[contracts] FAILED: refuses symlink destination: {dest}", file=sys.stderr)
              raise SystemExit(1)
          if dest.exists():
              if dest.is_dir():
                  shutil.rmtree(dest)
              else:
                  print(f"[contracts] FAILED: destination exists and is not a directory: {dest}", file=sys.stderr)
                  raise SystemExit(1)

          class _SameOriginRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  target = urllib.parse.urljoin(req.full_url, newurl)
                  parsed = urllib.parse.urlsplit(target)
                  if (
                      parsed.scheme.lower() != origin.scheme.lower()
                      or parsed.netloc.lower() != origin.netloc.lower()
                  ):
                      raise urllib.error.HTTPError(
                          target,
                          code,
                          f"Refused cross-origin or scheme-downgrade redirect to {target}",
                          headers,
                          fp,
                      )
                  return super().redirect_request(req, fp, code, msg, headers, target)

          opener = urllib.request.build_opener(_SameOriginRedirectHandler)

          def fetch_bytes(url: str, *, allow_not_found: bool = False) -> bytes | None:
              for attempt in range(1, max_retries + 1):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "suews-pages-deploy/1.0",
                          "Cache-Control": "no-cache",
                      },
                  )
                  try:
                      with opener.open(req, timeout=timeout_s) as resp:
                          data = resp.read(MAX_BYTES + 1)
                      if len(data) > MAX_BYTES:
                          raise RuntimeError(f"{url}: response exceeds {MAX_BYTES} byte limit")
                      return data
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404 and allow_not_found:
                          return None
                      if exc.code in (429, 500, 502, 503, 504) and attempt < max_retries:
                          time.sleep(retry_delay * attempt)
                          continue
                      raise RuntimeError(f"HTTP {exc.code} fetching {url}: {exc.reason}") from exc
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      if attempt < max_retries:
                          time.sleep(retry_delay * attempt)
                          continue
                      raise RuntimeError(f"Network error fetching {url}: {exc}") from exc
              raise RuntimeError(f"Exhausted retries fetching {url}")

          def parse_json_object(raw: bytes, label: str) -> dict:
              def _reject_const(token: str):
                  raise ValueError(f"non-standard JSON constant {token!r}")

              try:
                  parsed = json.loads(raw.decode("utf-8"), parse_constant=_reject_const)
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
                  raise RuntimeError(f"{label}: invalid JSON: {exc}") from exc
              if not isinstance(parsed, dict):
                  raise RuntimeError(f"{label}: expected JSON object")
              return parsed

          root_url = f"{base_url}/contracts/index.json"
          try:
              root_raw = fetch_bytes(root_url, allow_not_found=True)
          except RuntimeError as exc:
              print(f"[contracts] FAILED: {exc}", file=sys.stderr)
              raise SystemExit(1)

          if root_raw is None:
              if not allow_bootstrap:
                  print(
                      f"[contracts] FAILED: {root_url} returned HTTP 404 and "
                      "ALLOW_CONTRACTS_BOOTSTRAP is not 'true'. Refusing to publish "
                      "without prior history; trigger workflow_dispatch with "
                      "allow_contracts_bootstrap=true for initial publication or "
                      "verified recovery.",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
              for iface in INTERFACES:
                  probe_url = f"{base_url}/contracts/{iface}/index.json"
                  try:
                      probe_raw = fetch_bytes(probe_url, allow_not_found=True)
                  except RuntimeError as exc:
                      print(
                          f"[contracts] FAILED: bootstrap probe failed for {probe_url}: {exc}",
                          file=sys.stderr,
                      )
                      raise SystemExit(1)
                  if probe_raw is not None:
                      print(
                          f"[contracts] FAILED: {root_url} returned HTTP 404 but "
                          f"{probe_url} still exists; refusing bootstrap to avoid "
                          "discarding published history.",
                          file=sys.stderr,
                      )
                      raise SystemExit(1)
              print(
                  f"[contracts] No prior published contracts at {root_url} or "
                  "interface indices (HTTP 404) and ALLOW_CONTRACTS_BOOTSTRAP=true; "
                  "proceeding with authorised bootstrap publication."
              )
              raise SystemExit(0)

          dest.parent.mkdir(parents=True, exist_ok=True)
          staging = Path(tempfile.mkdtemp(prefix=f".{dest.name}.staging-", dir=dest.parent))
          try:
              root_index = parse_json_object(root_raw, root_url)
              ifaces = root_index.get("interfaces")
              if not isinstance(ifaces, dict) or set(ifaces) != set(INTERFACES):
                  raise RuntimeError(f"{root_url}: unexpected interfaces mapping")
              (staging / "index.json").write_bytes(root_raw)

              counts: dict[str, int] = {}
              for iface in INTERFACES:
                  iface_meta = ifaces[iface]
                  if not isinstance(iface_meta, dict) or not isinstance(iface_meta.get("versions"), list):
                      raise RuntimeError(f"{root_url}: missing versions list for {iface}")
                  versions = iface_meta["versions"]
                  if not versions:
                      raise RuntimeError(f"{root_url}: empty versions list for {iface}")
                  for ver in versions:
                      if not isinstance(ver, str) or SEMVER_RE.fullmatch(ver) is None:
                          raise RuntimeError(f"{root_url}: invalid version {ver!r} for {iface}")
                  if len(set(versions)) != len(versions):
                      raise RuntimeError(f"{root_url}: duplicate versions list for {iface}")

                  iface_url = f"{base_url}/contracts/{iface}/index.json"
                  iface_raw = fetch_bytes(iface_url)
                  assert iface_raw is not None
                  iface_index = parse_json_object(iface_raw, iface_url)
                  raw_entries = iface_index.get("versions")
                  if (
                      iface_index.get("interface") != iface
                      or not isinstance(raw_entries, list)
                      or [
                          e.get("version") if isinstance(e, dict) else None
                          for e in raw_entries
                      ] != versions
                  ):
                      raise RuntimeError(f"{iface_url}: version inventory disagrees with {root_url}")

                  iface_dir = staging / iface
                  iface_dir.mkdir(parents=True, exist_ok=True)
                  (iface_dir / "index.json").write_bytes(iface_raw)

                  for ver in versions:
                      ver_dir = iface_dir / ver
                      ver_dir.mkdir(parents=True, exist_ok=True)
                      for fname in BUNDLE_FILES:
                          file_url = f"{base_url}/contracts/{iface}/{ver}/{fname}"
                          file_raw = fetch_bytes(file_url)
                          assert file_raw is not None
                          (ver_dir / fname).write_bytes(file_raw)

                  counts[iface] = len(versions)

              staging.rename(dest)
              print(
                  f"[OK] Fetched prior published contracts into {dest} "
                  f"(forcing: {counts['forcing']}, output: {counts['output']})"
              )
          except RuntimeError as exc:
              print(f"[contracts] FAILED: {exc}", file=sys.stderr)
              raise SystemExit(1)
          finally:
              if staging.exists():
                  shutil.rmtree(staging)
          PY

      - name: Build and validate data contracts
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CONTRACTS_BASE_URL: https://suews.io
          CONTRACTS_OUTPUT_DIR: _site/contracts
          PREV_CONTRACTS_DIR: _prev_contracts
        run: |
          set -euo pipefail
          if [ -n "${CONTRACTS_PYTHON:-}" ]; then
            RUN_PY=("${CONTRACTS_PYTHON}")
          elif [ -x .venv/bin/python ]; then
            RUN_PY=(.venv/bin/python)
          else
            RUN_PY=(uv run --no-project --with 'jsonschema>=4.18' --with 'pydantic>=2.12' python)
          fi
          PUBLISH_ARGS=(
            scripts/suews/publish_contracts.py
            --output-dir "${CONTRACTS_OUTPUT_DIR}"
            --base-url "${CONTRACTS_BASE_URL}"
          )
          if [ -d "${PREV_CONTRACTS_DIR}" ]; then
            PUBLISH_ARGS+=(--preserve-from "${PREV_CONTRACTS_DIR}")
          fi
          "${RUN_PY[@]}" "${PUBLISH_ARGS[@]}"
          "${RUN_PY[@]}" scripts/suews/publish_contracts.py \
            --validate-only "${CONTRACTS_OUTPUT_DIR}" \
            --base-url "${CONTRACTS_BASE_URL}"
          rm -rf "${PREV_CONTRACTS_DIR}"

      # Fork PRs cannot deploy - they lack OIDC tokens required by deploy-pages
      # Detect fork: compare PR head repo with base repo
      - name: Check if fork PR
        id: fork-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name || '' }}
          BASE_REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            HEAD_REPO="${HEAD_REPO_FULL_NAME}"
            BASE_REPO="${BASE_REPO_FULL_NAME}"
            if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
              echo "is_fork=true" >> $GITHUB_OUTPUT
              echo "::notice::Fork PR detected ($HEAD_REPO) - skipping deployment"
            else
              echo "is_fork=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: github.event_name != 'pull_request' && steps.fork-check.outputs.is_fork != 'true'

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && steps.fork-check.outputs.is_fork != 'true'
        with:
          path: _site

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        if: github.event_name != 'pull_request' && steps.fork-check.outputs.is_fork != 'true'
        id: deployment

      - name: Comment fork PR status
        if: github.event_name == 'pull_request' && steps.fork-check.outputs.is_fork == 'true'
        continue-on-error: true  # Token may lack permission for fork PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.issue.number;
            const body = `## Docs Build Validated ✓

            Documentation built successfully. Preview deployment is not available for fork PRs (GitHub security restriction).

            A maintainer can test the preview locally with \`make docs\`.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Docs Build Validated')
            );

            if (!botComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.fork-check.outputs.is_fork != 'true' && steps.deployment.outputs.page_url != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.issue.number;
            const body = `## Preview Deployed

            | Content | Preview URL |
            |---------|-------------|
            | Site | https://suews.io/preview/pr-${prNumber}/ |
            | Docs | https://suews.io/preview/pr-${prNumber}/docs/ |

            > [!NOTE]
            > This preview is ephemeral. It will be lost when:
            > - Another PR with \`site/\` or \`docs/\` changes is pushed
            > - Changes are merged to master
            > - A manual workflow dispatch runs
            >
            > To restore, push any commit to this PR.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
